<body><div class="app"><header class="top"><div class="brand"><div class="logo">🏛️</div><div><b>ARCHCMU Global Challenge</b><small>Chiang Mai · Thailand · Architecture · PhD Research</small></div></div><div class="topActions"><div class="status idle" id="status"><span class="dot"></span><span id="statusText">Ready</span></div><button class="topBtn" id="soundBtn" type="button">🔊</button><button class="topBtn" id="homeBtn" type="button">New Room</button></div></header><main class="main" id="main"></main><footer class="footer">Open page → scan QR → choose avatar → type name → Join → Start</footer></div><div class="confetti" id="confetti"></div><script>const QUESTIONS=[{"id":1,"points":1,"questionZh":"建筑学生在最终提交前，最可能出现的“最终版”文件名是哪一个？","questionEn":"Which file name most realistically belongs to an architecture student’s “final” submission?","answers":[{"letter":"A","zh":"Final_Submission.pdf","en":"Final_Submission.pdf"},{"letter":"B","zh":"Project_Complete_v1.pdf","en":"Project_Complete_v1.pdf"},{"letter":"C","zh":"FINAL_v8_really_final_USE_THIS_ONE_render_fixed.pdf","en":"FINAL_v8_really_final_USE_THIS_ONE_render_fixed.pdf"}],"correctIndex":2,"explanationZh":"这是一道热身趣味题，不是学术事实。建筑设计常经历大量修改，“最终版”文件名往往会不断变长。","explanationEn":"This is a warm-up joke rather than an academic fact. Architecture files often acquire increasingly desperate names after many revisions.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"finalfile"},{"id":2,"points":1,"questionZh":"开始一项博士研究时，最重要的第一步通常是什么？","questionEn":"When beginning a PhD study, what is usually the most important first step?","answers":[{"letter":"A","zh":"提出一个清晰、聚焦且可研究的问题","en":"Formulate a clear, focused, and researchable question"},{"letter":"B","zh":"在没有问题的情况下尽可能收集数据","en":"Collect as much data as possible without a question"},{"letter":"C","zh":"先决定统计软件，再选择研究主题","en":"Choose statistical software before selecting a topic"}],"correctIndex":0,"explanationZh":"清晰的研究问题会引导文献综述、研究设计、数据收集与分析。","explanationEn":"A clear research question guides the literature review, research design, data collection, and analysis.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"question"},{"id":3,"points":1,"questionZh":"“Chiang Mai（清迈）”在泰语中的字面意思是什么？","questionEn":"What does “Chiang Mai” literally mean in Thai?","answers":[{"letter":"A","zh":"古老首都","en":"Old Capital"},{"letter":"B","zh":"北方山城","en":"Northern Mountain City"},{"letter":"C","zh":"新城","en":"New City"}],"correctIndex":2,"explanationZh":"“Chiang”意为城市，“Mai”意为新的，因此 Chiang Mai 即“新城”。","explanationEn":"“Chiang” means city and “Mai” means new, so Chiang Mai means “New City.”","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"newcity"},{"id":4,"points":2,"questionZh":"根据维特鲁威（Vitruvius），建筑的三个基本原则是什么？","questionEn":"According to Vitruvius, what are the three fundamental principles of architecture?","answers":[{"letter":"A","zh":"形式、空间、光线","en":"Form, Space, and Light"},{"letter":"B","zh":"坚固、实用、美观（Firmitas, Utilitas, Venustas）","en":"Firmitas, Utilitas, and Venustas"},{"letter":"C","zh":"便宜、快速、优质","en":"Cheap, Fast, and Good"}],"correctIndex":1,"explanationZh":"通常译为坚固或稳定、实用或功能、美观或愉悦，是经典建筑评价框架。","explanationEn":"The triad is commonly translated as firmness, utility, and beauty or delight.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"vitruvius"},{"id":5,"points":1,"questionZh":"博士论文中的文献综述最主要的作用是什么？","questionEn":"What is the main purpose of a literature review in a PhD thesis?","answers":[{"letter":"A","zh":"完全替代实地调查","en":"Completely replace fieldwork"},{"letter":"B","zh":"梳理已有知识、识别研究空白并定位本研究","en":"Map existing knowledge, identify a gap, and position the study"},{"letter":"C","zh":"保证研究一定能够提出全新理论","en":"Guarantee that the study will produce an entirely new theory"}],"correctIndex":1,"explanationZh":"文献综述不是资料堆积，而是说明已有研究做了什么、还缺什么，以及你的研究为何必要。","explanationEn":"A literature review shows what is known, what remains unresolved, and why the new study is needed.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"literature"},{"id":6,"points":2,"questionZh":"泰国最高峰茵他侬山（Doi Inthanon）的海拔约为多少？","questionEn":"Approximately how high is Doi Inthanon, Thailand’s highest peak?","answers":[{"letter":"A","zh":"1,565 米","en":"1,565 metres"},{"letter":"B","zh":"2,165 米","en":"2,165 metres"},{"letter":"C","zh":"2,565 米","en":"2,565 metres"}],"correctIndex":2,"explanationZh":"茵他侬山海拔约 2,565 米，位于清迈府，是泰国最高点。","explanationEn":"Doi Inthanon rises to about 2,565 metres in Chiang Mai Province and is Thailand’s highest point.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"inthanon"},{"id":7,"points":2,"questionZh":"东南亚传统店屋中的“五脚基（Five-Foot Way）”最主要的环境功能是什么？","questionEn":"What is the main environmental function of the Five-Foot Way in Southeast Asian shophouses?","answers":[{"letter":"A","zh":"为行人提供遮阳避雨的连续有顶通道","en":"Provide a continuous sheltered walkway protected from sun and rain"},{"letter":"B","zh":"作为人力车专用停车位","en":"Serve as dedicated rickshaw parking"},{"letter":"C","zh":"作为抵抗地震的结构缓冲带","en":"Act as a structural earthquake buffer"}],"correctIndex":0,"explanationZh":"连续骑楼空间改善了热带气候下的步行舒适性，并连接街道与店铺。","explanationEn":"The covered arcade improves pedestrian comfort in a tropical climate and links shops with the street.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"fivefoot"},{"id":8,"points":1,"questionZh":"以下哪一种属于定量数据？","questionEn":"Which of the following is quantitative data?","answers":[{"letter":"A","zh":"30 名参与者以厘米记录的身高","en":"The heights of 30 participants recorded in centimetres"},{"letter":"B","zh":"参与者讲述的居住经历","en":"Participants’ stories about their living experiences"},{"letter":"C","zh":"研究者的现场观察笔记","en":"The researcher’s field observation notes"}],"correctIndex":0,"explanationZh":"定量数据以数值形式表达，可进行统计描述和分析。","explanationEn":"Quantitative data are expressed numerically and can be statistically described and analysed.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"quantitative"},{"id":9,"points":1,"questionZh":"泰国泼水节（Songkran）主要在每年的哪个月份庆祝？","questionEn":"In which month is Songkran mainly celebrated each year?","answers":[{"letter":"A","zh":"一月","en":"January"},{"letter":"B","zh":"四月","en":"April"},{"letter":"C","zh":"十一月","en":"November"}],"correctIndex":1,"explanationZh":"宋干节通常在四月中旬举行，是泰国传统新年庆典。","explanationEn":"Songkran is normally celebrated in mid-April as the traditional Thai New Year.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"songkran"},{"id":10,"points":2,"questionZh":"在 1:100 的建筑模型中，现实中 3 米的高度应做成多少厘米？","questionEn":"In a 1:100 architectural model, how many centimetres represent a real height of 3 metres?","answers":[{"letter":"A","zh":"0.3 厘米","en":"0.3 cm"},{"letter":"B","zh":"30 厘米","en":"30 cm"},{"letter":"C","zh":"3 厘米","en":"3 cm"}],"correctIndex":2,"explanationZh":"3 米等于 300 厘米；300 ÷ 100 = 3 厘米。","explanationEn":"Three metres equals 300 centimetres; 300 divided by 100 equals 3 centimetres.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"scale"},{"id":11,"points":2,"questionZh":"开展试点研究（pilot study）的主要目的是什么？","questionEn":"What is the main purpose of conducting a pilot study?","answers":[{"letter":"A","zh":"测试研究流程、工具、招募和现场执行是否可行","en":"Test whether procedures, tools, recruitment, and implementation are feasible"},{"letter":"B","zh":"最终证明研究假设","en":"Definitively prove the research hypothesis"},{"letter":"C","zh":"完全替代正式研究","en":"Completely replace the full study"}],"correctIndex":0,"explanationZh":"试点研究用于发现流程问题并改进正式研究，而不是直接得出最终结论。","explanationEn":"A pilot identifies practical problems and improves the main study rather than producing final conclusions.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"pilot"},{"id":12,"points":1,"questionZh":"清迈曾经是哪一个古代王国的首都？","questionEn":"Chiang Mai was historically the capital of which kingdom?","answers":[{"letter":"A","zh":"素可泰王国","en":"Sukhothai Kingdom"},{"letter":"B","zh":"兰纳王国","en":"Lanna Kingdom"},{"letter":"C","zh":"大城王国","en":"Ayutthaya Kingdom"}],"correctIndex":1,"explanationZh":"清迈于 1296 年建立，并成为兰纳王国的重要首都。","explanationEn":"Chiang Mai was founded in 1296 and became the principal capital of the Lanna Kingdom.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"lanna"},{"id":13,"points":3,"questionZh":"以下哪一项最准确地描述“适应性再利用（adaptive reuse）”？","questionEn":"Which statement best defines adaptive reuse?","answers":[{"letter":"A","zh":"拆除旧建筑，并按原样复制一栋新建筑","en":"Demolish an old building and construct a replica"},{"letter":"B","zh":"所有旧建筑都只能改为博物馆","en":"Convert every old building into a museum"},{"letter":"C","zh":"在保留重要建筑特征与价值的同时，为既有建筑赋予新的适宜用途","en":"Give an existing building a suitable new use while retaining significant fabric and values"}],"correctIndex":2,"explanationZh":"适应性再利用强调既有建筑的持续使用、新功能与遗产价值之间的协调。","explanationEn":"Adaptive reuse balances continued use, a new function, and the retention of significant architectural or heritage values.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"reuse"},{"id":14,"points":1,"questionZh":"什么是混合研究方法（mixed methods research）？","questionEn":"What is mixed methods research?","answers":[{"letter":"A","zh":"只使用两种不同的定性方法","en":"Using only two different qualitative methods"},{"letter":"B","zh":"在同一研究中整合定量与定性方法和结果","en":"Integrating quantitative and qualitative methods and findings in one study"},{"letter":"C","zh":"同时使用两种统计软件","en":"Using two statistical software packages"}],"correctIndex":1,"explanationZh":"关键不只是同时收集两类数据，还要在研究设计、分析或解释阶段进行整合。","explanationEn":"The key is not merely collecting both kinds of data, but integrating them in design, analysis, or interpretation.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"mixed"},{"id":15,"points":2,"questionZh":"按照常见的行政统计口径，将曼谷这一特别行政区计算在内，泰国共有多少个府级行政区？","questionEn":"In the commonly used administrative count, including Bangkok’s special administrative status, how many province-level areas does Thailand have?","answers":[{"letter":"A","zh":"77 个","en":"77"},{"letter":"B","zh":"76 个","en":"76"},{"letter":"C","zh":"78 个","en":"78"}],"correctIndex":0,"explanationZh":"泰国有 76 个府；曼谷具有特别行政地位，常与其合计为 77 个府级行政区。","explanationEn":"Thailand has 76 provinces; Bangkok has special administrative status and is commonly included for a total of 77 province-level areas.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"provinces"},{"id":16,"points":1,"questionZh":"哪位建筑师最常与“Less is more（少即是多）”这句话联系在一起？","questionEn":"Which architect is most closely associated with the phrase “Less is more”?","answers":[{"letter":"A","zh":"扎哈·哈迪德","en":"Zaha Hadid"},{"letter":"B","zh":"罗伯特·文丘里","en":"Robert Venturi"},{"letter":"C","zh":"路德维希·密斯·凡·德·罗","en":"Ludwig Mies van der Rohe"}],"correctIndex":2,"explanationZh":"这句话被广泛用于概括密斯的现代主义与极简设计思想。","explanationEn":"The phrase is widely associated with Mies’s modernist and minimalist design approach.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"lessmore"},{"id":17,"points":2,"questionZh":"若研究者希望样本更能代表明确界定的目标总体，以下哪一种做法通常最好？","questionEn":"If a researcher wants a sample to better represent a clearly defined target population, which approach is generally best?","answers":[{"letter":"A","zh":"只选择最容易接触到的人","en":"Select only the easiest people to reach"},{"letter":"B","zh":"只邀请意见最强烈的志愿者","en":"Invite only volunteers with the strongest opinions"},{"letter":"C","zh":"从清晰的抽样框中采用适当的概率随机抽样","en":"Use an appropriate probability sample from a clearly defined sampling frame"}],"correctIndex":2,"explanationZh":"概率抽样不能自动消除所有偏差，但通常比便利抽样更有利于总体代表性。","explanationEn":"Probability sampling does not eliminate every bias, but it generally supports representativeness better than convenience sampling.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"sampling"},{"id":18,"points":2,"questionZh":"通往清迈素贴山双龙寺的著名纳迦阶梯大约有多少级台阶？","questionEn":"Approximately how many steps are on the famous Naga staircase leading to Wat Phra That Doi Suthep?","answers":[{"letter":"A","zh":"300 级","en":"300 steps"},{"letter":"B","zh":"306 级","en":"306 steps"},{"letter":"C","zh":"360 级","en":"360 steps"}],"correctIndex":1,"explanationZh":"这条由纳迦护卫的阶梯通常被记载为 306 级，是双龙寺最具辨识度的到达路径之一。","explanationEn":"The Naga-flanked staircase is commonly recorded as having 306 steps and is one of the temple’s most recognisable approaches.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"steps"},{"id":19,"points":2,"questionZh":"传统泰式高脚屋采用架空地面的主要环境原因是什么？","questionEn":"What is the main environmental reason for raising the floors of traditional Thai houses?","answers":[{"letter":"A","zh":"主要为了装饰","en":"Mainly for decoration"},{"letter":"B","zh":"减轻洪水影响并促进地板下方通风","en":"Reduce flood impact and improve airflow beneath the floor"},{"letter":"C","zh":"只为了让房屋显得更高","en":"Only to make the house appear taller"}],"correctIndex":1,"explanationZh":"架空设计适应热带季风环境，同时还能形成阴凉、通风的半室外使用空间。","explanationEn":"Raised construction responds to monsoon conditions and can also create shaded, ventilated semi-outdoor space.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"stilt"},{"id":20,"points":2,"questionZh":"一个测量工具在相似条件下反复使用时能够产生相近结果，这主要说明它具有较高的什么？","questionEn":"If a measurement tool produces similar results under similar conditions, what quality does it primarily demonstrate?","answers":[{"letter":"A","zh":"信度（Reliability）","en":"Reliability"},{"letter":"B","zh":"效度（Validity）","en":"Validity"},{"letter":"C","zh":"反思性（Reflexivity）","en":"Reflexivity"}],"correctIndex":0,"explanationZh":"信度关注测量结果的一致性与可重复性；效度则关注是否测到了想测的概念。","explanationEn":"Reliability concerns consistency and reproducibility; validity concerns whether the intended concept is actually measured.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"reliability"},{"id":21,"points":2,"questionZh":"“泰国宋干节（Songkran in Thailand）”于哪一年被列入联合国教科文组织人类非物质文化遗产代表作名录？","questionEn":"In which year was “Songkran in Thailand” inscribed on UNESCO’s Representative List of the Intangible Cultural Heritage of Humanity?","answers":[{"letter":"A","zh":"2018 年","en":"2018"},{"letter":"B","zh":"2021 年","en":"2021"},{"letter":"C","zh":"2023 年","en":"2023"}],"correctIndex":2,"explanationZh":"“Songkran in Thailand”于 2023 年被列入该名录。","explanationEn":"“Songkran in Thailand” was inscribed on the UNESCO list in 2023.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"中等","difficultyEn":"Medium","timeLimit":18,"visual":"songkran"},{"id":22,"points":1,"questionZh":"在泰国寺庙建筑中，“Chedi（佛塔）”通常指什么？","questionEn":"In Thai temple architecture, what is a chedi?","answers":[{"letter":"A","zh":"通常用于供奉圣物的佛塔或窣堵坡","en":"A stupa or reliquary structure that commonly contains sacred relics"},{"letter":"B","zh":"僧侣宿舍","en":"Monks’ living quarters"},{"letter":"C","zh":"寺庙市场亭","en":"A temple market pavilion"}],"correctIndex":0,"explanationZh":"Chedi 是泰国佛寺建筑群中的重要宗教构筑物，常与圣物供奉和纪念功能相关。","explanationEn":"A chedi is a major sacred structure in a Thai temple complex, commonly associated with relics and commemoration.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"简单","difficultyEn":"Easy","timeLimit":15,"visual":"chedi"},{"id":23,"points":3,"questionZh":"若一份“空间归属感”问卷能够准确测量研究者所定义的空间归属感，而不是测量一般满意度，这主要体现了什么？","questionEn":"If a “sense of place” questionnaire accurately measures the defined construct rather than general satisfaction, what does this primarily demonstrate?","answers":[{"letter":"A","zh":"所有参与者的答案完全相同","en":"All participants give identical answers"},{"letter":"B","zh":"样本量足够大","en":"The sample is sufficiently large"},{"letter":"C","zh":"较高的效度（Validity）","en":"High validity"}],"correctIndex":2,"explanationZh":"效度关注工具是否真正测量了目标概念；仅有一致性或大样本并不能证明效度。","explanationEn":"Validity concerns whether an instrument measures the intended construct; consistency or a large sample alone does not establish validity.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"validity"},{"id":24,"points":3,"questionZh":"泰国与多少个国家拥有陆地边界？","questionEn":"How many countries share a land border with Thailand?","answers":[{"letter":"A","zh":"4 个","en":"4"},{"letter":"B","zh":"5 个","en":"5"},{"letter":"C","zh":"6 个","en":"6"}],"correctIndex":0,"explanationZh":"泰国的陆地邻国是缅甸、老挝、柬埔寨和马来西亚，共 4 个。","explanationEn":"Thailand shares land borders with Myanmar, Laos, Cambodia, and Malaysia: four countries.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"borders"},{"id":25,"points":3,"questionZh":"兰纳传统住宅屋脊顶部常见的 V 形交叉木构装饰叫什么？","questionEn":"What is the V-shaped crossed timber ornament commonly seen at the roof apex of traditional Lanna houses called?","answers":[{"letter":"A","zh":"Kalae（กาแล）","en":"Kalae"},{"letter":"B","zh":"Chedi","en":"Chedi"},{"letter":"C","zh":"Five-Foot Way","en":"Five-Foot Way"}],"correctIndex":0,"explanationZh":"Kalae 是兰纳传统住宅最具辨识度的屋顶构件与装饰之一，不应与寺庙屋顶的 Chofa 混淆。","explanationEn":"Kalae is a distinctive roof feature of traditional Lanna houses and should not be confused with the chofa used on temple roofs.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"kalae"},{"id":26,"points":3,"questionZh":"研究中的“三角互证（triangulation）”通常指什么？","questionEn":"What does triangulation usually mean in research?","answers":[{"letter":"A","zh":"把样本平均分成三个小组","en":"Divide the sample into three equal groups"},{"letter":"B","zh":"把同一份问卷重复发放三次","en":"Administer the same questionnaire three times"},{"letter":"C","zh":"使用多种方法、数据来源或研究者，对发现进行相互验证和深化解释","en":"Use multiple methods, data sources, or researchers to corroborate findings and deepen interpretation"}],"correctIndex":2,"explanationZh":"三角互证并不要求不同资料完全一致，也可用于发现矛盾、补充视角并提高解释的可信度。","explanationEn":"Triangulation need not produce perfect agreement; it can reveal contradictions, add perspectives, and strengthen interpretation.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"triangulation"},{"id":27,"points":3,"questionZh":"泰国第一座国家公园是哪一个？","questionEn":"Which was Thailand’s first national park?","answers":[{"letter":"A","zh":"考艾国家公园（Khao Yai National Park）","en":"Khao Yai National Park"},{"letter":"B","zh":"爱侣湾国家公园（Erawan National Park）","en":"Erawan National Park"},{"letter":"C","zh":"茵他侬国家公园（Doi Inthanon National Park）","en":"Doi Inthanon National Park"}],"correctIndex":0,"explanationZh":"考艾国家公园于 1962 年设立，被认定为泰国第一座国家公园。","explanationEn":"Khao Yai was established in 1962 and is recognised as Thailand’s first national park.","categoryZh":"清迈与泰国","categoryEn":"Chiang Mai & Thailand","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"park"},{"id":28,"points":3,"questionZh":"若希望一个房间形成有效的自然穿堂风，以下哪种开口布置通常最有利？","questionEn":"Which opening arrangement generally best supports effective natural cross-ventilation in a room?","answers":[{"letter":"A","zh":"在相对或适当不同的立面设置进风口与出风口，形成连续气流路径","en":"Provide inlet and outlet openings on opposite or appropriately different sides to create a continuous airflow path"},{"letter":"B","zh":"封闭全部窗户并使用厚窗帘","en":"Seal all windows and use heavy curtains"},{"letter":"C","zh":"只设置一个没有其他出口的天窗","en":"Use only one skylight with no other outlet"}],"correctIndex":0,"explanationZh":"穿堂风需要明确的空气进入与排出路径；开口大小、位置、风向和室内阻挡也会影响效果。","explanationEn":"Cross-ventilation requires a clear inlet-to-outlet path; opening size, position, wind direction, and interior obstructions also matter.","categoryZh":"建筑学与学生生活","categoryEn":"Architecture & Student Life","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"ventilation"},{"id":29,"points":3,"questionZh":"在人类参与者研究中，取得知情同意的正确时间通常是什么？","questionEn":"In research involving human participants, when should informed consent normally be obtained?","answers":[{"letter":"A","zh":"完成数据收集之后","en":"After data collection is complete"},{"letter":"B","zh":"只有参与者主动询问时才需要","en":"Only when a participant specifically asks for it"},{"letter":"C","zh":"参与研究之前；除非伦理审查机构正式批准豁免或变更","en":"Before participation, unless an ethics body has formally approved a waiver or alteration"}],"correctIndex":2,"explanationZh":"参与者应在了解研究目的、程序、风险、权益与退出方式后，自愿决定是否参加。","explanationEn":"Participants should voluntarily decide after receiving information about the purpose, procedures, risks, rights, and withdrawal.","categoryZh":"博士研究方法","categoryEn":"PhD Research Methods","difficultyZh":"困难","difficultyEn":"Hard","timeLimit":20,"visual":"ethics"},{"id":30,"points":2,"questionZh":"公历 2026 年对应泰国佛历哪一年？","questionEn":"Which Thai Buddhist Era year corresponds to Gregorian year 2026?","answers":[{"letter":"A","zh":"佛历 2569 年","en":"B.E. 2569"},{"letter":"B","zh":"佛历 2026 年","en":"B.E. 2026"},{"le function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function rand(n=20){const chars='abcdefghjkmnpqrstuvwxyz23456789';const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>chars[x%chars.length]).join('')}

class LocalBus{constructor(channel,onMessage,onOpen,onClose){this.bc=new BroadcastChannel(channel);this.bc.onmessage=e=>onMessage(e.data);setTimeout(()=>onOpen(),40);this.onClose=onClose}send(m){this.bc.postMessage(m)}close(){this.bc.close();this.onClose?.()}}
class PubNubBus{
 constructor(channel,onMessage,onOpen,onClose,onError){
  this.channel=channel;this.onMessage=onMessage;this.onOpen=onOpen;this.onClose=onClose;this.onError=onError;
  this.closed=false;this.opened=false;this.tt='0';this.tr='';this.originIndex=0;this.controller=null;this.poll();
 }
 origin(){return PUBNUB_ORIGINS[this.originIndex%PUBNUB_ORIGINS.length]}
 subscribeURL(){const q=new URLSearchParams({tt:this.tt,uuid:pid,pnsdk:'ARCHCMU-VibeQuiz-8'});if(this.tr)q.set('tr',this.tr);return `${this.origin()}/v2/subscribe/demo/${encodeURIComponent(this.channel)}/0?${q}`}
 async poll(){if(this.closed)return;this.controller=new AbortController();try{
   const r=await fetch(this.subscribeURL(),{cache:'no-store',signal:this.controller.signal,mode:'cors'});if(!r.ok)throw new Error(`Live service ${r.status}`);
   const data=await r.json();if(this.closed)return;
   if(!this.opened){this.opened=true;this.onOpen()}
   if(data&&data.t&&data.t.t){this.tt=String(data.t.t);this.tr=data.t.r==null?'':String(data.t.r)}
   for(const item of (data&&Array.isArray(data.m)?data.m:[])){if(item&&item.d!==undefined)this.onMessage(item.d)}
   setTimeout(()=>this.poll(),0)
  }catch(e){if(this.closed||e.name==='AbortError')return;this.originIndex++;if(this.originIndex<PUBNUB_ORIGINS.length){setTimeout(()=>this.poll(),500);return}this.closed=true;this.onError(e);this.onClose()}}
 send(m){if(this.closed)return;const payload=encodeURIComponent(JSON.stringify(m));const url=`${this.origin()}/publish/demo/demo/0/${encodeURIComponent(this.channel)}/0/${payload}?store=0&uuid=${encodeURIComponent(pid)}&pnsdk=ARCHCMU-VibeQuiz-8`;fetch(url,{cache:'no-store',mode:'cors'}).then(r=>{if(!r.ok)throw new Error(`Publish ${r.status}`)}).catch(e=>this.onError(e))}
 close(){this.closed=true;try{this.controller?.abort()}catch{}}
}
function connect(){const seq=++connectSeq;clearTimeout(reconnectTimer);transportOpen=false;setStatus('connecting',mode==='host'?'Preparing your room…':'Connecting…');try{socket?.close()}catch{};const channel='archcmu-'+room;const onOpen=()=>{if(seq!==connectSeq)return;transportOpen=true;setStatus('live','Live');if(mode==='host'){broadcastState();clearInterval(stateTimer);stateTimer=setInterval(broadcastState,1400)}else{if(document.getElementById('joinStateText')&&!pendingJoin)updateJoinMessage('Connected. Enter your name and tap Join.','good');if(pendingJoin)sendJoin()}};const onClose=()=>{if(seq!==connectSeq)return;transportOpen=false;setStatus('offline','Reconnecting…');if(mode==='player'&&document.getElementById('joinStateText'))updateJoinMessage('Reconnecting… your typed name is safe.','bad');reconnectTimer=setTimeout(connect,1800)};const onError=()=>{if(seq!==connectSeq)return;transportOpen=false;setStatus('offline','Reconnecting…');if(mode==='player'&&document.getElementById('joinStateText'))updateJoinMessage('Connection interrupted. Retrying automatically…','bad')};socket=TEST?new LocalBus(channel,onMessage,onOpen,onClose):new PubNubBus(channel,onMessage,onOpen,onClose,onError)}
function send(m){if(!transportOpen)return false;socket.send({app:APP_ID,room,...m,at:Date.now()});return true}
function broadcastState(){if(mode!=='host'||!state)return;send({type:'state',state})}
function onMessage(m){if(!m||m.room!==room)return;if(mode==='host')onHostMessage(m);else onPlayerMessage(m)}
function onHostMessage(m){if(m.type==='join'){const p=m.player;if(!p?.pid)return;if(!state.players[p.pid]&&Object.keys(state.players).length>=40){send({type:'room-full',pid:p.pid});return}const old=state.players[p.pid]||{};state.players[p.pid]={name:cleanName(p.name)||old.name||'Player',avatar:Number.isInteger(p.avatar)?p.avatar:(old.avatar||0),score:old.score||0,correct:old.correct||0,incorrect:old.incorrect||0,totalTime:old.totalTime||0,joinedAt:old.joinedAt||Date.now(),answeredQ:old.answeredQ??-1,lastPoints:old.lastPoints||0,lastCorrect:old.lastCorrect||false,lastChoice:old.lastChoice??null};send({type:'ack',pid:p.pid,state});broadcastState();renderHost()}else if(m.type==='answer'&&state.phase==='question'&&m.q===state.questionIndex&&state.players[m.pid]){answers[m.q]??={};if(!answers[m.q][m.pid]){answers[m.q][m.pid]={choice:Number(m.choice),receivedAt:Date.now()};state.players[m.pid].answeredQ=m.q;state.players[m.pid].lastChoice=Number(m.choice);state.answerCount=Object.keys(answers[m.q]).length;send({type:'answer-ack',pid:m.pid,q:m.q});broadcastState();renderHostDynamic()}}else if(m.type==='state-request')broadcastState()}
function onPlayerMessage(m){if(m.type==='room-full'&&m.pid===pid){pendingJoin=false;clearInterval(joinRetry);updateJoinMessage('Room is full. Please ask the host.','bad');return}else if(m.type==='ack'&&m.pid===pid){state=m.state;pendingJoin=false;clearInterval(joinRetry);setStatus('live','Joined');renderPlayer()}else if(m.type==='answer-ack'&&m.pid===pid&&pendingAnswer?.q===m.q){clearInterval(answerRetry)}else if(m.type==='state'&&m.state){state=m.state;if(state.ended)return renderEnded();if(pendingJoin&&!state.players?.[pid])sendJoin();else if(state.players?.[pid]){pendingJoin=false;clearInterval(joinRetry);renderPlayer()}}}

function createHost(){mode='host';room=rand(24);hostKey=rand(20);state={room,code:visibleCode(room),createdAt:Date.now(),expiresAt:Date.now()+4*3600*1000,phase:'lobby',questionIndex:-1,deadline:0,players:{},answerCount:0,stats:null,ended:false};answers={};LS.setItem('arch_host_'+room,JSON.stringify(state));safeURL(`${location.pathname}?host=${room}&key=${hostKey}${TEST?'&test=1':''}`);renderHost();connect()}
function restoreHost(){const saved=LS.getItem('arch_host_'+room);try{state=saved?JSON.parse(saved):null}catch{state=null}if(!state||state.expiresAt<Date.now())state={room,code:visibleCode(room),createdAt:Date.now(),expiresAt:Date.now()+4*3600*1000,phase:'lobby',questionIndex:-1,deadline:0,players:{},answerCount:0,stats:null,ended:false};answers={};renderHost();connect()}
function persistHost(){if(mode==='host'&&state)LS.setItem('arch_host_'+room,JSON.stringify(state))}
function renderHost(){persistHost();if(state.phase==='lobby')renderHostLobby();else if(state.phase==='question')renderHostQuestion();else if(state.phase==='results')renderHostResults();else if(state.phase==='leaderboard')renderHostLeaderboard();else if(state.phase==='finished')renderHostFinal()}
function renderHostLobby(){const list=rankPlayers(),ready=transportOpen&&list.length>0;shell(`<section class="hostGrid"><div class="card" style="text-align:center"><div class="eyebrow">PHD HOMEROOM · FINAL 30</div><div class="roomCode">${state.code}</div><div class="qrWrap" id="qr"></div><div class="joinLink">${esc(currentJoinURL())}</div><div class="actions" style="justify-content:center"><button class="btn soft" id="copyBtn">Copy join link</button><button class="btn soft" id="reconnectBtn">Reconnect</button></div><div class="joinState ${transportOpen?'good':'bad'}"><div class="miniStatus ${transportOpen?'good':'bad'}"><i></i>${transportOpen?'Room is live — ready for 20–30 participants.':'Connecting to the live room…'}</div></div><div class="metaRow" style="justify-content:center;margin:14px 0"><span class="capacityBadge">Capacity target: 30</span><span class="pointBadge">10 Chiang Mai + 10 Architecture + 10 Research</span></div><h2>${list.length} joined</h2><div class="lobbyNames">${list.map(p=>`<span class="avatarChip">${avatarHTML(p.avatar,'small')}${esc(p.name)}</span>`).join('')||'<span class="hostNote">Names appear here after participants tap Join.</span>'}</div><div class="actions" style="justify-content:center"><button class="btn gold" id="startBtn" ${ready?'':'disabled'}>Start 30-Question Challenge</button></div><details class="testDetails"><summary>Technical test</summary><div class="actions" style="justify-content:center"><button class="btn soft" id="demoBtn">Simulate 30 participants</button></div></details><p class="hostNote">Start becomes active when the room is Live and at least one participant has joined.</p></div><aside class="side"><div class="card"><h3>Automatic game</h3><p>15–20 seconds per question, automatic reveal, automatic next question, leaderboard every five questions.</p><span class="autoPill">AUTO MODE ON</span></div><div class="card"><h3>Difficulty scoring</h3><p>Easy ×1 · Medium ×2 · Hard ×3, with a speed bonus for correct answers.</p></div><div class="card"><h3>Awards</h3><p>🥇 Architecture & Culture Champion<br>🥈 Spatial Thinker<br>🥉 Research Connector</p></div></aside></section>`);drawQR(document.getElementById('qr'),currentJoinURL());copyBtn.onclick=copyLink;reconnectBtn.onclick=connect;startBtn.onclick=()=>startQuestion(0);demoBtn.onclick=addDemoPlayers}
function addDemoPlayers(){if(!confirm('Add 30 demo participants for a capacity test?'))return;const names=['Mali','Niran','Lin','Pim','Ken','Aya','Arun','Mei','Noah','Fah','Jin','Beam','Mint','Korn','Sara','Tao','June','Aom','Leo','Yuki','Nok','Ben','Rin','Ploy','Max','Mew','Kim','Nan','Jay','Dao'];names.forEach((n,i)=>{const id='demo-'+i;state.players[id]??={name:n,avatar:i%AVATARS.length,score:0,correct:0,incorrect:0,totalTime:0,joinedAt:Date.now()+i,answeredQ:-1,lastPoints:0,lastCorrect:false,lastChoice:null,demo:true}});broadcastState();renderHost()}
function startQuestion(i){clearTimeout(autoTimer);answers[i]={};state.phase='question';state.questionIndex=i;state.durationMs=FAST?450:QUESTIONS[i].timeLimit*1000;state.deadline=Date.now()+state.durationMs;state.answerCount=0;state.stats=null;Object.values(state.players).forEach(p=>{p.lastPoints=0;p.lastCorrect=false;p.lastChoice=null;p.answeredQ=-1});broadcastState();renderHost();playTone(700,.12);autoTimer=setTimeout(revealQuestion,state.durationMs+100)}
function revealQuestion(){if(state.phase!=='question')return;const q=QUESTIONS[state.questionIndex],a=answers[state.questionIndex]||{},stats=[0,0,0];Object.values(a).forEach(x=>{if(x.choice>=0&&x.choice<3)stats[x.choice]++});for(const [id,p] of Object.entries(state.players)){let ans=a[id];if(p.demo&&!ans){const choice=Math.random()<.72?q.correctIndex:Math.floor(Math.random()*3);ans={choice,receivedAt:state.deadline-Math.floor(Math.random()*Math.max(100,state.durationMs*.7))};stats[choice]++}let points=0,ok=false,rt=state.durationMs||q.timeLimit*1000;if(ans){rt=Math.max(0,Math.min(state.durationMs||q.timeLimit*1000,ans.receivedAt-(state.deadline-(state.durationMs||q.timeLimit*1000))));ok=ans.choice===q.correctIndex;if(ok){const ratio=1-rt/Math.max(1,(state.durationMs||q.timeLimit*1000));points=q.points*(700+Math.round(300*ratio))}p.lastChoice=ans.choice}if(ok){p.correct=(p.correct||0)+1;p.score=(p.score||0)+points}else p.incorrect=(p.incorrect||0)+1;p.totalTime=(p.totalTime||0)+rt;p.lastPoints=points;p.lastCorrect=ok}state.phase='results';state.stats=stats;state.durationMs=FAST?300:5500;state.deadline=Date.now()+state.durationMs;broadcastState();renderHost();autoTimer=setTimeout(afterResults,state.durationMs+100)}
function afterResults(){if(state.questionIndex===29)return finishGame();if((state.questionIndex+1)%5===0){state.phase='leaderboard';state.durationMs=FAST?300:6000;state.deadline=Date.now()+state.durationMs;broadcastState();renderHost();autoTimer=setTimeout(()=>startQuestion(state.questionIndex+1),state.durationMs+100)}else startQuestion(state.questionIndex+1)}
function renderHostQuestion(){const q=QUESTIONS[state.questionIndex];shell(`<section class="questionLayout"><div>${qCard(q,false)}</div><aside class="side"><div class="card"><div class="timer" id="timer"><b id="timerText">${Math.ceil((state.deadline-Date.now())/1000)}</b></div><div class="countdownLabel">Automatic reveal</div></div><div class="card"><div class="answerNumber" id="answerNumber">${state.answerCount}</div><p style="text-align:center">answers received</p></div><button class="btn gold" id="revealBtn">Reveal now</button><button class="btn danger" id="endBtn">End game</button></aside></section>`);document.querySelectorAll('.option').forEach(b=>b.disabled=true);revealBtn.onclick=revealQuestion;endBtn.onclick=finishGame;runClock()}

function qCard(q,reveal=false,chosen=null){return `<article class="card qCard"><div class="visual">${visualSVG(q.visual,q.id)}</div><div class="qBody"><div class="metaRow"><span class="category">${esc(q.categoryEn)}</span><span class="difficulty">${esc(q.difficultyEn)} · ${q.timeLimit}s</span><span class="pointBadge">×${q.points} score</span></div><h2 class="qTitle">${esc(q.questionEn)}</h2><div class="qTitleZh">${esc(q.questionZh)}</div><div class="options">${q.answers.map((a,i)=>{let c='';if(reveal)c=i===q.correctIndex?'correct':chosen===i?'chosenWrong':'wrong';else if(chosen===i)c='selected';return `<button class="option ${c}" data-choice="${i}" ${reveal?'disabled':''}><span class="letter">${'ABC'[i]}</span><span class="en">${esc(a.en)}</span>${a.zh!==a.en?`<span class="zh">${esc(a.zh)}</span>`:''}</button>`}).join('')}</div></div></article>`}

function renderHostFinal(){const r=rankPlayers(),p=i=>r[i]||{name:'—',avatar:i,score:0,correct:0};shell(`<section class="card" style="text-align:center"><div class="eyebrow">FINAL AWARDS</div><h2>ARCHCMU VibeQuiz Champions</h2><div class="podium"><div class="podiumBox second"><div class="medal">🥈</div>${avatarHTML(p(1).avatar,'big')}<b>${esc(p(1).name)}</b><span>${p(1).score} pts</span><br><small>Spatial Thinker</small></div><div class="podiumBox first"><div class="medal">🥇</div>${avatarHTML(p(0).avatar,'big')}<b>${esc(p(0).name)}</b><span>${p(0).score} pts</span><br><small>Architecture & Culture Champion</small></div><div class="podiumBox third"><div class="medal">🥉</div>${avatarHTML(p(2).avatar,'big')}<b>${esc(p(2).name)}</b><span>${p(2).score} pts</span><br><small>Research Connector</small></div></div><div class="actions" style="justify-content:center"><button class="btn primary" id="csvBtn">Download Results CSV</button><button class="btn gold" id="againBtn">Play Again</button></div></section>`);csvBtn.onclick=downloadCSV;againBtn.onclick=()=>{for(const p of Object.values(state.players)){p.score=0;p.correct=0;p.incorrect=0;p.totalTime=0}state.phase='lobby';state.questionIndex=-1;broadcastState();renderHost()}}
function downloadCSV(){const rows=[['Rank','Name','Score','Correct','Incorrect'],...rankPlayers().map((p,i)=>[i+1,p.name,p.score||0,p.correct||0,p.incorrect||0])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ARCHCMU_VibeQuiz_Results.csv';a.click()}

function renderPlayer(){if(!state)return;if(state.ended)return renderEnded();const key=`${state.phase}-${state.questionIndex}-${state.deadline}-${state.players?.[pid]?.score||0}-${state.players?.[pid]?.answeredQ??-1}`;if(key===lastRenderKey){updatePlayerDynamic();return}lastRenderKey=key;if(state.phase==='lobby')renderWaiting();else if(state.phase==='question')renderPlayerQuestion();else if(state.phase==='results')renderPlayerResult();else if(state.phase==='leaderboard')renderPlayerLeaderboard();else if(state.phase==='finished')renderPlayerFinal()}
function renderWaiting(){const me=state.players?.[pid];shell(`<section class="card joinPanel playerStatus">${avatarHTML(me?.avatar??selectedAvatar,'big')}<h2>You're in, ${esc(me?.name||playerName)}!</h2><p class="lead" style="margin:auto">Room ${esc(state.code)} · Wait for the host.</p><div class="waitPulse"><span></span><span></span><span></span></div><div class="hint blue">Keep this page open. The first question will appear automatically.</div></section>`)}
function renderPlayerQuestion(){const q=QUESTIONS[state.questionIndex],me=state.players?.[pid]||{},chosen=me.answeredQ===state.questionIndex?me.lastChoice:null;shell(`<section class="joinPanel"><div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between"><span class="category">Question ${state.questionIndex+1}/30</span><span>${avatarHTML(me.avatar??selectedAvatar,'small')} <b>${me.score||0} pts</b></span></div><div class="timer" id="timer" style="margin-top:12px"><b id="timerText">${Math.ceil((state.deadline-Date.now())/1000)}</b></div></div>${qCard(q,false,chosen)}<div class="hint blue answerAck ${chosen===null?'hidden':''}" id="answerAck">Answer received. Wait for the reveal.</div></section>`);document.querySelectorAll('.option').forEach(b=>{b.disabled=chosen!==null;b.onclick=()=>submitAnswer(Number(b.dataset.choice))});runClock()}
function submitAnswer(choice){if(!state||state.phase!=='question'||Date.now()>state.deadline)return;const me=state.players?.[pid];if(me?.answeredQ===state.questionIndex)return;pendingAnswer={q:state.questionIndex,choice};sendAnswer();clearInterval(answerRetry);answerRetry=setInterval(sendAnswer,650);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;b.classList.toggle('selected',Number(b.dataset.choice)===choice)});const ack=document.getElementById('answerAck');if(ack){ack.classList.remove('hidden');ack.textContent='Sending answer…'}}
function sendAnswer(){if(!pendingAnswer)return;send({type:'answer',pid,q:pendingAnswer.q,choice:pendingAnswer.choice})}
function renderPlayerResult(){clearInterval(answerRetry);pendingAnswer=null;const q=QUESTIONS[state.questionIndex],me=state.players?.[pid]||{},correct=q.answers[q.correctIndex];shell(`<section class="joinPanel"><div class="card playerStatus"><div class="correctHero">${me.lastCorrect?'✅':'💡'}</div><h2>${me.lastCorrect?'Correct!':'Next one!'}</h2><div class="playerScore">+${me.lastPoints||0}</div><p>Total <b>${me.score||0}</b> · Rank <b>#${myRank()}</b></p></div><div style="margin-top:12px">${qCard(q,true,me.lastChoice)}</div><div class="resultBox bilingualExplanation"><h3>${esc(correct.en)}${correct.zh!==correct.en?` / ${esc(correct.zh)}`:''}</h3><div class="en">${esc(q.explanationEn)}</div><div class="zh">${esc(q.explanationZh)}</div></div></section>`);runClock()}
function renderPlayerLeaderboard(){shell(`<section class="card joinPanel playerStatus"><div class="eyebrow">CHECKPOINT</div><h2>You are #${myRank()}</h2><div class="playerScore">${state.players?.[pid]?.score||0}</div><div style="text-align:left">${leaderboardHTML(5)}</div><div class="timer" id="timer" style="margin-top:18px"><b id="timerText">6</b></div></section>`);runClock()}
function renderPlayerFinal(){const me=state.players?.[pid]||{},r=myRank();shell(`<section class="card joinPanel playerStatus"><div class="medal">${r===1?'🥇':r===2?'🥈':r===3?'🥉':'🎓'}</div>${avatarHTML(me.avatar??selectedAvatar,'big')}<h2>#${r} · ${esc(me.name||playerName)}</h2><div class="playerScore">${me.score||0}</div><p>${me.correct||0} correct answers</p><div style="text-align:left">${leaderboardHTML(5)}</div></section>`);if(Number(r)<=3)confetti()}
function renderEnded(){shell(`<section class="card joinPanel"><h2>Room ended</h2><p>Ask the host to open a new room.</p></section>`)}
function runClock(){clearInterval(clockTimer);clockTimer=setInterval(updatePlayerDynamic,150);updatePlayerDynamic()}
function updatePlayerDynamic(){if(!state?.deadline)return;const left=Math.max(0,state.deadline-Date.now()),t=document.getElementById('timerText'),ring=document.getElementById('timer');if(t)t.textContent=Math.ceil(left/1000);if(ring){const total=state.durationMs|| (state.phase==='question'?QUESTIONS[state.questionIndex].timeLimit*1000:(state.phase==='leaderboard'?6000:5500));ring.style.setProperty('--timer',Math.max(0,left/total*100)+'%');ring.classList.toggle('urgent',left<5000&&state.phase==='question')}}
function preview(){shell(`<section class="card"><div class="eyebrow">FINAL VERIFIED EDITION · 3 AUGUST 2026</div><h2>30 bilingual questions</h2><p>10 Chiang Mai & Thailand + 10 Architecture & Student Life + 10 PhD Research Methods.</p><div class="previewGrid">${QUESTIONS.map(q=>`<article class="previewItem"><div class="visual">${visualSVG(q.visual,q.id)}</div><div class="previewText"><span class="category">${q.id} · ${esc(q.categoryEn)}</span><h3>${esc(q.questionEn)}</h3><p style="color:var(--muted)">${esc(q.questionZh)}</p><p><b>${esc(q.answers[q.correctIndex].en)}</b></p></div></article>`).join('')}</div></section>`)}
function boot(){if(!validateGame()){shell('<section class="card"><h2>Question data error</h2></section>');return}if(params.has('preview'))return preview();if(mode==='player')return initPlayer();if(room&&params.has('host'))return restoreHost();createHost()}
boot();
</script><div id="buildTag" style="position:fixed;right:6px;bottom:4px;font:10px system-ui;color:#6b7b8d;opacity:.55;z-index:9999">V9 FINAL 30 · LOCAL QR</div></body></html>
