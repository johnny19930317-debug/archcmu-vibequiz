<body><div class="app"><header class="top"><div class="brand"><div class="logo">🏛️</div><div><b>ARCHCMU VibeQuiz</b><small>Architecture × Chiang Mai</small></div></div><div class="topActions"><div class="status idle" id="status"><span class="dot"></span><span id="statusText">Ready</span></div><button class="topBtn" id="soundBtn" type="button">🔊</button><button class="topBtn" id="homeBtn" type="button">New Room</button></div></header><main class="main" id="main"></main><footer class="footer">Open page → scan QR → type name → Join → Start Game</footer></div><div class="confetti" id="confetti"></div><script>const QUESTIONS=[{"id":1,"category":"Architecture · Studio Life","question":"Which filename looks most like an architecture student's truly ‘final’ submission?","answers":["Final_Submission.pdf","Project_Complete_v1.pdf","FINAL_v8_really_final_USE_THIS_ONE_render_fixed.pdf","Untitled-1.pdf"],"correctIndex":2,"timeLimit":15,"explanation":"A light-hearted studio joke: architecture files often accumulate increasingly dramatic version names as deadlines approach.","visual":"finalfile","difficulty":"Warm-up"},{"id":2,"category":"Architecture · Studio Life","question":"Which hand tool is most closely associated with cutting card and basswood for physical models?","answers":["Craft knife / X-Acto knife","Concrete mixer","Angle grinder","Paint roller"],"correctIndex":0,"timeLimit":15,"explanation":"A sharp craft knife is a standard model-making tool. It should always be used with a cutting mat, metal ruler and safe hand position.","visual":"knife","difficulty":"Warm-up"},{"id":3,"category":"Architecture · Studio Life","question":"In the classic architecture-studio joke, what might ‘This is… interesting’ mean during a jury?","answers":["The project automatically receives full marks","The critic is being politely non-committal","The critic wants to buy the model","The presentation is already published"],"correctIndex":1,"timeLimit":15,"explanation":"This is a humorous studio-language question, not a formal assessment rule: ‘interesting’ is often used when a critic is still deciding how to respond.","visual":"jury","difficulty":"Warm-up"},{"id":4,"category":"Architecture · History","question":"Le Corbusier famously described a house as what?","answers":["A machine for living in","A monument without function","A box of dreams","A landscape in miniature"],"correctIndex":0,"timeLimit":18,"explanation":"Le Corbusier's well-known modernist phrase presents the house as an efficient instrument organised around everyday life.","visual":"machinehouse","difficulty":"Medium"},{"id":5,"category":"Architecture · History","question":"Which architect is most closely associated with the motto ‘Less is more’?","answers":["Antoni Gaudí","Ludwig Mies van der Rohe","Robert Venturi","Frank Gehry"],"correctIndex":1,"timeLimit":18,"explanation":"Mies van der Rohe used ‘Less is more’ to express a disciplined modernist approach based on clarity, proportion and restraint.","visual":"lessmore","difficulty":"Medium"},{"id":6,"category":"Architecture · History","question":"How did Robert Venturi famously challenge the phrase ‘Less is more’?","answers":["Form follows finance","More is never enough","Less is a bore","Space is the machine"],"correctIndex":2,"timeLimit":18,"explanation":"Venturi's ‘Less is a bore’ defended complexity, contradiction and richer visual communication against strict modernist reduction.","visual":"lessbore","difficulty":"Medium"},{"id":7,"category":"Architecture · Theory","question":"Which set gives Vitruvius' three classical principles of architecture?","answers":["Form, colour, texture","Firmitas, utilitas, venustas","Structure, façade, landscape","Cheap, fast, good"],"correctIndex":1,"timeLimit":20,"explanation":"Firmitas, utilitas and venustas are commonly translated as firmness, commodity and delight: strength, usefulness and beauty.","visual":"vitruvius","difficulty":"Challenge"},{"id":8,"category":"Architecture · History","question":"The name ‘Brutalism’ is primarily connected to which expression?","answers":["Brutal urban politics","Béton brut — raw concrete","A fictional architect called Brutus","Buildings designed for military use"],"correctIndex":1,"timeLimit":18,"explanation":"The term is linked to the French expression béton brut, meaning raw concrete, rather than simply to the English word ‘brutal’.","visual":"brutalism","difficulty":"Medium"},{"id":9,"category":"Architecture · History","question":"What was the practical function of many gargoyles on Gothic buildings?","answers":["To support stained glass","To direct rainwater away from walls","To carry bells","To ventilate crypts"],"correctIndex":1,"timeLimit":18,"explanation":"A true gargoyle is a projecting water spout. It throws rainwater away from masonry walls while also serving a decorative role.","visual":"gargoyle","difficulty":"Medium"},{"id":10,"category":"Architecture · Tropical Urbanism","question":"What is the main environmental purpose of the ‘Five-Foot Way’ found along many Southeast Asian shophouses?","answers":["A private storage strip","A sheltered pedestrian route from sun and rain","An earthquake separation joint","A dedicated rickshaw parking bay"],"correctIndex":1,"timeLimit":20,"explanation":"The continuous covered walkway supports comfortable pedestrian movement in hot, sunny and rainy tropical conditions.","visual":"fivefoot","difficulty":"Challenge"},{"id":11,"category":"Architecture · Adaptive Reuse","question":"Which statement best defines adaptive reuse?","answers":["Demolishing an old building and copying its façade","Giving an existing building a new use while retaining significant fabric","Restoring every building to its first historical condition","Changing only the furniture in a room"],"correctIndex":1,"timeLimit":20,"explanation":"Adaptive reuse extends the life of an existing building by accommodating a new programme while retaining and adapting valuable existing fabric.","visual":"reuse","difficulty":"Challenge"},{"id":12,"category":"Architecture · Representation","question":"What does an architectural section reveal especially well?","answers":["Only property ownership","Vertical spatial relationships and levels","Only the exterior colour palette","The construction budget"],"correctIndex":1,"timeLimit":18,"explanation":"A section cuts vertically through a building, making heights, floor relationships, voids, structure and light paths easier to understand.","visual":"section","difficulty":"Medium"},{"id":13,"category":"Architecture · Environmental Design","question":"Why is external shading usually more effective than an internal blind for reducing direct solar heat gain?","answers":["It blocks solar radiation before it reaches the glazing","It increases the glass temperature","It eliminates all daylight","It makes walls structurally stronger"],"correctIndex":0,"timeLimit":20,"explanation":"External shading intercepts direct solar radiation before it passes through the glass, reducing heat gain while allowing controlled daylight.","visual":"shading","difficulty":"Challenge"},{"id":14,"category":"Architecture · Field Research","question":"What does behavioural mapping normally record?","answers":["Only building ownership","Where people move, stop, sit and interact","Only the age of a building","Concrete compressive strength"],"correctIndex":1,"timeLimit":18,"explanation":"Behavioural mapping connects observable activities to specific locations and times, helping researchers understand how space is actually used.","visual":"behavior","difficulty":"Medium"},{"id":15,"category":"Architecture · Circular Design","question":"Which connection is generally easiest to dismantle and reuse later?","answers":["A bolted dry connection","A permanently welded joint","A fully glued composite joint","A cast-in-place monolithic connection"],"correctIndex":0,"timeLimit":20,"explanation":"Bolted and other dry connections can often be disassembled with less damage, supporting reversibility, repair and material reuse.","visual":"reversible","difficulty":"Challenge"},{"id":16,"category":"Chiang Mai · History","question":"What does the name ‘Chiang Mai’ literally mean?","answers":["Golden Mountain","New City","Northern River","City of Temples"],"correctIndex":1,"timeLimit":15,"explanation":"Chiang Mai literally means ‘New City’, reflecting its establishment as a new political centre of the Lanna Kingdom.","visual":"newcity","difficulty":"Warm-up"},{"id":17,"category":"Chiang Mai · History","question":"In which year was Chiang Mai founded by King Mangrai?","answers":["AD 996","AD 1296","AD 1496","AD 1767"],"correctIndex":1,"timeLimit":15,"explanation":"Chiang Mai was founded in AD 1296 and developed as the political, economic and cultural centre of Lanna.","visual":"timeline","difficulty":"Warm-up"},{"id":18,"category":"Chiang Mai · History","question":"Chiang Mai became the capital of which historical kingdom?","answers":["Ayutthaya","Sukhothai","Lanna","Khmer"],"correctIndex":2,"timeLimit":15,"explanation":"Chiang Mai was established as the capital of the Lanna Kingdom, whose art, architecture and cultural traditions remain visible today.","visual":"lanna","difficulty":"Warm-up"},{"id":19,"category":"Chiang Mai · Landscape","question":"Approximately how high is Doi Inthanon, Thailand's highest mountain?","answers":["1,565 metres","2,565 metres","3,565 metres","4,565 metres"],"correctIndex":1,"timeLimit":18,"explanation":"Doi Inthanon rises to approximately 2,565 metres above sea level and is the highest mountain in Thailand.","visual":"inthanon","difficulty":"Medium"},{"id":20,"category":"Chiang Mai · Doi Suthep","question":"How many steps are on the famous seven-headed Naga staircase at Wat Phra That Doi Suthep?","answers":["206","306","406","506"],"correctIndex":1,"timeLimit":15,"explanation":"The well-known Naga staircase has 306 steps, with a cable car available as an alternative route.","visual":"steps","difficulty":"Warm-up"},{"id":21,"category":"Chiang Mai · Urban Form","question":"Which physical elements most clearly define Chiang Mai’s historic old-city core?","answers":["A moat, walls and gates","A coastal seawall","A radial motorway system","A single royal avenue"],"correctIndex":0,"timeLimit":18,"explanation":"Chiang Mai’s historic core is strongly identified by its moats, surviving walls, city gates and fortified corners.","visual":"moat","difficulty":"Medium"},{"id":22,"category":"Chiang Mai · Sacred Landscape","question":"Which mythical creature flanks the staircase leading to Wat Phra That Doi Suthep?","answers":["Garuda","Naga serpent","Kinnari","Guardian elephant"],"correctIndex":1,"timeLimit":15,"explanation":"The staircase is bordered by a long Naga, a semi-divine serpent associated with water, protection and sacred Buddhist spaces.","visual":"naga","difficulty":"Warm-up"},{"id":23,"category":"Chiang Mai · Temple Architecture","question":"What is the name of the upward-pointing finial at the end of many Thai temple roofs?","answers":["Kalae","Chofa","Chedi","Sala"],"correctIndex":1,"timeLimit":18,"explanation":"The chofa is a distinctive decorative finial placed at the ends of temple and palace roof ridges.","visual":"chofa","difficulty":"Medium"},{"id":24,"category":"Chiang Mai · Lanna Architecture","question":"What is the V-shaped decorative element at the roof apex of a traditional Lanna house called?","answers":["Kalae","Chofa","Naga","Mondop"],"correctIndex":0,"timeLimit":18,"explanation":"Kalae are paired, projecting decorative boards associated with traditional Lanna domestic architecture.","visual":"kalae","difficulty":"Medium"},{"id":25,"category":"Chiang Mai · Vernacular Design","question":"Why are many traditional Thai houses raised above the ground?","answers":["Only to appear taller","To help with seasonal flooding and airflow","To create a stone basement","To reduce the roof span"],"correctIndex":1,"timeLimit":20,"explanation":"Raised floors help protect living areas from class LocalBus{constructor(channel,onMessage,onOpen,onClose){this.bc=new BroadcastChannel(channel);this.bc.onmessage=e=>onMessage(e.data);setTimeout(()=>onOpen(),40);this.onClose=onClose}send(m){this.bc.postMessage(m)}close(){this.bc.close();this.onClose?.()}}
class PubNubBus{
 constructor(channel,onMessage,onOpen,onClose,onError){
  this.channel=channel;this.onMessage=onMessage;this.onOpen=onOpen;this.onClose=onClose;this.onError=onError;
  this.closed=false;this.opened=false;this.tt='0';this.tr='';this.originIndex=0;this.controller=null;this.poll();
 }
 origin(){return PUBNUB_ORIGINS[this.originIndex%PUBNUB_ORIGINS.length]}
 subscribeURL(){const q=new URLSearchParams({tt:this.tt,uuid:pid,pnsdk:'ARCHCMU-VibeQuiz-8'});if(this.tr)q.set('tr',this.tr);return `${this.origin()}/v2/subscribe/demo/${encodeURIComponent(this.channel)}/0?${q}`}
 async poll(){if(this.closed)return;this.controller=new AbortController();try{
   const r=await fetch(this.subscribeURL(),{cache:'no-store',signal:this.controller.signal,mode:'cors'});if(!r.ok)throw new Error(`Live service ${r.status}`);
   const data=await r.json();if(this.closed)return;
   if(!this.opened){this.opened=true;this.onOpen()}
   if(data&&data.t&&data.t.t){this.tt=String(data.t.t);this.tr=data.t.r==null?'':String(data.t.r)}
   for(const item of (data&&Array.isArray(data.m)?data.m:[])){if(item&&item.d!==undefined)this.onMessage(item.d)}
   setTimeout(()=>this.poll(),0)
  }catch(e){if(this.closed||e.name==='AbortError')return;this.originIndex++;if(this.originIndex<PUBNUB_ORIGINS.length){setTimeout(()=>this.poll(),500);return}this.closed=true;this.onError(e);this.onClose()}}
 send(m){if(this.closed)return;const payload=encodeURIComponent(JSON.stringify(m));const url=`${this.origin()}/publish/demo/demo/0/${encodeURIComponent(this.channel)}/0/${payload}?store=0&uuid=${encodeURIComponent(pid)}&pnsdk=ARCHCMU-VibeQuiz-8`;fetch(url,{cache:'no-store',mode:'cors'}).then(r=>{if(!r.ok)throw new Error(`Publish ${r.status}`)}).catch(e=>this.onError(e))}
 close(){this.closed=true;try{this.controller?.abort()}catch{}}
}

function downloadCSV(){const rows=[['Rank','Name','Score','Correct','Incorrect'],...rankPlayers().map((p,i)=>[i+1,p.name,p.score||0,p.correct||0,p.incorrect||0])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ARCHCMU_VibeQuiz_Results.csv';a.click()}

function initPlayer(){mode='player';if(!room){location.href=location.pathname;return}renderJoinForm();connect();setTimeout(()=>send({type:'state-request'}),500)}
function renderJoinForm(message='Connecting to the room…',kind=''){shell(`<section class="card joinPanel"><div class="eyebrow">SCAN COMPLETE</div><h2>Join the game</h2><div class="joinState ${kind}" id="joinState"><div class="miniStatus ${kind}"><i></i><span id="joinStateText">${esc(message)}</span></div></div><label class="field"><span>Your display name</span><input id="nameInput" maxlength="28" placeholder="e.g. Derick" value="${esc(playerName)}" autocomplete="off"></label><div class="field"><span>Choose one avatar</span><div class="avatarPicker">${AVATARS.map((a,i)=>`<button class="avatarPick ${i===selectedAvatar?'active':''}" data-avatar="${i}" type="button">${avatarHTML(i)}</button>`).join('')}</div></div><button class="btn gold block" id="joinBtn" type="button">Join Now — One Tap</button><p class="connectionHelp">You can type your name immediately. The page will not refresh or erase it while connecting.</p></section>`);const input=document.getElementById('nameInput');input.addEventListener('input',()=>{playerName=cleanName(input.value);SS.setItem('arch_name',playerName)});document.querySelectorAll('.avatarPick').forEach(b=>b.onclick=()=>{selectedAvatar=Number(b.dataset.avatar);SS.setItem('arch_avatar',selectedAvatar);document.querySelectorAll('.avatarPick').forEach(x=>x.classList.toggle('active',x===b))});joinBtn.onclick=()=>{playerName=cleanName(input.value);if(!playerName)return alert('Please enter your name.');SS.setItem('arch_name',playerName);pendingJoin=true;updateJoinMessage(transportOpen?'Joining…':'Name saved. Connecting…','');sendJoin();clearInterval(joinRetry);joinRetry=setInterval(sendJoin,1000)};input.addEventListener('keydown',e=>{if(e.key==='Enter')joinBtn.click()})}
function updateJoinMessage(text,kind=''){const box=document.getElementById('joinState'),tx=document.getElementById('joinStateText');if(box){box.className='joinState '+kind;box.querySelector('.miniStatus').className='miniStatus '+kind}if(tx)tx.textContent=text}
function sendJoin(){if(!playerName)return;const ok=send({type:'join',player:{pid,name:playerName,avatar:selectedAvatar}});if(ok)updateJoinMessage('Joining room…','');else updateJoinMessage('Name saved. Still connecting…','')}
function renderPlayer(){if(!state)return;if(state.ended)return renderEnded();const key=`${state.phase}-${state.questionIndex}-${state.deadline}-${state.players?.[pid]?.score||0}-${state.players?.[pid]?.answeredQ??-1}`;if(key===lastRenderKey){updatePlayerDynamic();return}lastRenderKey=key;if(state.phase==='lobby')renderWaiting();else if(state.phase==='question')renderPlayerQuestion();else if(state.phase==='results')renderPlayerResult();else if(state.phase==='leaderboard')renderPlayerLeaderboard();else if(state.phase==='finished')renderPlayerFinal()}
function renderWaiting(){const me=state.players?.[pid];shell(`<section class="card joinPanel playerStatus">${avatarHTML(me?.avatar??selectedAvatar,'big')}<h2>You're in, ${esc(me?.name||playerName)}!</h2><p class="lead" style="margin:auto">Room ${esc(state.code)} · Wait for the host.</p><div class="waitPulse"><span></span><span></span><span></span></div><div class="hint blue">Keep this page open. The first question will appear automatically.</div></section>`)}
function renderPlayerQuestion(){const q=QUESTIONS[state.questionIndex],me=state.players?.[pid]||{},chosen=me.answeredQ===state.questionIndex?me.lastChoice:null;shell(`<section class="joinPanel"><div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between"><span class="category">Question ${state.questionIndex+1}/30</span><span>${avatarHTML(me.avatar??selectedAvatar,'small')} <b>${me.score||0} pts</b></span></div><div class="timer" id="timer" style="margin-top:12px"><b id="timerText">${Math.ceil((state.deadline-Date.now())/1000)}</b></div></div>${qCard(q,false,chosen)}<div class="hint blue answerAck ${chosen===null?'hidden':''}" id="answerAck">Answer received. Wait for the reveal.</div></section>`);document.querySelectorAll('.option').forEach(b=>{b.disabled=chosen!==null;b.onclick=()=>submitAnswer(Number(b.dataset.choice))});runClock()}
function submitAnswer(choice){if(!state||state.phase!=='question'||Date.now()>state.deadline)return;const me=state.players?.[pid];if(me?.answeredQ===state.questionIndex)return;pendingAnswer={q:state.questionIndex,choice};sendAnswer();clearInterval(answerRetry);answerRetry=setInterval(sendAnswer,650);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;b.classList.toggle('selected',Number(b.dataset.choice)===choice)});const ack=document.getElementById('answerAck');if(ack){ack.classList.remove('hidden');ack.textContent='Sending answer…'}}
function sendAnswer(){if(!pendingAnswer)return;send({type:'answer',pid,q:pendingAnswer.q,choice:pendingAnswer.choice})}
function renderPlayerResult(){clearInterval(answerRetry);pendingAnswer=null;const q=QUESTIONS[state.questionIndex],me=state.players?.[pid]||{};shell(`<section class="joinPanel"><div class="card playerStatus"><div class="correctHero">${me.lastCorrect?'✅':'💡'}</div><h2>${me.lastCorrect?'Correct!':'Next one!'}</h2><div class="playerScore">+${me.lastPoints||0}</div><p>Total <b>${me.score||0}</b> · Rank <b>#${myRank()}</b></p></div><div style="margin-top:12px">${qCard(q,true,me.lastChoice)}</div><div class="resultBox"><h3>${esc(q.answers[q.correctIndex])}</h3><p>${esc(q.explanation)}</p></div></section>`);runClock()}
function renderPlayerLeaderboard(){shell(`<section class="card joinPanel playerStatus"><div class="eyebrow">CHECKPOINT</div><h2>You are #${myRank()}</h2><div class="playerScore">${state.players?.[pid]?.score||0}</div><div style="text-align:left">${leaderboardHTML(5)}</div><div class="timer" id="timer" style="margin-top:18px"><b id="timerText">6</b></div></section>`);runClock()}
function renderPlayerFinal(){const me=state.players?.[pid]||{},r=myRank();shell(`<section class="card joinPanel playerStatus"><div class="medal">${r===1?'🥇':r===2?'🥈':r===3?'🥉':'🎓'}</div>${avatarHTML(me.avatar??selectedAvatar,'big')}<h2>#${r} · ${esc(me.name||playerName)}</h2><div class="playerScore">${me.score||0}</div><p>${me.correct||0} correct answers</p><div style="text-align:left">${leaderboardHTML(5)}</div></section>`);if(Number(r)<=3)confetti()}
function renderEnded(){shell(`<section class="card joinPanel"><h2>Room ended</h2><p>Ask the host to open a new room.</p></section>`)}
function runClock(){clearInterval(clockTimer);clockTimer=setInterval(updatePlayerDynamic,150);updatePlayerDynamic()}
function updatePlayerDynamic(){if(!state?.deadline)return;const left=Math.max(0,state.deadline-Date.now()),t=document.getElementById('timerText'),ring=document.getElementById('timer');if(t)t.textContent=Math.ceil(left/1000);if(ring){const total=state.phase==='question'?QUESTIONS[state.questionIndex].timeLimit*1000:(state.phase==='leaderboard'?6000:5000);ring.style.setProperty('--timer',Math.max(0,left/total*100)+'%');ring.classList.toggle('urgent',left<5000&&state.phase==='question')}}
function preview(){shell(`<section class="card"><h2>30 questions</h2><div class="previewGrid">${QUESTIONS.map(q=>`<article class="previewItem"><div class="visual">${visualSVG(q.visual,q.id)}</div><div class="previewText"><span class="category">${q.id} · ${esc(q.category)}</span><h3>${esc(q.question)}</h3><p><b>${esc(q.answers[q.correctIndex])}</b></p></div></article>`).join('')}</div></section>`)}
function boot(){if(!validateGame()){shell('<section class="card"><h2>Question data error</h2></section>');return}if(params.has('preview'))return preview();if(mode==='player')return initPlayer();if(room&&params.has('host'))return restoreHost();createHost()}
boot();
</script><div id="buildTag" style="position:fixed;right:6px;bottom:4px;font:10px system-ui;color:#6b7b8d;opacity:.55;z-index:9999">V8 HTTPS</div></body></html>
