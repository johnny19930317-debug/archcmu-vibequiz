<!doctype html>
<html lang="en">
<head>

<title>ARCHCMU Global Challenge · Live Game</title>
<style>
:root{--navy:#082f6b;--blue:#1768b6;--sky:#59b8e6;--gold:#f4b323;--red:#e54f55;--green:#2fa16e;--ink:#15233a;--muted:#617087;--bg:#eef4fa;--card:#fff;--line:#d8e3ef;--shadow:0 18px 50px rgba(16,48,88,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg)}
body{background:radial-gradient(circle at 8% 0%,rgba(89,184,230,.19),transparent 31rem),radial-gradient(circle at 96% 100%,rgba(244,179,35,.17),transparent 31rem),var(--bg)}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}.hidden{display:none!important}.app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;box-shadow:0 8px 26px rgba(8,47,107,.22)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--navy);font-size:22px;flex:none}.brand b{display:block}.brand small{opacity:.78}.topActions{display:flex;align-items:center;gap:8px}
.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.15);font-size:13px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#c4d2e5}.status.live .dot{background:#60e6a4;box-shadow:0 0 0 5px rgba(96,230,164,.15)}.status.connecting .dot{background:var(--gold);animation:pulse .8s infinite}.status.offline .dot{background:#ff8585}.topBtn{border:0;border-radius:11px;padding:8px 10px;background:rgba(255,255,255,.14);color:#fff;font-weight:800}
.main{width:min(1240px,100%);margin:auto;padding:24px}.card{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)}
.heroGrid,.hostGrid,.questionGrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:17px}.side{display:flex;flex-direction:column;gap:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:950;color:var(--blue)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(45px,7vw,82px);line-height:.93;letter-spacing:-.055em;margin:14px 0 18px}h2{font-size:clamp(29px,4vw,47px);line-height:1.04;letter-spacing:-.035em;margin-bottom:12px}h3{font-size:21px;margin-bottom:9px}.lead{font-size:18px;line-height:1.62;color:var(--muted)}
.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:900;transition:.16s transform,.16s filter}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.03)}.btn:active:not(:disabled){transform:translateY(1px)}.primary{background:var(--navy);color:#fff;box-shadow:0 10px 25px rgba(8,47,107,.23)}.gold{background:var(--gold);color:#1f2a39}.soft{background:#eaf3fc;color:var(--navy)}.danger{background:#feecec;color:#b93239}.success{background:#e5f8ee;color:#217853}.block{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions.center{justify-content:center}
.roomCode{font-size:clamp(52px,8vw,92px);font-weight:1000;letter-spacing:.11em;color:var(--navy);text-align:center;line-height:1}.roomFull{font-size:12px;color:var(--muted);word-break:break-all;text-align:center;margin-top:9px}
.qrBox{min-height:330px;display:grid;place-items:center;padding:15px;background:#fff;border:2px dashed #a8c4df;border-radius:24px;margin-top:12px}.qrBox canvas,.qrBox img{width:min(300px,100%)!important;height:auto!important}.qrFallback{max-width:310px;text-align:center;color:var(--muted);word-break:break-all}
.liveBox{margin-top:12px;padding:12px 14px;border-radius:15px;background:#edf6ff;border:1px solid #cce3f7;color:var(--navy);font-weight:850}.liveBox.good{background:#e8f8ef;border-color:#bde5cd;color:#217853}.liveBox.bad{background:#fff0f0;border-color:#efc5c5;color:#ad3434}
.pills{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#edf6ff;color:var(--navy);font-size:12px;font-weight:900}.pill.goldPill{background:#fff6dc;color:#936000}.pill.greenPill{background:#e8f8ef;color:#217853}
.playerChips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;min-height:45px}.chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#eef6ff;border:1px solid #d4e5f5;font-weight:850}.avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--avatar,#dceafd);font-size:24px;border:3px solid #fff;box-shadow:0 4px 12px rgba(17,54,94,.12)}.avatar.small{width:34px;height:34px;font-size:19px}.avatar.big{width:78px;height:78px;font-size:44px;margin:auto}
.note{padding:12px 14px;border-radius:15px;background:#fff7dc;border:1px solid #edd38b;line-height:1.5}.note.blue{background:#edf6ff;border-color:#cce3f7}.muted{color:var(--muted)}
.questionCard{padding:0;overflow:hidden}.visual{min-height:190px;display:grid;place-items:center;background:linear-gradient(145deg,#092f6c,#1768b6);position:relative;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}.visual:before{width:260px;height:260px;left:-70px;top:-100px}.visual:after{width:300px;height:300px;right:-90px;bottom:-150px}.visualIcon{position:relative;font-size:92px;filter:drop-shadow(0 12px 15px rgba(0,0,0,.18))}.qBody{padding:22px}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eaf3fc;color:var(--navy);font-size:12px;font-weight:900}.tag.diff{background:#fff6dc;color:#936000}.tag.points{background:#e8f8ef;color:#217853}.progress{margin-left:auto;color:var(--muted);font-size:13px;font-weight:850}
.qTitle{font-size:clamp(27px,4vw,46px);line-height:1.09;letter-spacing:-.03em;margin:15px 0 7px}.qZh{font-size:clamp(18px,2.2vw,27px);line-height:1.38;color:var(--muted);margin-bottom:18px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.option{border:0;border-radius:18px;min-height:114px;padding:16px;text-align:left;color:#fff;font-weight:850;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;transition:.15s transform,.15s filter,.15s opacity}.option:nth-child(1){background:#d9474d}.option:nth-child(2){background:#276fc0}.option:nth-child(3){background:#cf9517}.option:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}.letter{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:rgba(255,255,255,.22);font-size:16px}.optEn{font-size:16px;line-height:1.32}.optZh{font-size:13px;line-height:1.35;opacity:.92;font-weight:650}.option.selected{outline:6px solid rgba(244,179,35,.75)}.option.correct{outline:7px solid #5aeba9;opacity:1}.option.wrong{opacity:.32;filter:grayscale(.75)}.option.chosenWrong{opacity:1;outline:7px solid #ff8b8b}
.timer{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--gold) var(--timer,100%),#dce7f2 0);position:relative}.timer:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}.timer b{position:relative;font-size:38px;color:var(--navy)}.timer.urgent{background:conic-gradient(var(--red) var(--timer,100%),#f2dcdc 0);animation:pulse .75s infinite}.timerLabel{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.bigNumber{font-size:59px;font-weight:1000;color:var(--navy);text-align:center;line-height:1}.center{text-align:center}.resultBox{padding:19px;border-radius:20px;background:#e9f8f0;border:1px solid #b9e5cc;margin-top:14px}.resultBox.bad{background:#fff0f0;border-color:#efc5c5}.resultBox .en{font-size:16px;line-height:1.55}.resultBox .zh{font-size:14px;line-height:1.55;color:var(--muted);margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.stat{padding:10px;border-radius:13px;background:#fff;border:1px solid var(--line)}.leaderboard{display:flex;flex-direction:column;gap:8px}.rankRow{display:grid;grid-template-columns:35px 42px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:#fff}.rankNo{font-weight:1000;color:var(--navy)}.score{font-weight:950;color:var(--blue)}.rankSub{display:block;color:var(--muted);font-size:11px}
.leaderScene{min-height:530px;display:grid;align-content:center}.leaderBig{max-width:880px;margin:auto;width:100%}.leaderBig .rankRow{padding:14px 16px;font-size:18px;grid-template-columns:46px 52px 1fr auto}.leaderBig .avatar{width:48px;height:48px;font-size:27px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-top:22px}.podiumBox{border-radius:24px 24px 0 0;color:#fff;text-align:center;padding:18px 10px}.first{min-height:290px;background:linear-gradient(#f6c340,#d99400)}.second{min-height:225px;background:linear-gradient(#aab8c9,#687d95)}.third{min-height:185px;background:linear-gradient(#d59a70,#9c6039)}.podiumBox b{display:block;font-size:22px;margin:9px 0 4px}.medal{font-size:46px}
.joinPanel{max-width:780px;margin:auto}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;color:var(--muted);font-weight:850;margin-bottom:6px}.field input{width:100%;border:1px solid #c8d7e7;border-radius:14px;padding:14px;background:#fff;outline:none;font-size:17px}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,96,184,.12)}.avatarPicker{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.avatarPick{border:2px solid transparent;background:#f1f6fb;border-radius:17px;padding:8px;display:grid;place-items:center}.avatarPick.active{border-color:var(--gold);background:#fff8dc}.waitDots{display:flex;justify-content:center;gap:8px;margin:22px}.waitDots span{width:13px;height:13px;border-radius:50%;background:var(--blue);animation:bounce 1.1s infinite}.waitDots span:nth-child(2){animation-delay:.14s}.waitDots span:nth-child(3){animation-delay:.28s}.playerScore{font-size:64px;font-weight:1000;color:var(--navy)}
.testDetails{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.testDetails summary{cursor:pointer;color:var(--muted);font-weight:850}.footer{text-align:center;padding:16px 20px;color:var(--muted);font-size:12px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999}.confetti span{position:absolute;top:-30px;width:10px;height:20px;animation:fall 4s linear forwards}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes bounce{50%{transform:translateY(-10px);opacity:.55}}@keyframes fall{to{transform:translateY(110vh) rotate(680deg)}}
@media(max-width:900px){.heroGrid,.hostGrid,.questionGrid{grid-template-columns:1fr}.side{order:-1}.questionGrid .side{order:0}.options{grid-template-columns:1fr}.visual{min-height:150px}.visualIcon{font-size:72px}}
@media(max-width:600px){.main{padding:13px}.top{padding:9px 11px}.brand small{display:none}.topBtn{display:none}.status{font-size:11px}.card{padding:17px;border-radius:21px}.qBody{padding:16px}.qTitle{font-size:29px}.qZh{font-size:18px}.avatarPicker{grid-template-columns:repeat(4,1fr)}.roomCode{font-size:50px}.qrBox{min-height:290px}.stats{grid-template-columns:1fr}.podium{gap:5px}.podiumBox{padding:12px 4px}.podiumBox b{font-size:14px}.first{min-height:235px}.second{min-height:190px}.third{min-height:160px}.leaderBig .rankRow{font-size:14px;grid-template-columns:36px 42px 1fr auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
const QUESTIONS=[{"id":1,"p":1,"t":15,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Easy","diffZh":"简单","icon":"📁","en":"Which file name most realistically belongs to an architecture student’s “final” submission?","zh":"建筑学生在最终提交前，最可能出现的“最终版”文件名是哪一个？","a":[["Final_Submission.pdf","Final_Submission.pdf"],["Project_Complete_v1.pdf","Project_Complete_v1.pdf"],["FINAL_v8_really_final_USE_THIS_ONE_render_fixed.pdf","FINAL_v8_really_final_USE_THIS_ONE_render_fixed.pdf"]],"c":2,"exEn":"This is a warm-up joke rather than an academic fact. Architecture files often acquire increasingly desperate names after many revisions.","exZh":"这是一道热身趣味题。建筑设计常经历大量修改，“最终版”文件名往往会不断变长。"},{"id":2,"p":1,"t":15,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Easy","diffZh":"简单","icon":"🔎","en":"When beginning a PhD study, what is usually the most important first step?","zh":"开始一项博士研究时，最重要的第一步通常是什么？","a":[["Formulate a clear, focused, and researchable question","提出一个清晰、聚焦且可研究的问题"],["Collect as much data as possible without a question","在没有问题的情况下尽可能收集数据"],["Choose statistical software before selecting a topic","先决定统计软件，再选择研究主题"]],"c":0,"exEn":"A clear research question guides the literature review, research design, data collection, and analysis.","exZh":"清晰的研究问题会引导文献综述、研究设计、数据收集与分析。"},{"id":3,"p":1,"t":15,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Easy","diffZh":"简单","icon":"🏙️","en":"What does “Chiang Mai” literally mean in Thai?","zh":"“Chiang Mai（清迈）”在泰语中的字面意思是什么？","a":[["Old Capital","古老首都"],["Northern Mountain City","北方山城"],["New City","新城"]],"c":2,"exEn":"“Chiang” means city and “Mai” means new, so Chiang Mai means “New City.”","exZh":"“Chiang”意为城市，“Mai”意为新的，因此 Chiang Mai 即“新城”。"},{"id":4,"p":2,"t":18,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Medium","diffZh":"中等","icon":"🏛️","en":"According to Vitruvius, what are the three fundamental principles of architecture?","zh":"根据维特鲁威（Vitruvius），建筑的三个基本原则是什么？","a":[["Form, Space, and Light","形式、空间、光线"],["Firmitas, Utilitas, and Venustas","坚固、实用、美观"],["Cheap, Fast, and Good","便宜、快速、优质"]],"c":1,"exEn":"The triad is commonly translated as firmness, utility, and beauty or delight.","exZh":"通常译为坚固或稳定、实用或功能、美观或愉悦，是经典建筑评价框架。"},{"id":5,"p":1,"t":15,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Easy","diffZh":"简单","icon":"📚","en":"What is the main purpose of a literature review in a PhD thesis?","zh":"博士论文中的文献综述最主要的作用是什么？","a":[["Completely replace fieldwork","完全替代实地调查"],["Map existing knowledge, identify a gap, and position the study","梳理已有知识、识别研究空白并定位本研究"],["Guarantee an entirely new theory","保证研究一定提出全新理论"]],"c":1,"exEn":"A literature review shows what is known, what remains unresolved, and why the new study is needed.","exZh":"文献综述说明已有研究做了什么、还缺什么，以及你的研究为何必要。"},{"id":6,"p":2,"t":18,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Medium","diffZh":"中等","icon":"⛰️","en":"Approximately how high is Doi Inthanon, Thailand’s highest peak?","zh":"泰国最高峰茵他侬山（Doi Inthanon）的海拔约为多少？","a":[["1,565 metres","1,565 米"],["2,165 metres","2,165 米"],["2,565 metres","2,565 米"]],"c":2,"exEn":"Doi Inthanon rises to about 2,565 metres in Chiang Mai Province and is Thailand’s highest point.","exZh":"茵他侬山海拔约 2,565 米，位于清迈府，是泰国最高点。"},{"id":7,"p":2,"t":18,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Medium","diffZh":"中等","icon":"🏘️","en":"What is the main environmental function of the Five-Foot Way in Southeast Asian shophouses?","zh":"东南亚传统店屋中的“五脚基（Five-Foot Way）”最主要的环境功能是什么？","a":[["Provide a continuous sheltered walkway protected from sun and rain","为行人提供遮阳避雨的连续有顶通道"],["Serve as dedicated rickshaw parking","作为人力车专用停车位"],["Act as a structural earthquake buffer","作为抵抗地震的结构缓冲带"]],"c":0,"exEn":"The covered arcade improves pedestrian comfort in a tropical climate and links shops with the street.","exZh":"连续骑楼空间改善了热带气候下的步行舒适性，并连接街道与店铺。"},{"id":8,"p":1,"t":15,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Easy","diffZh":"简单","icon":"📊","en":"Which of the following is quantitative data?","zh":"以下哪一种属于定量数据？","a":[["The heights of 30 participants recorded in centimetres","30 名参与者以厘米记录的身高"],["Participants’ stories about their living experiences","参与者讲述的居住经历"],["The researcher’s field observation notes","研究者的现场观察笔记"]],"c":0,"exEn":"Quantitative data are expressed numerically and can be statistically described and analysed.","exZh":"定量数据以数值形式表达，可进行统计描述和分析。"},{"id":9,"p":1,"t":15,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Easy","diffZh":"简单","icon":"💦","en":"In which month is Songkran mainly celebrated each year?","zh":"泰国泼水节（Songkran）主要在每年的哪个月份庆祝？","a":[["January","一月"],["April","四月"],["November","十一月"]],"c":1,"exEn":"Songkran is normally celebrated in mid-April as the traditional Thai New Year.","exZh":"宋干节通常在四月中旬举行，是泰国传统新年庆典。"},{"id":10,"p":2,"t":18,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Medium","diffZh":"中等","icon":"📐","en":"In a 1:100 architectural model, how many centimetres represent a real height of 3 metres?","zh":"在 1:100 的建筑模型中，现实中 3 米的高度应做成多少厘米？","a":[["0.3 cm","0.3 厘米"],["30 cm","30 厘米"],["3 cm","3 厘米"]],"c":2,"exEn":"Three metres equals 300 centimetres; 300 divided by 100 equals 3 centimetres.","exZh":"3 米等于 300 厘米；300 ÷ 100 = 3 厘米。"},{"id":11,"p":2,"t":18,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Medium","diffZh":"中等","icon":"🧪","en":"What is the main purpose of conducting a pilot study?","zh":"开展试点研究（pilot study）的主要目的是什么？","a":[["Test whether procedures, tools, recruitment, and implementation are feasible","测试研究流程、工具、招募和现场执行是否可行"],["Definitively prove the research hypothesis","最终证明研究假设"],["Completely replace the full study","完全替代正式研究"]],"c":0,"exEn":"A pilot identifies practical problems and improves the main study rather than producing final conclusions.","exZh":"试点研究用于发现流程问题并改进正式研究，而不是直接得出最终结论。"},{"id":12,"p":1,"t":15,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Easy","diffZh":"简单","icon":"👑","en":"Chiang Mai was historically the capital of which kingdom?","zh":"清迈曾经是哪一个古代王国的首都？","a":[["Sukhothai Kingdom","素可泰王国"],["Lanna Kingdom","兰纳王国"],["Ayutthaya Kingdom","大城王国"]],"c":1,"exEn":"Chiang Mai was founded in 1296 and became the principal capital of the Lanna Kingdom.","exZh":"清迈于 1296 年建立，并成为兰纳王国的重要首都。"},{"id":13,"p":3,"t":20,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Hard","diffZh":"困难","icon":"♻️","en":"Which statement best defines adaptive reuse?","zh":"以下哪一项最准确地描述“适应性再利用（adaptive reuse）”？","a":[["Demolish an old building and construct a replica","拆除旧建筑，并按原样复制一栋新建筑"],["Convert every old building into a museum","所有旧建筑都只能改为博物馆"],["Give an existing building a suitable new use while retaining significant fabric and values","在保留重要建筑特征与价值的同时，为既有建筑赋予新的适宜用途"]],"c":2,"exEn":"Adaptive reuse balances continued use, a new function, and the retention of significant architectural or heritage values.","exZh":"适应性再利用强调既有建筑的持续使用、新功能与遗产价值之间的协调。"},{"id":14,"p":1,"t":15,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Easy","diffZh":"简单","icon":"🔀","en":"What is mixed methods research?","zh":"什么是混合研究方法（mixed methods research）？","a":[["Using only two different qualitative methods","只使用两种不同的定性方法"],["Integrating quantitative and qualitative methods and findings in one study","在同一研究中整合定量与定性方法和结果"],["Using two statistical software packages","同时使用两种统计软件"]],"c":1,"exEn":"The key is integrating quantitative and qualitative evidence in design, analysis, or interpretation.","exZh":"关键不只是同时收集两类数据，还要在研究设计、分析或解释阶段进行整合。"},{"id":15,"p":2,"t":18,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Medium","diffZh":"中等","icon":"🗺️","en":"Including Bangkok’s special administrative status, how many province-level areas does Thailand have?","zh":"将曼谷这一特别行政区计算在内，泰国共有多少个府级行政区？","a":[["77","77 个"],["76","76 个"],["78","78 个"]],"c":0,"exEn":"Thailand has 76 provinces; Bangkok is commonly included for a total of 77 province-level areas.","exZh":"泰国有 76 个府；曼谷具有特别行政地位，常与其合计为 77 个府级行政区。"},{"id":16,"p":1,"t":15,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Easy","diffZh":"简单","icon":"➖","en":"Which architect is most closely associated with the phrase “Less is more”?","zh":"哪位建筑师最常与“Less is more（少即是多）”联系在一起？","a":[["Zaha Hadid","扎哈·哈迪德"],["Robert Venturi","罗伯特·文丘里"],["Ludwig Mies van der Rohe","路德维希·密斯·凡·德·罗"]],"c":2,"exEn":"The phrase is widely associated with Mies’s modernist and minimalist design approach.","exZh":"这句话被广泛用于概括密斯的现代主义与极简设计思想。"},{"id":17,"p":2,"t":18,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Medium","diffZh":"中等","icon":"🎯","en":"Which approach generally best supports a representative sample from a clearly defined target population?","zh":"若研究者希望样本更能代表明确界定的目标总体，哪一种做法通常最好？","a":[["Select only the easiest people to reach","只选择最容易接触到的人"],["Invite only volunteers with the strongest opinions","只邀请意见最强烈的志愿者"],["Use an appropriate probability sample from a clearly defined sampling frame","从清晰的抽样框中采用适当的概率随机抽样"]],"c":2,"exEn":"Probability sampling generally supports representativeness better than convenience sampling.","exZh":"概率抽样不能消除所有偏差，但通常比便利抽样更有利于总体代表性。"},{"id":18,"p":2,"t":18,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Medium","diffZh":"中等","icon":"🐉","en":"Approximately how many steps are on the famous Naga staircase leading to Wat Phra That Doi Suthep?","zh":"通往清迈素贴山双龙寺的著名纳迦阶梯大约有多少级台阶？","a":[["300 steps","300 级"],["306 steps","306 级"],["360 steps","360 级"]],"c":1,"exEn":"The Naga-flanked staircase is commonly recorded as having 306 steps.","exZh":"这条由纳迦护卫的阶梯通常被记载为 306 级。"},{"id":19,"p":2,"t":18,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Medium","diffZh":"中等","icon":"🏠","en":"What is the main environmental reason for raising the floors of traditional Thai houses?","zh":"传统泰式高脚屋采用架空地面的主要环境原因是什么？","a":[["Mainly for decoration","主要为了装饰"],["Reduce flood impact and improve airflow beneath the floor","减轻洪水影响并促进地板下方通风"],["Only to make the house appear taller","只为了让房屋显得更高"]],"c":1,"exEn":"Raised construction responds to monsoon conditions and creates shaded, ventilated semi-outdoor space.","exZh":"架空设计适应热带季风环境，也能形成阴凉、通风的半室外空间。"},{"id":20,"p":2,"t":18,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Medium","diffZh":"中等","icon":"🎯","en":"If a measurement tool produces similar results under similar conditions, what quality does it primarily demonstrate?","zh":"一个测量工具在相似条件下反复使用时能够产生相近结果，主要说明它具有什么？","a":[["Reliability","信度"],["Validity","效度"],["Reflexivity","反思性"]],"c":0,"exEn":"Reliability concerns consistency and reproducibility; validity concerns whether the intended concept is measured.","exZh":"信度关注测量结果的一致性与可重复性；效度关注是否测到了目标概念。"},{"id":21,"p":2,"t":18,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Medium","diffZh":"中等","icon":"🌏","en":"In which year was “Songkran in Thailand” inscribed on UNESCO’s Representative List of Intangible Cultural Heritage?","zh":"“泰国宋干节”于哪一年被列入联合国教科文组织人类非物质文化遗产代表作名录？","a":[["2018","2018 年"],["2021","2021 年"],["2023","2023 年"]],"c":2,"exEn":"“Songkran in Thailand” was inscribed on the UNESCO list in 2023.","exZh":"“Songkran in Thailand”于 2023 年被列入该名录。"},{"id":22,"p":1,"t":15,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Easy","diffZh":"简单","icon":"🛕","en":"In Thai temple architecture, what is a chedi?","zh":"在泰国寺庙建筑中，“Chedi（佛塔）”通常指什么？","a":[["A stupa or reliquary structure that commonly contains sacred relics","通常用于供奉圣物的佛塔或窣堵坡"],["Monks’ living quarters","僧侣宿舍"],["A temple market pavilion","寺庙市场亭"]],"c":0,"exEn":"A chedi is a major sacred structure commonly associated with relics and commemoration.","exZh":"Chedi 是泰国佛寺建筑群中的重要宗教构筑物，常与圣物供奉和纪念功能相关。"},{"id":23,"p":3,"t":20,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Hard","diffZh":"困难","icon":"✅","en":"If a “sense of place” questionnaire measures the defined construct rather than general satisfaction, what does this demonstrate?","zh":"若“空间归属感”问卷准确测量目标概念，而不是一般满意度，这主要体现什么？","a":[["All participants give identical answers","所有参与者的答案完全相同"],["The sample is sufficiently large","样本量足够大"],["High validity","较高的效度"]],"c":2,"exEn":"Validity concerns whether an instrument measures the intended construct.","exZh":"效度关注工具是否真正测量了目标概念；一致性或大样本本身不能证明效度。"},{"id":24,"p":3,"t":20,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Hard","diffZh":"困难","icon":"🧭","en":"How many countries share a land border with Thailand?","zh":"泰国与多少个国家拥有陆地边界？","a":[["4","4 个"],["5","5 个"],["6","6 个"]],"c":0,"exEn":"Thailand shares land borders with Myanmar, Laos, Cambodia, and Malaysia.","exZh":"泰国的陆地邻国是缅甸、老挝、柬埔寨和马来西亚，共 4 个。"},{"id":25,"p":3,"t":20,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Hard","diffZh":"困难","icon":"🏡","en":"What is the V-shaped crossed timber ornament at the roof apex of traditional Lanna houses called?","zh":"兰纳传统住宅屋脊顶部常见的 V 形交叉木构装饰叫什么？","a":[["Kalae","Kalae（กาแล）"],["Chedi","Chedi"],["Five-Foot Way","Five-Foot Way"]],"c":0,"exEn":"Kalae is a distinctive roof feature of traditional Lanna houses and differs from temple chofa.","exZh":"Kalae 是兰纳传统住宅最具辨识度的屋顶构件之一，不应与寺庙屋顶的 Chofa 混淆。"},{"id":26,"p":3,"t":20,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Hard","diffZh":"困难","icon":"🔺","en":"What does triangulation usually mean in research?","zh":"研究中的“三角互证（triangulation）”通常指什么？","a":[["Divide the sample into three equal groups","把样本平均分成三个小组"],["Administer the same questionnaire three times","把同一份问卷重复发放三次"],["Use multiple methods, data sources, or researchers to corroborate and deepen findings","使用多种方法、数据来源或研究者，对发现进行相互验证和深化解释"]],"c":2,"exEn":"Triangulation can reveal contradictions, add perspectives, and strengthen interpretation.","exZh":"三角互证可发现矛盾、补充视角并提高解释的可信度。"},{"id":27,"p":3,"t":20,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Hard","diffZh":"困难","icon":"🌲","en":"Which was Thailand’s first national park?","zh":"泰国第一座国家公园是哪一个？","a":[["Khao Yai National Park","考艾国家公园"],["Erawan National Park","爱侣湾国家公园"],["Doi Inthanon National Park","茵他侬国家公园"]],"c":0,"exEn":"Khao Yai was established in 1962 and is recognised as Thailand’s first national park.","exZh":"考艾国家公园于 1962 年设立，被认定为泰国第一座国家公园。"},{"id":28,"p":3,"t":20,"cat":"Architecture & Student Life","catZh":"建筑学与学生生活","diff":"Hard","diffZh":"困难","icon":"💨","en":"Which opening arrangement generally best supports effective natural cross-ventilation in a room?","zh":"若希望一个房间形成有效的自然穿堂风，哪种开口布置通常最有利？","a":[["Provide inlet and outlet openings on opposite or appropriately different sides","在相对或适当不同的立面设置进风口与出风口"],["Seal all windows and use heavy curtains","封闭全部窗户并使用厚窗帘"],["Use only one skylight with no other outlet","只设置一个没有其他出口的天窗"]],"c":0,"exEn":"Cross-ventilation requires a clear inlet-to-outlet path; size, position, wind direction, and obstructions also matter.","exZh":"穿堂风需要明确的空气进入与排出路径；开口大小、位置、风向和室内阻挡也会影响效果。"},{"id":29,"p":3,"t":20,"cat":"PhD Research Methods","catZh":"博士研究方法","diff":"Hard","diffZh":"困难","icon":"📝","en":"In research involving human participants, when should informed consent normally be obtained?","zh":"在人类参与者研究中，取得知情同意的正确时间通常是什么？","a":[["After data collection is complete","完成数据收集之后"],["Only when a participant asks for it","只有参与者主动询问时才需要"],["Before participation, unless an ethics body has approved a waiver or alteration","参与研究之前；除非伦理审查机构正式批准豁免或变更"]],"c":2,"exEn":"Participants should voluntarily decide after receiving information about purpose, procedures, risks, rights, and withdrawal.","exZh":"参与者应在了解研究目的、程序、风险、权益与退出方式后，自愿决定是否参加。"},{"id":30,"p":2,"t":18,"cat":"Chiang Mai & Thailand","catZh":"清迈与泰国","diff":"Medium","diffZh":"中等","icon":"📅","en":"Which Thai Buddhist Era year corresponds to Gregorian year 2026?","zh":"公历 2026 年对应泰国佛历哪一年？","a":[["B.E. 2569","佛历 2569 年"],["B.E. 2026","佛历 2026 年"],["B.E. 2069","佛历 2069 年"]],"c":0,"exEn":"The Thai Buddhist Era is generally 543 years ahead, so 2026 + 543 = 2569.","exZh":"泰国常用佛历年份通常比公历多 543 年，因此 2026 + 543 = 2569。"}];
const AVATARS=[
 {e:"🐘",n:"Lanna Elephant",c:"#d9efff"},{e:"🐼",n:"Studio Panda",c:"#f2e8ff"},{e:"🐯",n:"Teak Tiger",c:"#ffe2cf"},
 {e:"🦉",n:"Research Owl",c:"#e5e8ff"},{e:"🐱",n:"Model Cat",c:"#ffe4ed"},{e:"🦊",n:"Urban Fox",c:"#ffe9d2"},
 {e:"🐰",n:"Courtyard Rabbit",c:"#e7f6ff"},{e:"🐻",n:"Concrete Bear",c:"#eee5da"},{e:"🦎",n:"Tropical Gecko",c:"#e2f7df"},
 {e:"🦜",n:"Colour Parrot",c:"#fff2cc"},{e:"🐉",n:"Naga Dragon",c:"#e7e2ff"},{e:"🦅",n:"Sky Garuda",c:"#ffe8d5"}
];
const VERSION="V10 LIVE MQTT";
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const params=new URLSearchParams(location.search);
let mode=params.has("join")?"player":"host";
let room=(params.get("join")||params.get("host")||"").replace(/[^A-Za-z0-9_-]/g,"");
let hostKey=(params.get("key")||"").replace(/[^A-Za-z0-9_-]/g,"");
const $=id=>document.getElementById(id);
const main=$("main"),statusEl=$("status"),statusText=$("statusText"),soundBtn=$("soundBtn"),newRoomBtn=$("newRoomBtn");
let client=null,connected=false,brokerIndex=0,connectGeneration=0,phaseTimer=null,clockTimer=null,heartbeatTimer=null,soundOn=true,lastStateAt=0;
let state=null,answers={},selectedAvatar=0,joined=false,playerState=null;
const pid=getPlayerId();

function rand(n=20){const chars="abcdefghjkmnpqrstuvwxyz23456789";const bytes=new Uint8Array(n);crypto.getRandomValues(bytes);return Array.from(bytes,b=>chars[b%chars.length]).join("")}
function getPlayerId(){let x=sessionStorage.getItem("archcmu_pid");if(!x){x="p_"+rand(18);sessionStorage.setItem("archcmu_pid",x)}return x}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function avatarHTML(i,size=""){const a=AVATARS[Number(i)||0]||AVATARS[0];return `<span class="avatar ${size}" style="--avatar:${a.c}" title="${esc(a.n)}">${a.e}</span>`}
function visibleCode(r){return r.slice(0,6).toUpperCase()}
function setStatus(kind,text){statusEl.className="status "+kind;statusText.textContent=text}
function shell(html){main.innerHTML=html;scrollTo({top:0,behavior:"smooth"})}
function publicState(){const s=JSON.parse(JSON.stringify(state));delete s.hostKey;return s}
function topic(kind){return `archcmu/v10/${room}/${kind}`}
function joinURL(){return `${location.origin}${location.pathname}?join=${encodeURIComponent(room)}&v=10`}
function hostURL(){return `${location.origin}${location.pathname}?host=${encodeURIComponent(room)}&key=${encodeURIComponent(hostKey)}&v=10`}
function saveHost(){if(mode!=="host"||!state)return;localStorage.setItem("archcmu_v10_host_"+room,JSON.stringify({state,answers}))}
function loadHost(){try{return JSON.parse(localStorage.getItem("archcmu_v10_host_"+room)||"null")}catch{return null}}
function publish(kind,payload,retain=false){if(!connected||!client)return false;client.publish(topic(kind),JSON.stringify(payload),{qos:1,retain},()=>{});return true}
function broadcastState(){if(mode!=="host"||!state)return;state.hostOnlineAt=Date.now();saveHost();publish("state",publicState(),true)}
function rankPlayers(){return Object.entries(state?.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0)||(b.correct||0)-(a.correct||0)||(a.totalTime||0)-(b.totalTime||0)||(a.joinedAt||0)-(b.joinedAt||0))}
function leaderboardHTML(limit=10,big=false){const list=rankPlayers().slice(0,limit);if(!list.length)return `<p class="muted center">No players yet.</p>`;return `<div class="leaderboard ${big?"leaderBig":""}">${list.map((p,i)=>`<div class="rankRow"><div class="rankNo">#${i+1}</div>${avatarHTML(p.avatar,"small")}<div><b>${esc(p.name)}</b><span class="rankSub">${p.correct||0} correct · ${p.wrong||0} wrong</span></div><div class="score">${Math.round(p.score||0)}</div></div>`).join("")}</div>`}
function myRank(){const i=rankPlayers().findIndex(p=>p.id===pid);return i<0?"—":i+1}
function confetti(){const box=document.getElementById("confetti");box.innerHTML="";for(let i=0;i<90;i++){const s=document.createElement("span");s.style.left=Math.random()*100+"%";s.style.background=["#f4b323","#1768b6","#2fa16e","#e54f55"][i%4];s.style.animationDelay=Math.random()*1.3+"s";box.appendChild(s)}setTimeout(()=>box.innerHTML="",5000)}
function beep(freq=700,dur=.1){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.stop(a.currentTime+dur)}catch{}}
function setQuery(url){history.replaceState(null,"",url)}
function currentPlayer(){return state?.players?.[pid]||null}

function connectLive(){
  const gen=++connectGeneration;
  connected=false;
  clearInterval(heartbeatTimer);
  try{client?.end(true)}catch{}
  setStatus("connecting",brokerIndex?"Connecting backup…":"Connecting…");
  if(!window.mqtt){setTimeout(()=>{if(gen===connectGeneration)connectLive()},1500);return}
  const broker=BROKERS[brokerIndex%BROKERS.length];
  const clientId=`archcmu_${mode}_${pid}_${rand(6)}`;
  let opened=false;
  client=mqtt.connect(broker,{clientId,clean:true,connectTimeout:7000,reconnectPeriod:2200,keepalive:25,protocolVersion:4});
  const watchdog=setTimeout(()=>{if(gen!==connectGeneration||opened)return;brokerIndex=(brokerIndex+1)%BROKERS.length;connectLive()},8500);
  client.on("connect",()=>{
    if(gen!==connectGeneration)return;
    opened=true;clearTimeout(watchdog);connected=true;setStatus("live","Live");
    if(mode==="host"){
      client.subscribe(topic("event"),{qos:1});
      broadcastState();
      heartbeatTimer=setInterval(broadcastState,1800);
      renderHost();
    }else{
      client.subscribe(topic("state"),{qos:1});
      if(joined)sendJoin();
      renderPlayer();
    }
  });
  client.on("message",(t,b)=>{
    if(gen!==connectGeneration)return;
    let msg;try{msg=JSON.parse(b.toString())}catch{return}
    if(mode==="host"&&t===topic("event"))handleHostEvent(msg);
    if(mode==="player"&&t===topic("state"))handlePlayerState(msg);
  });
  client.on("reconnect",()=>{if(gen===connectGeneration){connected=false;setStatus("connecting","Reconnecting…")}});
  client.on("offline",()=>{if(gen===connectGeneration){connected=false;setStatus("offline","Offline")}})
  client.on("error",()=>{if(gen===connectGeneration&&!opened)setStatus("connecting","Trying backup…")});
}

function createFreshHost(){
  mode="host";room=rand(24);hostKey=rand(20);
  state={version:10,room,code:visibleCode(room),createdAt:Date.now(),phase:"lobby",questionIndex:-1,deadline:0,durationMs:0,players:{},answerCount:0,stats:null,hostOnlineAt:Date.now()};
  answers={};saveHost();setQuery(hostURL());renderHost();connectLive();
}
function restoreHost(){
  const saved=loadHost();
  if(saved?.state?.version===10){state=saved.state;answers=saved.answers||{}}
  else state={version:10,room,code:visibleCode(room),createdAt:Date.now(),phase:"lobby",questionIndex:-1,deadline:0,durationMs:0,players:{},answerCount:0,stats:null,hostOnlineAt:Date.now()};
  renderHost();connectLive();resumePhaseTimer();
}
function handleHostEvent(m){
  if(!m||m.room!==room||!m.type)return;
  if(m.type==="join"){
    const name=String(m.name||"").trim().slice(0,24);if(!name||!m.pid)return;
    const existing=state.players[m.pid]||{};
    state.players[m.pid]={name,avatar:Math.max(0,Math.min(AVATARS.length-1,Number(m.avatar)||0)),score:existing.score||0,correct:existing.correct||0,wrong:existing.wrong||0,totalTime:existing.totalTime||0,joinedAt:existing.joinedAt||Date.now(),answeredQ:existing.answeredQ??-1,lastPoints:existing.lastPoints||0,lastCorrect:existing.lastCorrect||false,lastChoice:existing.lastChoice??null,demo:false};
    broadcastState();renderHost();
  }else if(m.type==="answer"){
    if(state.phase!=="question"||Number(m.q)!==state.questionIndex||!state.players[m.pid])return;
    if(Date.now()>state.deadline+600)return;
    const choice=Number(m.choice);if(!Number.isInteger(choice)||choice<0||choice>2)return;
    answers[state.questionIndex]??={};if(answers[state.questionIndex][m.pid])return;
    answers[state.questionIndex][m.pid]={choice,receivedAt:Date.now()};
    state.players[m.pid].answeredQ=state.questionIndex;state.players[m.pid].lastChoice=choice;
    state.answerCount=Object.keys(answers[state.questionIndex]).length;
    broadcastState();renderHostDynamic();
  }else if(m.type==="sync"){broadcastState()}
}
function addDemoPlayers(n=3){
  const names=["Mali","Niran","Lin","Pim","Ken","Aya","Arun","Mei","Noah","Fah"];
  for(let i=0;i<n;i++){const id="demo_"+i;state.players[id]??={name:names[i],avatar:i,score:0,correct:0,wrong:0,totalTime:0,joinedAt:Date.now()+i,answeredQ:-1,lastPoints:0,lastCorrect:false,lastChoice:null,demo:true}}
  broadcastState();renderHost();
}
function clearDemoPlayers(){for(const id of Object.keys(state.players))if(state.players[id].demo)delete state.players[id];broadcastState();renderHost()}
function resetGame(){
  if(!confirm("Reset scores and return to the lobby?"))return;
  clearTimeout(phaseTimer);answers={};for(const p of Object.values(state.players)){p.score=0;p.correct=0;p.wrong=0;p.totalTime=0;p.answeredQ=-1;p.lastPoints=0;p.lastCorrect=false;p.lastChoice=null}
  Object.assign(state,{phase:"lobby",questionIndex:-1,deadline:0,durationMs:0,answerCount:0,stats:null});broadcastState();renderHost();
}
function startQuestion(i){
  clearTimeout(phaseTimer);const q=QUESTIONS[i];answers[i]={};
  Object.values(state.players).forEach(p=>{p.answeredQ=-1;p.lastPoints=0;p.lastCorrect=false;p.lastChoice=null});
  Object.assign(state,{phase:"question",questionIndex:i,durationMs:q.t*1000,deadline:Date.now()+q.t*1000,answerCount:0,stats:null});
  broadcastState();renderHost();beep(760,.12);phaseTimer=setTimeout(revealQuestion,q.t*1000+80);
}
function revealQuestion(){
  if(state.phase!=="question")return;
  clearTimeout(phaseTimer);const q=QUESTIONS[state.questionIndex],a=answers[state.questionIndex]||{},stats=[0,0,0];
  for(const [id,p] of Object.entries(state.players)){
    let ans=a[id];
    if(p.demo&&!ans){const choice=Math.random()<.72?q.c:Math.floor(Math.random()*3);ans={choice,receivedAt:state.deadline-Math.floor(Math.random()*Math.max(100,state.durationMs*.72))};a[id]=ans}
    let ok=false,rt=state.durationMs,points=0;
    if(ans){stats[ans.choice]++;rt=Math.max(0,Math.min(state.durationMs,ans.receivedAt-(state.deadline-state.durationMs)));ok=ans.choice===q.c;if(ok){const remaining=Math.max(0,state.durationMs-rt);points=q.p*1000+Math.round(500*remaining/state.durationMs)}p.lastChoice=ans.choice}
    if(ok){p.correct=(p.correct||0)+1;p.score=(p.score||0)+points}else p.wrong=(p.wrong||0)+1;
    p.totalTime=(p.totalTime||0)+rt;p.lastCorrect=ok;p.lastPoints=points;p.answeredQ=state.questionIndex;
  }
  answers[state.questionIndex]=a;
  Object.assign(state,{phase:"results",stats,durationMs:5500,deadline:Date.now()+5500,answerCount:Object.keys(a).length});
  broadcastState();renderHost();beep(920,.13);phaseTimer=setTimeout(afterResults,5580);
}
function afterResults(){
  if(state.questionIndex>=QUESTIONS.length-1)return finishGame();
  if((state.questionIndex+1)%5===0){
    Object.assign(state,{phase:"leaderboard",durationMs:6000,deadline:Date.now()+6000});
    broadcastState();renderHost();phaseTimer=setTimeout(()=>startQuestion(state.questionIndex+1),6080);
  }else startQuestion(state.questionIndex+1);
}
function finishGame(){
  clearTimeout(phaseTimer);Object.assign(state,{phase:"finished",durationMs:0,deadline:0});broadcastState();renderHost();confetti();beep(1050,.2)
}
function resumePhaseTimer(){
  if(mode!=="host"||!state)return;clearTimeout(phaseTimer);
  const remain=Math.max(0,state.deadline-Date.now());
  if(state.phase==="question")phaseTimer=setTimeout(revealQuestion,remain+50);
  else if(state.phase==="results")phaseTimer=setTimeout(afterResults,remain+50);
  else if(state.phase==="leaderboard")phaseTimer=setTimeout(()=>startQuestion(state.questionIndex+1),remain+50);
}
function renderHost(){
  if(!state)return;
  if(state.phase==="lobby")renderHostLobby();
  else if(state.phase==="question")renderHostQuestion();
  else if(state.phase==="results")renderHostResults();
  else if(state.phase==="leaderboard")renderLeaderboard(true);
  else if(state.phase==="finished")renderFinal(true);
}
function renderHostLobby(){
  const list=rankPlayers(),ready=connected&&list.length>0;
  shell(`<section class="hostGrid"><div class="card center"><div class="eyebrow">PHD HOMEROOM · LIVE QUIZ</div><div class="roomCode">${esc(state.code)}</div><div class="qrBox" id="qrBox"></div><div class="roomFull">${esc(joinURL())}</div><div class="actions center"><button class="btn soft" id="copyJoin">Copy join link</button><button class="btn soft" id="openTest">Open player test</button></div><div class="liveBox ${connected?"good":"bad"}">${connected?"● Room is live — participants can scan now.":"Connecting to the live room…"}</div><div class="pills"><span class="pill">Up to 30 participants</span><span class="pill goldPill">30 bilingual questions</span><span class="pill greenPill">Automatic scoring</span></div><h2>${list.length} joined</h2><div class="playerChips">${list.length?list.map(p=>`<span class="chip">${avatarHTML(p.avatar,"small")}${esc(p.name)}</span>`).join(""):`<span class="muted">Names appear here after participants tap Join.</span>`}</div><div class="actions center"><button class="btn gold" id="startGame" ${ready?"":"disabled"}>Start Game</button><button class="btn danger" id="resetGame">Reset</button></div><details class="testDetails"><summary>Technical test tools</summary><div class="actions center"><button class="btn soft" id="addDemo">Add 3 demo players</button><button class="btn soft" id="clearDemo">Clear demo players</button></div></details></div><aside class="side"><div class="card"><h3>How it works</h3><p>1. Keep this host page open.<br>2. Participants scan the QR.<br>3. They choose an avatar and enter a name.<br>4. Tap <b>Start Game</b>.</p></div><div class="card"><h3>Automatic mode</h3><p>15–20 seconds per question, automatic answer reveal, and a leaderboard every five questions.</p></div><div class="card"><h3>Scoring</h3><p>Easy ×1, Medium ×2, Hard ×3, plus a speed bonus for correct answers.</p></div></aside></section>`);
  drawQR();$("copyJoin").onclick=()=>navigator.clipboard?.writeText(joinURL());$("openTest").onclick=()=>window.open(joinURL(),"archcmu_player_test");$("startGame").onclick=()=>startQuestion(0);$("resetGame").onclick=resetGame;$("addDemo").onclick=()=>addDemoPlayers(3);$("clearDemo").onclick=clearDemoPlayers;
}
function qCard(q,reveal=false,chosen=null){
  return `<article class="card questionCard"><div class="visual"><div class="visualIcon">${q.icon}</div></div><div class="qBody"><div class="meta"><span class="tag">${esc(q.cat)}</span><span class="tag diff">${esc(q.diff)} · ${q.t}s</span><span class="tag points">×${q.p}</span><span class="progress">${q.id}/${QUESTIONS.length}</span></div><h2 class="qTitle">${esc(q.en)}</h2><div class="qZh">${esc(q.zh)}</div><div class="options">${q.a.map((a,i)=>{let cls="";if(reveal)cls=i===q.c?"correct":chosen===i?"chosenWrong":"wrong";else if(chosen===i)cls="selected";return `<button class="option ${cls}" data-choice="${i}" ${reveal?"disabled":""}><span class="letter">${"ABC"[i]}</span><span class="optEn">${esc(a[0])}</span><span class="optZh">${esc(a[1])}</span></button>`}).join("")}</div></div></article>`
}
function renderHostQuestion(){
  const q=QUESTIONS[state.questionIndex];
  shell(`<section class="questionGrid"><div>${qCard(q)}</div><aside class="side"><div class="card"><div class="timer" id="timer"><b id="timerText">0</b></div><div class="timerLabel">Automatic reveal</div></div><div class="card center"><div class="bigNumber" id="answerNumber">${state.answerCount||0}</div><p>answers received</p></div><button class="btn gold block" id="revealNow">Reveal now</button><button class="btn danger block" id="endGame">End game</button></aside></section>`);
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);$("revealNow").onclick=revealQuestion;$("endGame").onclick=finishGame;runClock();
}
function renderHostDynamic(){const x=document.getElementById("answerNumber");if(x)x.textContent=state.answerCount||0}
function renderHostResults(){
  const q=QUESTIONS[state.questionIndex],correct=q.a[q.c];
  shell(`<section class="questionGrid"><div>${qCard(q,true)}<div class="resultBox"><h3>Correct: ${esc(correct[0])} / ${esc(correct[1])}</h3><div class="en">${esc(q.exEn)}</div><div class="zh">${esc(q.exZh)}</div><div class="stats">${q.a.map((a,i)=>`<div class="stat"><b>${"ABC"[i]} · ${state.stats?.[i]||0}</b><br><small>${esc(a[0])}</small></div>`).join("")}</div></div></div><aside class="side"><div class="card"><h3>Live ranking</h3>${leaderboardHTML(8)}</div><div class="card"><div class="timer" id="timer"><b id="timerText">0</b></div><div class="timerLabel">Next screen automatically</div></div><button class="btn soft block" id="nextNow">Next now</button></aside></section>`);
  $("nextNow").onclick=afterResults;runClock();
}
function renderLeaderboard(host=false){
  shell(`<section class="card leaderScene"><div class="eyebrow center">LEADERBOARD · AFTER QUESTION ${state.questionIndex+1}</div><h2 class="center">Top Players</h2>${leaderboardHTML(12,true)}${host?`<div class="card" style="max-width:240px;margin:18px auto 0"><div class="timer" id="timer"><b id="timerText">0</b></div><div class="timerLabel">Next question automatically</div></div>`:""}</section>`);if(host)runClock();
}
function podiumHTML(){
  const top=rankPlayers().slice(0,3),get=i=>top[i]||{name:"—",avatar:i,score:0};
  const second=get(1),first=get(0),third=get(2);
  return `<div class="podium"><div class="podiumBox second"><div class="medal">🥈</div>${avatarHTML(second.avatar,"big")}<b>${esc(second.name)}</b><span>${Math.round(second.score||0)}</span></div><div class="podiumBox first"><div class="medal">🥇</div>${avatarHTML(first.avatar,"big")}<b>${esc(first.name)}</b><span>${Math.round(first.score||0)}</span></div><div class="podiumBox third"><div class="medal">🥉</div>${avatarHTML(third.avatar,"big")}<b>${esc(third.name)}</b><span>${Math.round(third.score||0)}</span></div></div>`
}
function renderFinal(host=false){
  shell(`<section class="card leaderScene"><div class="eyebrow center">ARCHCMU GLOBAL CHALLENGE</div><h2 class="center">Final Results</h2>${podiumHTML()}<div style="margin-top:22px">${leaderboardHTML(30,true)}</div>${host?`<div class="actions center"><button class="btn gold" id="playAgain">Play again</button><button class="btn soft" id="newRoomFinal">New room</button></div>`:""}</section>`);
  if(host){$("playAgain").onclick=resetGame;$("newRoomFinal").onclick=createFreshHost}
}

function drawQR(){
  const el=document.getElementById("qrBox");if(!el)return;
  el.innerHTML="";
  if(window.QRCode?.toCanvas){
    const c=document.createElement("canvas");el.appendChild(c);
    QRCode.toCanvas(c,joinURL(),{width:310,margin:2,color:{dark:"#082f6b",light:"#ffffff"}},err=>{if(err)qrFallback(el)})
  }else setTimeout(()=>{if(document.getElementById("qrBox"))drawQR()},900);
}
function qrFallback(el){el.innerHTML=`<div class="qrFallback"><b>QR library is still loading.</b><br><br>${esc(joinURL())}</div>`}
function runClock(){
  clearInterval(clockTimer);const tick=()=>{const remain=Math.max(0,state.deadline-Date.now()),sec=Math.ceil(remain/1000),pct=Math.max(0,Math.min(100,100*remain/Math.max(1,state.durationMs)));const t=document.getElementById("timerText"),r=document.getElementById("timer");if(t)t.textContent=sec;if(r){r.style.setProperty("--timer",pct+"%");r.classList.toggle("urgent",sec<=5)}};tick();clockTimer=setInterval(tick,200)
}

function initPlayer(){
  const remembered=localStorage.getItem("archcmu_name")||"";selectedAvatar=Number(localStorage.getItem("archcmu_avatar")||0);
  joined=false;playerState={name:remembered,avatar:selectedAvatar,choice:null,lastQuestion:-1};
  renderPlayer();connectLive();
}
function sendJoin(){if(!playerState?.name)return;publish("event",{room,type:"join",pid,name:playerState.name,avatar:playerState.avatar},false)}
function handlePlayerState(s){
  if(!s||s.version!==10||s.room!==room)return;
  const oldPhase=state?.phase,oldQ=state?.questionIndex;state=s;lastStateAt=Date.now();
  const me=currentPlayer();if(me)joined=true;
  if(oldQ!==state.questionIndex&&state.phase==="question"){playerState.choice=null;playerState.lastQuestion=state.questionIndex;beep(760,.1)}
  if(oldPhase!==state.phase&&state.phase==="finished")confetti();
  renderPlayer();
}
function renderPlayer(){
  if(!joined||!playerState?.name)return renderJoin();
  if(!state||!currentPlayer())return renderWaitingForJoin();
  if(state.phase==="lobby")renderPlayerLobby();
  else if(state.phase==="question")renderPlayerQuestion();
  else if(state.phase==="results")renderPlayerResults();
  else if(state.phase==="leaderboard")renderLeaderboard(false);
  else if(state.phase==="finished")renderFinal(false);
}
function renderJoin(){
  shell(`<section class="card joinPanel"><div class="eyebrow">JOIN LIVE GAME</div><h2>ARCHCMU Global Challenge</h2><p class="lead">Room <b>${esc(visibleCode(room))}</b> · Choose an avatar and enter your name.</p><div class="avatarPicker">${AVATARS.map((a,i)=>`<button class="avatarPick ${i===selectedAvatar?"active":""}" data-avatar="${i}" title="${esc(a.n)}">${avatarHTML(i)}</button>`).join("")}</div><label class="field"><span>Your name / 姓名</span><input id="nameInput" maxlength="24" autocomplete="name" placeholder="Type your name"></label><button class="btn gold block" id="joinBtn" ${connected?"":"disabled"}>${connected?"Join Game":"Connecting…"}</button><div class="liveBox ${connected?"good":"bad"}">${connected?"Connected — ready to join.":"Connecting to the room…"}</div></section>`);
  document.querySelectorAll(".avatarPick").forEach(b=>b.onclick=()=>{selectedAvatar=Number(b.dataset.avatar);renderJoin();setTimeout(()=>document.getElementById("nameInput")?.focus(),0)});
  const input=document.getElementById("nameInput");input.value=playerState?.name||localStorage.getItem("archcmu_name")||"";
  $("joinBtn").onclick=()=>{const name=input.value.trim().slice(0,24);if(!name){input.focus();return}playerState={name,avatar:selectedAvatar,choice:null,lastQuestion:-1};localStorage.setItem("archcmu_name",name);localStorage.setItem("archcmu_avatar",String(selectedAvatar));joined=true;sendJoin();renderWaitingForJoin()};
  input.onkeydown=e=>{if(e.key==="Enter")$("joinBtn").click()}
}
function renderWaitingForJoin(){
  shell(`<section class="card joinPanel center"><div class="avatar big" style="--avatar:${AVATARS[playerState.avatar].c}">${AVATARS[playerState.avatar].e}</div><h2>Joining room…</h2><p>${esc(playerState.name)}</p><div class="waitDots"><span></span><span></span><span></span></div><p class="muted">Keep this page open. Your name will appear on the host screen.</p><button class="btn soft" id="retryJoin">Retry</button></section>`);$("retryJoin").onclick=sendJoin
}
function renderPlayerLobby(){
  const me=currentPlayer();
  shell(`<section class="card joinPanel center">${avatarHTML(me.avatar,"big")}<div class="eyebrow">YOU ARE IN</div><h2>${esc(me.name)}</h2><p class="lead">Waiting for the host to start the game.</p><div class="waitDots"><span></span><span></span><span></span></div><div class="pills"><span class="pill">Room ${esc(state.code)}</span><span class="pill greenPill">${Object.keys(state.players).length} joined</span></div></section>`)
}
function renderPlayerQuestion(){
  const q=QUESTIONS[state.questionIndex],chosen=playerState.choice;
  shell(`<section class="questionGrid"><div>${qCard(q,false,chosen)}</div><aside class="side"><div class="card"><div class="timer" id="timer"><b id="timerText">0</b></div><div class="timerLabel">${chosen==null?"Choose one answer":"Answer submitted"}</div></div><div class="card center"><p>Your score</p><div class="playerScore">${Math.round(currentPlayer()?.score||0)}</div><p>Rank #${myRank()}</p></div></aside></section>`);
  document.querySelectorAll(".option").forEach(b=>{b.disabled=chosen!=null;b.onclick=()=>submitAnswer(Number(b.dataset.choice))});runClock()
}
function submitAnswer(choice){
  if(playerState.choice!=null||state.phase!=="question"||Date.now()>state.deadline+300)return;
  playerState.choice=choice;publish("event",{room,type:"answer",pid,q:state.questionIndex,choice},false);beep(620,.08);renderPlayerQuestion()
}
function renderPlayerResults(){
  const q=QUESTIONS[state.questionIndex],me=currentPlayer(),chosen=me?.lastChoice??playerState.choice,ok=!!me?.lastCorrect;
  shell(`<section class="questionGrid"><div>${qCard(q,true,chosen)}<div class="resultBox ${ok?"":"bad"}"><h3>${ok?"✅ Correct!":"❌ Not this time"} ${ok?`+${Math.round(me?.lastPoints||0)}`:""}</h3><div class="en">${esc(q.exEn)}</div><div class="zh">${esc(q.exZh)}</div></div></div><aside class="side"><div class="card center"><p>Your score</p><div class="playerScore">${Math.round(me?.score||0)}</div><p>Rank #${myRank()}</p></div><div class="card"><h3>Top 5</h3>${leaderboardHTML(5)}</div></aside></section>`)
}
function boot(){
  soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?"🔊":"🔇"};
  newRoomBtn.onclick=()=>{if(mode==="host")createFreshHost();else location.href=location.pathname};
  if(mode==="player"){if(!room){location.href=location.pathname;return}initPlayer()}
  else{if(!room){createFreshHost();return}if(!hostKey)hostKey=rand(20);setQuery(hostURL());restoreHost()}
}
boot();
</script>
