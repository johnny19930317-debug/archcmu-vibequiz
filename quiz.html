.soundBtn{min-width:44px}.celebrationTitle{font-size:clamp(48px,8vw,92px)!important;background:linear-gradient(90deg,#0a376f,#6f4ab1,#d18a00);-webkit-background-clip:text;background-clip:text;color:transparent;animation:celebrateGlow 1.8s ease-in-out infinite alternate}.celebrationRibbon{display:inline-flex;align-items:center;gap:10px;padding:10px 17px;border-radius:999px;background:#fff4cf;border:1px solid #efd079;color:#875b00;font-weight:950;margin-bottom:11px}.celebrationStars{font-size:34px;letter-spacing:8px;animation:floatStars 1.6s ease-in-out infinite alternate}.winnerCallout{margin:24px auto 0;max-width:680px;padding:17px;border-radius:19px;background:linear-gradient(135deg,#edf6ff,#fff8df);border:1px solid var(--line);font-weight:850}.finalStandings{max-width:820px;margin:24px auto 0;text-align:left}.finalStandings h3{text-align:center}.finalStandings .rankRow{grid-template-columns:48px 48px 1fr auto}.finalStandings .avatar{width:42px;height:42px}

<script>
window.QUIZ_QUESTIONS=[{"id":1,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is the central circular opening at the top of the Pantheon’s dome called?","answers":["The oculus","The clerestory","The transept"],"correctIndex":0,"explanation":"The oculus is the open “eye” at the centre of the Pantheon’s dome. It provides natural light and creates a changing connection between the interior and the sky.","source":"Italian Ministry of Culture - Pantheon","visual":{"icon":"◉","label":"Pantheon Oculus","motif":"dome"},"imageFile":"Oculus of the Pantheon, Rome.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Pantheon · Rome"},{"id":2,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"What was the main structural purpose of flying buttresses in Gothic cathedrals?","answers":["To form private chapels outside the nave","To transfer lateral thrust from high vaults to exterior supports","To support bells above the main entrance"],"correctIndex":1,"explanation":"Flying buttresses redirect the lateral thrust of stone vaults toward exterior piers, allowing taller interiors, thinner walls and larger stained-glass windows.","source":"Notre-Dame de Paris - architectural history","visual":{"icon":"⛪","label":"Gothic Structure","motif":"arches"},"imageFile":"Cathedral Flying Buttresses.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Flying buttress · Gothic structure"},{"id":3,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Filippo Brunelleschi is most closely associated with the great dome of which building?","answers":["The Pantheon in Rome","St Paul’s Cathedral in London","Florence Cathedral (Santa Maria del Fiore)"],"correctIndex":2,"explanation":"Brunelleschi designed the innovative masonry dome of Florence Cathedral, one of the defining engineering achievements of the early Renaissance.","source":"Opera di Santa Maria del Fiore - official Duomo website","visual":{"icon":"🏛","label":"Florence Dome","motif":"dome"},"imageFile":"Brunelleschi's Dome, Florence Cathedral.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Santa Maria del Fiore · Florence"},{"id":4,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Crystal Palace of 1851 important in architectural history?","answers":["It demonstrated large-scale prefabricated iron-and-glass construction","It was the first reinforced-concrete skyscraper","It revived the construction system of a medieval stone cathedral"],"correctIndex":0,"explanation":"Joseph Paxton’s Crystal Palace used standardized iron and glass components assembled rapidly, becoming a landmark of industrialized and prefabricated construction.","source":"Victoria and Albert Museum - Crystal Palace","visual":{"icon":"◇","label":"Crystal Palace","motif":"grid"},"imageFile":"Crystal Palace - interior.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Crystal Palace · Great Exhibition, 1851"},{"id":5,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which statement best describes a central ambition of the Bauhaus?","answers":["To reproduce only medieval European styles","To unite art, craft, architecture, design and modern production","To separate technology from design education"],"correctIndex":1,"explanation":"The Bauhaus brought creative disciplines together and connected design education with modern materials, production and social reform.","source":"Bauhaus-Archiv - History of the Bauhaus","visual":{"icon":"▦","label":"Bauhaus","motif":"grid"},"imageFile":"Bauhaus-Dessau main building.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Bauhaus Building · Dessau"},{"id":6,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is most distinctive about Frank Lloyd Wright’s placement of Fallingwater?","answers":["It is buried completely underground","It stands at the centre of a formal French garden","It is built over and integrated with a natural waterfall"],"correctIndex":2,"explanation":"Wright designed the house so its occupants would live with the waterfall rather than merely look at it, making the site part of the architecture.","source":"Fallingwater - official introduction","visual":{"icon":"🌊","label":"Fallingwater","motif":"water"},"imageFile":"TAG Fallingwater Waterfall.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Fallingwater · House over the waterfall"},{"id":7,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"What geometric idea helped make the roof shells of the Sydney Opera House buildable as a repeated system?","answers":["The shell segments were derived from the geometry of a common sphere","Every shell was designed as a separate pyramid","All roofs were suspended from one central mast"],"correctIndex":0,"explanation":"Jørn Utzon’s “spherical solution” generated the shells from a common sphere, enabling repeated ribs and more rational construction.","source":"Sydney Opera House - The Spherical Solution","visual":{"icon":"◒","label":"Sydney Opera House","motif":"shells"},"imageFile":"Model of Shells (Sydney Opera House) (5373921362).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Sydney Opera House · repeated shell geometry"},{"id":8,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which spatial feature most strongly organizes Frank Lloyd Wright’s Guggenheim Museum in New York?","answers":["A sequence of isolated underground galleries","A continuous spiral ramp around a central atrium","A grid of identical courtyards"],"correctIndex":1,"explanation":"The museum is organized by a spiral ramp around a central rotunda, creating a continuous movement through the exhibitions.","source":"Solomon R. Guggenheim Museum - Architecture","visual":{"icon":"◎","label":"Guggenheim Spiral","motif":"spiral"},"imageFile":"Guggenheim-Interior.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Solomon R. Guggenheim Museum · spiral ramp"},{"id":9,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Centre Pompidou in Paris often described as an “inside-out” building?","answers":["Its galleries are entirely underground","Its main facade copies a classical palace","Many services, structural elements and circulation systems are visibly expressed on the exterior"],"correctIndex":2,"explanation":"The building places major technical systems and circulation on the outside, freeing flexible interior exhibition space and making infrastructure part of the architectural image.","source":"Centre Pompidou - Architecture of the building","visual":{"icon":"⚙","label":"Centre Pompidou","motif":"services"},"imageFile":"Pompidou Centre.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Centre Pompidou · exposed services"},{"id":10,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"Which proposal best represents responsible adaptive reuse of a historic building?","answers":["Introduce a compatible new use after studying heritage significance, fabric, setting and capacity for change","Remove every later layer so the building appears completely new","Keep only a copied facade and replace the entire building behind it without assessment"],"correctIndex":0,"explanation":"Responsible adaptive reuse begins by understanding the existing building and its significance, then finding a viable use while minimizing unnecessary loss of important fabric and character.","source":"Historic England - Constructive Conservation","visual":{"icon":"↻","label":"Adaptive Reuse","motif":"reuse"},"imageFile":"Tate Modern (7327476710).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Tate Modern · adapted power station"},{"id":11,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"In a traditional Lanna house, what is the Kalae?","answers":["A brick foundation below the kitchen","A carved wooden element extending from the top of the gable","A water jar placed below the stairs"],"correctIndex":1,"explanation":"Kalae refers to carved wooden pieces extending from the upper ends of the gables and is one of the most recognizable features of traditional Lanna domestic architecture.","source":"CMU Lanna Traditional House Museum","visual":{"icon":"⌃","label":"Kalae Gable","motif":"gable"},"imageFile":"Ka lae 2.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Kalae · carved gable finials"},{"id":12,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which combination best explains the environmental logic of many traditional Lanna wooden houses?","answers":["Flat roofs, sealed rooms and underground sleeping spaces","Solid stone walls with very small roof overhangs","Raised floors, shaded transitional spaces and openings that support ventilation"],"correctIndex":2,"explanation":"Raised floors, verandas, terraces, roof overhangs and openings help respond to rain, heat, air movement and changing domestic activities.","source":"CMU Lanna Traditional House Museum house descriptions","visual":{"icon":"☀","label":"Climate Response","motif":"climate"},"imageFile":"Traditional wooden house in Chiang Mai city.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Raised timber house · shade, airflow and rain protection"},{"id":13,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"What is the main spatial role of verandas and terraces in many Lanna houses?","answers":["They connect rooms and support semi-outdoor social and domestic activities","They are used only to store roof tiles","They isolate every room from the rest of the household"],"correctIndex":0,"explanation":"Verandas and terraces work as connectors and adaptable living areas between enclosed rooms and the outdoor environment.","source":"CMU Lanna Traditional House Museum - house descriptions","visual":{"icon":"▱","label":"Veranda & Terrace","motif":"terrace"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum6.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/6/","imageOverlay":"Veranda + terrace · transition between inside and outside"},{"id":14,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"What is a Long-Khao in Lanna vernacular architecture?","answers":["A monk’s sleeping cell","A rice granary","A city gate tower"],"correctIndex":1,"explanation":"A Long-Khao is a raised rice-storage building designed to protect an important household resource.","source":"CMU Lanna Traditional House Museum - Long-Khao collection","visual":{"icon":"▣","label":"Lanna Rice Granary","motif":"granary"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum9.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/9/","imageOverlay":"Long-Khao · Lanna rice granary"},{"id":15,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which evidence combination is strongest for studying how a Lanna house has adapted to present-day use?","answers":["One attractive exterior photograph only","A list of construction dates without visiting the site","Measured drawings, repeated observation and interviews with users or caretakers"],"correctIndex":2,"explanation":"Measured drawings document spatial change, observation reveals actual use, and interviews explain decisions and meanings that are not visible in plans alone.","source":"Architectural case-study and post-occupancy research logic","visual":{"icon":"⌖","label":"Field Research","motif":"mapping"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum2.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/2/","imageOverlay":"Measure · observe · interview · compare documents"},{"id":16,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Challenge","question":"Why should a researcher avoid treating every visible part of a historic Lanna temple as belonging to one original period?","answers":["Many temples are living heritage sites with repairs, additions and transformations from different periods","Temples are completely rebuilt every year","Historic temples contain no physical evidence that can be studied"],"correctIndex":0,"explanation":"Many Lanna temples remain active and have been repaired or altered repeatedly. Research should identify historical layers rather than assume a single unchanged original state.","source":"UNESCO Chiang Mai Tentative List - living heritage and restoration layers","visual":{"icon":"⧉","label":"Layered Heritage","motif":"layers"},"imageFile":"Wat Phra Singh, Chiang Mai.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Living heritage contains additions, repairs and reconstructions"},{"id":17,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Who founded Chiang Mai in 1296 as the capital of the Lanna Kingdom?","answers":["King Narai","King Mangrai","King Rama V"],"correctIndex":1,"explanation":"King Mangrai founded Chiang Mai in 1296 as the political, cultural and spiritual centre of the Lanna Kingdom.","source":"UNESCO Chiang Mai Tentative List","visual":{"icon":"♛","label":"King Mangrai","motif":"city"},"imageFile":"Three Kings Monument, Chiang Mai (I).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"King Mangrai at the centre of the Three Kings Monument"},{"id":18,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which Chiang Mai temple is best known for its massive, partly ruined central chedi?","answers":["Wat Arun","Wat Benchamabophit","Wat Chedi Luang"],"correctIndex":2,"explanation":"Wat Chedi Luang is recognized for its monumental chedi, which remains a major landmark in Chiang Mai’s old city despite historical damage and restoration.","source":"UNESCO Chiang Mai Tentative List and Chiang Mai heritage records","visual":{"icon":"▲","label":"Wat Chedi Luang","motif":"chedi"},"imageFile":"Wat Chedi Luang, Chiang Mai (48108378837).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Wat Chedi Luang · monumental ruined chedi"},{"id":19,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Tha Phae Gate is located on which side of Chiang Mai’s old city?","answers":["The eastern side","The western side","The southern side"],"correctIndex":0,"explanation":"Tha Phae Gate is the best-known eastern gateway of the old city and historically connected the walled city with commercial areas toward the Ping River.","source":"Chiang Mai municipal and heritage information","visual":{"icon":"▥","label":"Tha Phae Gate","motif":"gate"},"imageFile":"Tha Phae Gate on the old city walls (14737657804).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Tha Phae Gate · eastern side of the old city"},{"id":20,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which CMU museum preserves and presents relocated traditional Lanna houses and rice granaries?","answers":["Bangkok National Museum","The Lanna Traditional House Museum at CMU","The Museum of Contemporary Art Bangkok"],"correctIndex":1,"explanation":"The Lanna Traditional House Museum at Chiang Mai University preserves several relocated house types, rice granaries and related construction knowledge.","source":"CMU Center for the Promotion of Arts and Culture","visual":{"icon":"⌂","label":"Lanna House Museum","motif":"houses"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum6.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum","imageOverlay":"The Lanna Traditional House Museum, CMU"},{"id":21,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"In which year did architectural education at what became ARCH CMU begin?","answers":["1985","2005","1995"],"correctIndex":2,"explanation":"Architectural education at CMU began in June 1995, initially as a department within the Faculty of Fine Arts.","source":"Chiang Mai University - Faculty of Architecture history","visual":{"icon":"1995","label":"ARCH CMU Begins","motif":"timeline"},"imageFile":"Architecture Faculty building Chiang Mai University.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Faculty of Architecture · Chiang Mai University"},{"id":22,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"How does the ARCH CMU PhD program describe its two broad research directions?","answers":["Tradition and Innovation","Drawing and Model Making","Housing and Highway Engineering only"],"correctIndex":0,"explanation":"The program describes two overlapping research directions: Tradition, using documentary and field-based inquiry, and Innovation, exploring technological advancement in planning and design.","source":"ARCH CMU PhD Program official page","visual":{"icon":"T+I","label":"Tradition + Innovation","motif":"research"},"imageFile":"Architecture Faculty building Chiang Mai University.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"ARCH CMU PhD · architecture research and design knowledge"},{"id":23,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"Beyond playful water splashing, what does water traditionally symbolize during Songkran?","answers":["The end of the rainy season","Cleansing, reverence and good fortune for the new year","A competition to identify the strongest village"],"correctIndex":1,"explanation":"Songkran water practices express cleansing, respect, blessing and good fortune, together with family reunion and honouring elders and sacred images.","source":"UNESCO Intangible Cultural Heritage - Songkran in Thailand","visual":{"icon":"💧","label":"Songkran Meaning","motif":"water"},"imageFile":"Pre-Songkran Festival 1, Tak, Thailand.JPG","imageCredit":"Wikimedia Commons","imageOverlay":"Songkran · cleansing, renewal and respect"},{"id":24,"section":"Thai Culture: Fun & Useful","difficulty":"Medium","question":"Which statement best distinguishes Chiang Mai’s Yi Peng tradition from the nationwide Loi Krathong celebration?","answers":["Yi Peng is mainly a daytime water-fighting festival","Yi Peng is a masked court dance performed only inside palaces","Yi Peng emphasizes Lanna lanterns, while Loi Krathong centres on floating decorated vessels on water"],"correctIndex":2,"explanation":"Yi Peng is a northern Lanna lantern tradition celebrated alongside Loi Krathong. Loi Krathong is best known for floating decorated krathongs on water.","source":"Tourism Authority of Thailand - Yi Peng and Loi Krathong guidance","visual":{"icon":"🏮","label":"Yi Peng & Loi Krathong","motif":"lantern"},"imageFile":"Yi peng sky lantern festival San Sai Thailand.jpg","imageFile2":"Loi Krathong 2010 John Shedrick.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Yi Peng · lanterns in the sky","imageOverlay2":"Loi Krathong · offerings floated on water"},{"id":25,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"What should visitors normally do before entering an ubosot or viharn at a Thai temple?","answers":["Remove their shoes","Put on a hat","Point toward the Buddha image with one foot"],"correctIndex":0,"explanation":"Shoes are normally removed before entering principal temple buildings, and visitors should behave quietly and respectfully.","source":"Thailand.go.th - Thai Temple Travel Guide","visual":{"icon":"👣","label":"Temple Etiquette","motif":"temple"},"imageFile":"No shoes sign - Wat Hiranyawat - Chiang Rai - 2017-01-02 - 002.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Remove shoes before entering sacred interior spaces"},{"id":26,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"What is Scopus?","answers":["A single international architecture journal","An abstract and citation database covering scholarly literature","A ranking issued only for Thai universities"],"correctIndex":1,"explanation":"Scopus is a multidisciplinary abstract and citation database. A journal may be indexed in Scopus, but Scopus itself is not a journal.","source":"Elsevier - Scopus official product page","visual":{"icon":"S","label":"Scopus","motif":"database"},"visualType":"database","hideVisualUntilReveal":true},{"id":27,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"Which statement about Q1, Q2, Q3 and Q4 journal quartiles is the most accurate?","answers":["Q4 is always the highest quartile","A journal keeps the same quartile forever in every category","Q1 is the highest quartile, but the result can vary by year, subject category and metric system"],"correctIndex":2,"explanation":"Quartiles are relative rankings within subject categories. The database or metric, category and year should be stated when describing a journal as Q1-Q4.","source":"Elsevier - CiteScore journal metric guidance","visual":{"icon":"Q1","label":"Journal Quartiles","motif":"quartile"},"visualType":"quartiles","hideVisualUntilReveal":true},{"id":28,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"According to the ARCH CMU PhD curriculum document, what is the credit structure for Type 2.1 students who enter with a master’s degree?","answers":["12 coursework credits plus a 36-credit dissertation, for 48 credits in total","No coursework and a 72-credit dissertation","24 coursework credits plus a 48-credit dissertation, for 72 credits in total"],"correctIndex":0,"explanation":"The curriculum document currently linked by ARCH CMU lists Type 2.1 as 12 coursework credits and a 36-credit dissertation, totaling 48 credits.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - Type 2.1","visual":{"icon":"48","label":"Type 2.1 Credits","motif":"credits"},"visualType":"credits","hideVisualUntilReveal":true},{"id":29,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"For ARCH CMU PhD Type 2.1, which publication combination is stated in the curriculum document?","answers":["One local magazine article with no relation to the dissertation","At least one dissertation-based international journal article accepted or published in a listed database, with the student as first author, plus at least one accepted international conference presentation","Three newspaper interviews and one design competition entry"],"correctIndex":1,"explanation":"The Type 2.1 curriculum states at least one dissertation-based international journal article accepted or published in a listed database, with the student as first author, and at least one dissertation-based international conference presentation accepted by the field.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - Type 2.1 academic activities","visual":{"icon":"✎","label":"Publication Path","motif":"publish"},"visualType":"publication","hideVisualUntilReveal":true},{"id":30,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Challenge","question":"According to the ARCH CMU PhD curriculum, when must a doctoral student complete the qualifying examination?","answers":["Only after the final dissertation defence","Only after every journal article has been published","Before presenting the dissertation proposal; one re-examination is allowed within the following regular semester if the first attempt is unsuccessful"],"correctIndex":2,"explanation":"The curriculum requires the qualifying examination before the dissertation proposal. It also states that an unsuccessful student may take one re-examination within the following regular semester.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - qualifying examination","visual":{"icon":"QE","label":"Qualifying Exam","motif":"milestone"},"visualType":"timeline","hideVisualUntilReveal":true}];

/* Built-in MQTT-over-WebSocket client.
   This removes the external CDN dependency that previously left the lobby
   stuck on “Loading live-room connection…”. */
(function installBuiltInMQTT(){
  if(window.mqtt&&window.mqtt.connect)return;
  const TE=new TextEncoder(),TD=new TextDecoder();
  const bytes=x=>x instanceof Uint8Array?x:TE.encode(String(x));
  const concat=(...parts)=>{const n=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(n);let k=0;for(const b of parts){o.set(b,k);k+=b.length}return o};
  const str=s=>{const b=TE.encode(String(s));return concat(new Uint8Array([b.length>>8,b.length&255]),b)};
  const remain=n=>{const a=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d)}while(n>0);return new Uint8Array(a)};
  const packet=(head,body)=>concat(new Uint8Array([head]),remain(body.length),body);
  class Emitter{
    constructor(){this.h={}}
    on(t,f){(this.h[t]||(this.h[t]=[])).push(f);return this}
    once(t,f){const w=(...a)=>{this.off(t,w);f(...a)};return this.on(t,w)}
    off(t,f){if(this.h[t])this.h[t]=this.h[t].filter(x=>x!==f);return this}
    emit(t,...a){for(const f of [...(this.h[t]||[])]){try{f(...a)}catch(e){console.error(e)}}return this}
    removeAllListeners(t){if(t)delete this.h[t];else this.h={};return this}
  }
  class MiniMQTT extends Emitter{
    constructor(url,opt={}){super();this.url=url;this.opt=opt;this.ws=null;this.connected=false;this.ended=false;this.pid=1;this.ping=null;this.retry=null;setTimeout(()=>this.open(),0)}
    open(){
      if(this.ended)return;
      try{
        const ws=new WebSocket(this.url,['mqtt']);this.ws=ws;ws.binaryType='arraybuffer';
        ws.onopen=()=>{const vh=concat(str('MQTT'),new Uint8Array([4,2,(this.opt.keepalive||30)>>8,(this.opt.keepalive||30)&255]));const pl=str(this.opt.clientId||('archcmu_'+Math.random().toString(36).slice(2)));ws.send(packet(0x10,concat(vh,pl)))};
        ws.onmessage=e=>this.parse(new Uint8Array(e.data));
        ws.onerror=e=>this.emit('error',e instanceof Error?e:new Error('WebSocket error'));
        ws.onclose=()=>{const was=this.connected;this.connected=false;clearInterval(this.ping);this.emit('close');if(!this.ended&&(this.opt.reconnectPeriod||0)>0){this.emit('reconnect');clearTimeout(this.retry);this.retry=setTimeout(()=>this.open(),this.opt.reconnectPeriod)}};
      }catch(e){this.emit('error',e);if(!this.ended&&(this.opt.reconnectPeriod||0)>0){this.emit('reconnect');this.retry=setTimeout(()=>this.open(),this.opt.reconnectPeriod)}}
    }
    parse(a){
      let i=0;
      while(i<a.length){const head=a[i++];let mul=1,len=0,d=0;do{if(i>=a.length)return;d=a[i++];len+=(d&127)*mul;mul*=128}while(d&128);if(i+len>a.length)return;const b=a.subarray(i,i+len);i+=len;const type=head>>4;
        if(type===2){if(b.length>=2&&b[1]===0){this.connected=true;this.emit('connect',{sessionPresent:!!b[0]});clearInterval(this.ping);this.ping=setInterval(()=>{if(this.connected&&this.ws?.readyState===1)this.ws.send(new Uint8Array([0xc0,0]))},Math.max(10000,(this.opt.keepalive||30)*500))}else this.emit('error',new Error('MQTT connection refused'))}
        else if(type===3){if(b.length<2)continue;const tl=(b[0]<<8)|b[1];if(2+tl>b.length)continue;const topic=TD.decode(b.subarray(2,2+tl));let off=2+tl;const qos=(head>>1)&3;if(qos>0)off+=2;const text=TD.decode(b.subarray(off));this.emit('message',topic,{toString:()=>text})}
      }
    }
    subscribe(topic,opt={},cb){if(!this.connected)return cb?.(new Error('Not connected'));const id=(this.pid++&65535)||1;const body=concat(new Uint8Array([id>>8,id&255]),str(topic),new Uint8Array([opt.qos||0]));this.ws.send(packet(0x82,body));cb?.(null,[{topic,qos:opt.qos||0}]);return this}
    publish(topic,payload,opt={},cb){if(!this.connected)return cb?.(new Error('Not connected'));const body=concat(str(topic),bytes(payload));this.ws.send(packet(0x30|(opt.retain?1:0),body));cb?.();return this}
    end(force=false,cb){this.ended=true;this.connected=false;clearInterval(this.ping);clearTimeout(this.retry);try{if(this.ws?.readyState===1&&!force)this.ws.send(new Uint8Array([0xe0,0]));this.ws?.close()}catch{}cb?.();return this}
  }
  window.mqtt={connect:(url,opt)=>new MiniMQTT(url,opt)};
})();

function ensureAudio(){
 if(!soundOn)return null;
 try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}
}
function tone(freq,dur=.12,delay=0,type='sine',volume=.055){
 const c=ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03)
}
function playSound(name){
 if(!soundOn)return;
 if(name==='click'||name==='lock'){tone(620,.07,0,'triangle',.04);tone(880,.06,.055,'triangle',.035)}
 else if(name==='preview'){tone(392,.10,0,'sine',.035);tone(523,.16,.10,'sine',.045)}
 else if(name==='start'){tone(523,.10,0,'triangle',.045);tone(784,.16,.09,'triangle',.055)}
 else if(name==='tick'){tone(760,.055,0,'square',.022)}
 else if(name==='lastTick'){tone(980,.09,0,'square',.035)}
 else if(name==='reveal'){tone(523,.11,0,'triangle',.05);tone(659,.11,.08,'triangle',.055);tone(784,.2,.16,'triangle',.06)}
 else if(name==='correct'){tone(523,.1,0,'sine',.045);tone(659,.1,.08,'sine',.05);tone(988,.2,.16,'sine',.055)}
 else if(name==='wrong'){tone(392,.14,0,'sine',.04);tone(294,.22,.12,'sine',.04)}
 else if(name==='board'){[523,659,784,1047].forEach((f,i)=>tone(f,.15,i*.08,'triangle',.05))}
 else if(name==='section'){[392,523,659].forEach((f,i)=>tone(f,.18,i*.11,'sine',.045))}
 else if(name==='final'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.5:.18,i*.11,'triangle',.065))}
}

function incomingSound(prev,next){
 if(!next)return;const key=`${next.phase}:${next.questionIndex}:${next.sectionIndex}`;if(key===lastIncomingSoundKey)return;lastIncomingSoundKey=key;

 else if(next.phase==='leaderboard')playSound('board');
}

function loadExternalScript(){return Promise.resolve()}
async function ensureMQTT(){if(window.mqtt&&window.mqtt.connect)return;throw new Error('Built-in live-room engine is unavailable. Please refresh the page.')}
async function connectMQTT(){
 await ensureMQTT();
 connected=false;brokerLabel='Connecting to the fastest live server…';render();
 const attempts=[];let settled=false,failures=0;
 await new Promise((resolve,reject)=>{
   BROKERS.forEach((url,index)=>{
     const c=window.mqtt.connect(url,{clientId:`archcmu_${role}_${randomId(12)}`,clean:true,reconnectPeriod:0,connectTimeout:7000,keepalive:25});
     const item={c,url,t:null,failed:false};attempts.push(item);
     const fail=()=>{if(settled||item.failed)return;item.failed=true;clearTimeout(item.t);try{c.end(true)}catch{};failures++;if(failures>=BROKERS.length){settled=true;reject(new Error('No live server is reachable on this network. Try a mobile hotspot, then press Retry live connection.'))}};
     item.t=setTimeout(fail,8500);
     c.once('connect',()=>{if(settled){try{c.end(true)}catch{};return}settled=true;clearTimeout(item.t);c.opt.reconnectPeriod=1400;client=c;brokerLabel='Live room connected';connected=true;for(const other of attempts){if(other.c!==c){clearTimeout(other.t);try{other.c.end(true)}catch{}}}resolve()});
     c.once('error',fail);
   });
 });
 client.on('close',()=>{connected=false;brokerLabel='Connection interrupted — reconnecting…';render()});
 client.on('reconnect',()=>{connected=false;brokerLabel='Reconnecting to the live room…';render()});
 client.on('connect',()=>{connected=true;brokerLabel='Live room connected';subscribeAndAnnounce();render()});
 subscribeAndAnnounce();
}
function subscribeAndAnnounce(){
 if(!client||!connected)return;
 client.removeAllListeners('message');
 if(role==='host'){
   client.subscribe(topic('events'),{qos:0});
   client.on('message',onHostMessage);
   publishState();
 }else{
   client.subscribe(topic('state'),{qos:0});
   client.subscribe(noticeTopic(pid),{qos:0});
   client.on('message',onPlayerMessage);
   publishEvent({type:'join',pid,name:displayName,avatar});
 }
}
function publishEvent(obj){if(client&&connected)client.publish(topic('events'),JSON.stringify({...obj,ts:Date.now()}),{qos:0})}
function publishState(){
 if(!client||!connected||role!=='host'||!state)return;
 state.serverNow=Date.now();
 client.publish(topic('state'),JSON.stringify(state),{qos:0,retain:true});
 localStorage.setItem('vq_host_'+room,JSON.stringify(state));
 localStorage.setItem('vq_answers_'+room,JSON.stringify(hostAnswers));
}
function onHostMessage(t,payload){
 if(t!==topic('events'))return;let m;try{m=JSON.parse(payload.toString())}catch{return}
 if(m.type==='join'&&m.pid&&m.name){
   const isNew=!state.players[m.pid];
   if(isNew&&Object.keys(state.players).length>=MAX_PLAYERS){
     if(client&&connected)client.publish(noticeTopic(m.pid),JSON.stringify({type:'room_full',max:MAX_PLAYERS,ts:Date.now()}),{qos:0});
     return;
   }
   const old=state.players[m.pid]||{};
   const baseName=String(m.name).slice(0,24),used=new Set(Object.values(state.players).filter(p=>p.id!==m.pid).map(p=>p.name));
   let finalName=old.name||baseName;if(!old.name&&used.has(finalName)){let n=2;while(used.has(baseName+' '+n))n++;finalName=baseName+' '+n}
   state.players[m.pid]={id:m.pid,name:finalName,avatar:m.avatar||'🙂',score:old.score||0,correct:old.correct||0,answered:old.answered||0,lastSeen:Date.now()};
   publishState();render();
 }
 if(m.type==='ping'&&state.players[m.pid])state.players[m.pid].lastSeen=Date.now();
 if(m.type==='answer')acceptAnswer(m);
}
function onPlayerMessage(t,payload){
 if(t===noticeTopic(pid)){
   try{const note=JSON.parse(payload.toString());if(note.type==='room_full'){joinError=`Room full — maximum ${note.max||MAX_PLAYERS} participants.`;displayName='';sessionStorage.removeItem('vq_name');sessionStorage.removeItem('vq_avatar');renderJoinForm(joinError)}}catch{}
   return;
 }
 if(t!==topic('state'))return;try{const incoming=JSON.parse(payload.toString());if(incoming.room!==room)return;const previous=state;if(incoming.phase==='lobby'){lastSubmitted={};sessionStorage.removeItem('vq_lastSubmitted')}state=incoming;connected=true;incomingSound(previous,incoming);render()}catch{}
}
function acceptAnswer(m){
 if(!state||state.phase!=='question'||m.questionIndex!==state.questionIndex||!state.players[m.pid])return;
 const qi=state.questionIndex;hostAnswers[qi]=hostAnswers[qi]||{};if(hostAnswers[qi][m.pid])return;
 const q=Q[qi],choice=Number(m.choice);const elapsed=Math.max(0,Date.now()-state.questionStartedAt);const remaining=Math.max(0,1-elapsed/(ANSWER_SECONDS*1000));const correct=choice===q.correctIndex;const points=correct?700+Math.round(300*remaining):0;
 hostAnswers[qi][m.pid]={choice,correct,points,elapsed};
 const pl=state.players[m.pid];pl.score+=points;pl.correct+=correct?1:0;pl.answered+=1;pl.lastSeen=Date.now();state.answerCount=Object.keys(hostAnswers[qi]).length;
 publishState();render();
}

function newHostState(){return {version:16,room,createdAt:Date.now(),phase:'lobby',phaseEndsAt:0,questionIndex:-1,questionStartedAt:0,sectionIndex:0,answerCount:0,players:{},rankBeforeQuestion:{},lastGains:{}}}
function startQuiz(){if(!state||Object.keys(state.players).length===0)return;ensureAudio();hostAnswers={};for(const p of Object.values(state.players)){p.score=0;p.correct=0;p.answered=0}state.questionIndex=-1;state.lastGains={};enterSection(0)}
function enterSection(si){state.sectionIndex=si;state.phase='section';state.phaseEndsAt=Date.now()+INTRO_SECONDS*1000;state.answerCount=0;state.lastGains={};publishState();render();playSound('section')}
function startQuestion(qi){state.questionIndex=qi;state.sectionIndex=sectionIndexForQuestion(qi);state.rankBeforeQuestion=rankMap();state.lastGains={};state.phase='preview';state.questionStartedAt=0;state.phaseEndsAt=Date.now()+READ_SECONDS*1000;state.answerCount=0;hostAnswers[qi]={};lastTickMark='';publishState();render();playSound('preview')}
function beginAnswering(){if(!state||state.phase!=='preview')return;state.phase='question';state.questionStartedAt=Date.now();state.phaseEndsAt=Date.now()+ANSWER_SECONDS*1000;state.answerCount=0;lastTickMark='';publishState();render();playSound('start')}
function revealQuestion(){state.phase='reveal';state.phaseEndsAt=Date.now()+REVEAL_SECONDS*1000;state.answerBreakdown=[0,0,0];state.lastGains={};for(const [playerId,a] of Object.entries(hostAnswers[state.questionIndex]||{})){state.answerBreakdown[a.choice]=(state.answerBreakdown[a.choice]||0)+1;state.lastGains[playerId]=a.points||0}publishState();render();playSound('reveal')}
function enterLeaderboard(){state.phase='leaderboard';state.phaseEndsAt=Date.now()+BOARD_SECONDS*1000;publishState();render();playSound('board')}
function enterFinal(){state.phase='final';state.phaseEndsAt=0;publishState();render()}
function nextAfterReveal(){
 const done=state.questionIndex+1;
 if(done>=Q.length){enterFinal();return}
 if(done%10===0){enterLeaderboard();return}
 const next=state.questionIndex+1;
 const nextSection=sectionIndexForQuestion(next);
 if(nextSection!==state.sectionIndex)enterSection(nextSection);else startQuestion(next)
}
function nextAfterLeaderboard(){
 const next=state.questionIndex+1;if(next>=Q.length){enterFinal();return}
 const nextSection=sectionIndexForQuestion(next);if(nextSection!==state.sectionIndex)enterSection(nextSection);else startQuestion(next)
}
function hostTick(){if(role!=='host'||!state)return;const now=Date.now();if(!state.phaseEndsAt||now<state.phaseEndsAt)return;if(state.phase==='section')startQuestion(state.questionIndex+1);else if(state.phase==='preview')beginAnswering();else if(state.phase==='question')revealQuestion();else if(state.phase==='reveal')nextAfterReveal();else if(state.phase==='leaderboard')nextAfterLeaderboard()}
function resetQuiz(){if(!confirm('Reset the room and return to the lobby?'))return;state=newHostState();hostAnswers={};publishState();render()}
function skipNow(){if(!state)return;if(state.phase==='section')startQuestion(state.questionIndex+1);else if(state.phase==='preview')beginAnswering();else if(state.phase==='question')revealQuestion();else if(state.phase==='reveal')nextAfterReveal();else if(state.phase==='leaderboard')nextAfterLeaderboard()}
window.vqStart=startQuiz;window.vqReset=resetQuiz;window.vqSkip=skipNow;

function render(){
 if(role==='home')return renderHome();
 if(role==='host')return renderHost();
 return renderPlayer();
}
function renderHost(){
 if(!state)return;
 if(state.phase==='lobby')return renderHostLobby();
 if(state.phase==='section')return renderSection(true);
 if(state.phase==='preview'||state.phase==='question'||state.phase==='reveal')return renderQuestion(true);
 if(state.phase==='leaderboard')return renderLeaderboard(false,true);
 if(state.phase==='final')return renderFinal(true)
}
function renderHostLobby(){
 const players=sortedPlayers();
 app.innerHTML=shell(`<div class="hostGrid"><section class="panel"><div class="eyebrow">Host lobby</div><h2>Welcome to the Vibe Quiz</h2><p class="lead">Ask everyone to scan the QR code and tap an avatar with an automatic English name. This room supports up to 30 participants.</p>${!connected?`<div class="offlineBanner">${brokerLabel?esc(brokerLabel):'Connecting to the live room…'}<small style="display:block;margin-top:5px">The page now uses a built-in connection engine. If campus Wi-Fi blocks live sockets, switch the host computer to a phone hotspot.</small></div>`:''}<div class="metrics"><div class="metric"><b>${players.length}/${MAX_PLAYERS}</b><span>Participants joined</span></div><div class="metric"><b>30</b><span>Questions</span></div><div class="metric"><b>7+15+9</b><span>Read + answer + ranking</span></div><div class="metric"><b>30</b><span>Maximum participants</span></div></div><h3 style="margin-top:22px">Participants</h3><div class="playerGrid">${players.length?players.map(p=>`<div class="playerCard"><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><small>Ready</small></div></div>`).join(''):`<div class="notice blue">No one has joined yet.</div>`}</div><div class="actions"><button class="btn primary" onclick="vqStart()" ${players.length?'':'disabled'}>Start Round 1</button><button class="btn soft" onclick="location.reload()">Retry live connection</button></div></section><aside class="sidebar"><section class="panel center"><div class="eyebrow">Room code</div><div class="roomCode">${esc(room)}</div><div id="qr" class="qrBox"></div><div class="joinUrl">${esc(joinUrl())}</div></section><section class="panel"><h3>Automatic flow</h3><div class="notice">Section intro → 7-second host reading → 15-second answer window → 9-second correct answer, explanation and full live ranking. Extended checkpoint boards appear after Questions 10 and 20; Question 30 leads to the final celebration.</div></section></aside></div>`);
 drawQR();
}
function drawQR(){
 const el=document.getElementById('qr');if(!el)return;
 const url=joinUrl();
 const img=document.createElement('img');img.className='qrImage';img.alt='Scan to join room '+room;img.decoding='async';
 if(room===DEFAULT_ROOM){img.src=DEFAULT_JOIN_QR;el.replaceChildren(img);return}
 const primary='https://quickchart.io/qr?size=300&margin=1&ecLevel=M&dark=0a376f&light=ffffff&text='+encodeURIComponent(url);
 const backup='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&color=0-55-111&bgcolor=255-255-255&data='+encodeURIComponent(url);
 let triedBackup=false;img.onerror=()=>{if(!triedBackup){triedBackup=true;img.src=backup}else{el.innerHTML='<div class="notice blue"><b>Open the join link on a phone:</b><br>'+esc(url)+'</div>'}};

function renderSection(isHost){
 const s=SECTIONS[state.sectionIndex]||SECTIONS[0];const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 app.innerHTML=shell(`<section class="panel sectionIntro" style="--section-accent:${s.accent}"><div class="sectionCopy"><div class="sectionNumber">Round ${state.sectionIndex+1} of ${SECTIONS.length} · ${esc(s.range)}</div><h1 style="font-size:clamp(42px,6vw,72px)">${esc(s.name)}</h1><p class="lead">${esc(s.intro)}</p><div class="countdownPill"><span class="pulseDot"></span>Starting in <b data-countdown>${remain}</b> seconds</div>${isHost?`<div class="actions"><button class="btn soft" onclick="vqSkip()">Start now</button><button class="btn danger" onclick="vqReset()">Reset room</button></div>`:''}</div><div class="sectionVisual"><div class="sectionIcon">${esc(s.icon)}</div></div></section>`)
}
function questionAccent(si){return (SECTIONS[si]||SECTIONS[0]).accent}
function currentRank(pidValue){const ps=sortedPlayers();const i=ps.findIndex(p=>p.id===pidValue);return i<0?null:i+1}
function miniRanking(limit=6){const ps=sortedPlayers().slice(0,limit);return `<div class="rankMini">${ps.map((p,i)=>`<div class="rankMiniRow"><div class="rank">#${i+1}</div><div class="avatar">${esc(p.avatar)}</div><b>${esc(p.name)}</b><div class="score">${p.score}</div></div>`).join('')||'<div class="notice blue">No scores yet.</div>'}</div>`}
function renderReveal(isHost,q){
 const selected=lastSubmitted[state.questionIndex];const my=state.players&&state.players[pid];const ok=selected!==undefined&&selected===q.correctIndex;const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 const personal=!isHost&&my?`<div class="personalResult ${ok?'':'bad'}"><div><small>${selected===undefined?'No answer submitted':ok?'Your answer was correct':'Your answer was not correct'}</small><strong>${selected===undefined?'Keep going — the next question is a fresh start.':ok?'Excellent work!':'Correct answer: '+String.fromCharCode(65+q.correctIndex)}</strong></div><b>#${currentRank(pid)||'—'}</b></div>`:'';
 app.innerHTML=shell(`<div class="revealLayout"><section class="panel revealAnswer">${questionVisual(q)}<div class="revealBody"><div class="correctPill">✓ Correct answer · Question ${q.id}</div><div class="revealQuestionText">${esc(q.question)}</div><div class="correctAnswer">${String.fromCharCode(65+q.correctIndex)} · ${esc(q.answers[q.correctIndex])}</div><p class="revealExplanation">${esc(q.explanation)}</p>${q.source?`<div class="source">Verification basis: ${esc(q.source)}</div>`:''}${personal}${isHost?`<div class="actions"><button class="btn soft" onclick="vqSkip()">Continue now</button><button class="btn danger" onclick="vqReset()">Reset</button></div>`:''}</div></section><section class="panel revealBoard"><div class="revealBoardHead"><div><div class="eyebrow">Complete live ranking</div><h2>After Question ${q.id}</h2></div><div class="countdownPill"><span>Next screen in</span><b data-countdown>${remain}</b></div></div><div class="revealRankGrid">${fullRevealRanking(isHost?'':pid)}</div></section></div>`)
}
function renderQuestion(isHost){
 const q=Q[state.questionIndex];if(!q)return;if(state.phase==='reveal')return renderReveal(isHost,q);
 const revealOnlyVisual=q.hideVisualUntilReveal===true;
 const isPreview=state.phase==='preview';
 const phaseSeconds=isPreview?READ_SECONDS:ANSWER_SECONDS;
 const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 const selected=lastSubmitted[state.questionIndex];const my=state.players&&state.players[pid];
 let options='';
 if(isPreview){
   options=`<div class="answerGate"><div class="gateIcon">🔒</div><div><b>Answer choices open after the host finishes reading.</b><small>${revealOnlyVisual?'No image or answer graphic is shown until voting closes.':'Use these 7 seconds to focus on the question and image.'}</small></div></div>`;
 }else{
   options=q.answers.map((a,i)=>{let cls='option';if(selected===i)cls+=' selected';return `<button class="${cls}" ${isHost||selected!==undefined?'disabled':''} onclick="window.vqAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`}).join('');
 }
 let side='';
 if(isHost){
   if(isPreview){
     side=`<section class="panel timerCard previewTimer"><div class="eyebrow">Host reading · Question ${q.id} of ${Q.length}</div><div class="phaseBadge">READ THE QUESTION</div><div class="timer">${remain}</div><div class="progress previewProgress"><div style="width:${Math.max(0,remain/READ_SECONDS*100)}%"></div></div><div class="notice blue" style="margin-top:14px"><b>Read the question aloud.</b><br>Answer choices will open automatically when the timer reaches zero.</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="vqSkip()">Open answers now</button><button class="btn danger" onclick="vqReset()">Reset</button></div></section>`;
   }else{
     side=`<section class="panel timerCard"><div class="eyebrow">Answering · Question ${q.id} of ${Q.length}</div><div class="phaseBadge answer">ANSWER NOW</div><div class="timer ${remain<=5?'urgent':''}">${remain}</div><div class="progress"><div style="width:${Math.max(0,remain/ANSWER_SECONDS*100)}%"></div></div><p style="margin:12px 0 3px;color:var(--muted)">Answers received</p><div class="answerCount">${state.answerCount||0}</div><small>of ${Object.keys(state.players||{}).length} players</small><div class="actions" style="justify-content:center"><button class="btn soft" onclick="vqSkip()">End answering now</button><button class="btn danger" onclick="vqReset()">Reset</button></div></section><section class="panel"><h3>Live participants</h3><div class="playerGrid">${sortedPlayers().map(p=>`<div class="playerCard"><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><small>${p.score} pts</small></div></div>`).join('')}</div></section>`;
   }
 }else{
   if(isPreview){
     side=`<section class="panel timerCard previewTimer"><div class="eyebrow">Listen & read · Question ${q.id} of ${Q.length}</div><div class="phaseBadge">HOST READING</div><div class="timer">${remain}</div><div class="progress previewProgress"><div style="width:${Math.max(0,remain/READ_SECONDS*100)}%"></div></div>${my?`<div class="miniMe"><div class="avatar">${esc(my.avatar)}</div><div><b>${esc(my.name)}</b><small>Answers are locked</small></div><div class="ownScore">${my.score} pts</div></div>`:''}<div class="waitingAnswer"><b>Listen to the host.</b><br>The 15-second answer timer starts automatically next.</div></section>`;
   }else{
     side=`<section class="panel timerCard"><div class="eyebrow">Answer now · Question ${q.id} of ${Q.length}</div><div class="phaseBadge answer">15-SECOND ANSWER WINDOW</div><div class="timer ${remain<=5?'urgent':''}">${remain}</div><div class="progress"><div style="width:${Math.max(0,remain/ANSWER_SECONDS*100)}%"></div></div>${my?`<div class="miniMe"><div class="avatar">${esc(my.avatar)}</div><div><b>${esc(my.name)}</b><small>${selected===undefined?'Choose one answer':'Answer locked'}</small></div><div class="ownScore">${my.score} pts</div></div>`:''}${selected===undefined?`<div class="waitingAnswer">Select your answer before the timer reaches zero.</div>`:`<div class="notice blue">Answer submitted. The full ranking will appear when time is up.</div>`}</section>`;
   }
 }
 app.innerHTML=shell(`<div class="questionLayout"><section class="panel questionCard ${revealOnlyVisual?'academicNoVisual':''}">${revealOnlyVisual?'':questionVisual(q)}<div class="questionBody"><div class="questionMeta"><span class="category">${esc(q.section)}</span><span class="difficulty">${esc(q.difficulty)}</span></div><div class="questionTitle">${esc(q.question)}</div><div class="options ${isPreview?'previewLocked':''}">${options}</div></div></section><aside class="sidebar">${side}</aside></div>`)
}
function resultForPlayer(q,a,selected){if(selected===undefined)return `<div class="resultPanel bad"><h3>No answer submitted</h3><p>The correct answer was ${String.fromCharCode(65+q.correctIndex)}.</p></div>`;const ok=selected===q.correctIndex;return `<div class="resultPanel ${ok?'':'bad'}"><h3>${ok?'Correct!':'Not this time'}</h3><p>${ok?'Your live score has been updated.':`Correct answer: ${String.fromCharCode(65+q.correctIndex)}`}</p></div>`}
window.vqAnswer=i=>{if(role!=='player'||!state||state.phase!=='question'||lastSubmitted[state.questionIndex]!==undefined)return;ensureAudio();playSound('lock');lastSubmitted[state.questionIndex]=i;selectedChoice=i;sessionStorage.setItem('vq_lastSubmitted',JSON.stringify(lastSubmitted));publishEvent({type:'answer',pid,questionIndex:state.questionIndex,choice:i});render()};
function renderLeaderboard(finalBoard=false,isHost=false){
 const ps=sortedPlayers(),max=Math.max(1,...ps.map(p=>p.score));const checkpoint=state.questionIndex+1;const title=checkpoint===10?'Checkpoint 1 · Global History & Design':checkpoint===20?'Checkpoint 2 · Lanna, Chiang Mai & ARCH CMU':'Stage Ranking';const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 app.innerHTML=shell(`<section class="panel leaderWrap"><div class="leaderHead"><div class="eyebrow">Stage checkpoint</div><h2>${title}</h2><p class="lead" style="margin:0 auto">Scores combine accuracy and response speed. The quiz continues automatically in ${remain} seconds.</p></div><div class="leaderboard">${ps.map((p,i)=>`<div class="rankRow"><div class="rank">#${i+1}</div><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><div class="bar"><span style="width:${Math.round(p.score/max*100)}%"></span></div><small>${p.correct} correct</small></div><div class="score">${p.score}</div></div>`).join('')||'<div class="notice blue">No scores yet.</div>'}</div>${isHost&&checkpoint<30?`<div class="actions" style="justify-content:center"><button class="btn soft" onclick="vqSkip()">Continue now</button><button class="btn danger" onclick="vqReset()">Reset</button></div>`:''}</section>`)
}
function celebrateFinalOnce(){const key=room+':'+(state?.createdAt||'');if(finalCelebrationKey===key)return;finalCelebrationKey=key;setTimeout(()=>{confetti();playSound('final')},80)}
function renderFinal(isHost){
 const ps=sortedPlayers(),top=ps.slice(0,3),slots=[top[1],top[0],top[2]];const cls=['second','first','third'],med=['🥈','🥇','🥉'];celebrateFinalOnce();
 app.innerHTML=shell(`<section class="panel leaderWrap"><div class="leaderHead"><div class="celebrationRibbon">🎉 Quiz complete · 30 questions</div><div class="celebrationStars">✦ ✦ ✦</div><h1 class="celebrationTitle">Congratulations!</h1><h2>Final Results</h2><p class="lead" style="margin:0 auto">Thank you for bringing your knowledge, speed and ARCH CMU spirit to all five rounds.</p></div><div class="podium">${slots.map((p,i)=>`<div class="podiumBox ${cls[i]}"><div class="medal">${med[i]}</div>${p?`<div class="avatar big">${esc(p.avatar)}</div><b>${esc(p.name)}</b><span>${p.score} points · ${p.correct} correct</span>`:'<b>—</b>'}</div>`).join('')}</div>${top[0]?`<div class="winnerCallout">🏆 <b>${esc(top[0].name)}</b> finishes in first place with <b>${top[0].score} points</b>. Congratulations to every participant!</div>`:''}<div class="finalStandings"><h3>Complete Final Ranking</h3><div class="leaderboard">${ps.map((p,i)=>`<div class="rankRow"><div class="rank">#${i+1}</div><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><small>${p.correct} correct answers</small></div><div class="score">${p.score} pts</div></div>`).join('')||'<div class="notice blue">No final scores available.</div>'}</div></div><div class="actions" style="justify-content:center;margin-top:24px">${isHost?`<button class="btn primary" onclick="vqReset()">Return to Lobby</button>`:''}<button class="btn soft" onclick="location.href='${baseUrl()}'">Home</button></div></section>`)
}
function renderJoinForm(message=''){
 const chosen=identityForAvatar(selectedAvatar);
 app.innerHTML=shell(`<div class="hero"><section class="panel heroCopy"><div class="eyebrow">Join room ${esc(room)}</div><h2>Tap one avatar to join</h2><p class="lead">Each avatar already has an English name. Choose one identity—no typing is needed. The room accepts up to <b>30 participants</b>.</p>${message?`<div class="offlineBanner">${esc(message)}</div>`:''}<div class="field"><span>Choose your quiz identity</span><div class="avatarGrid">${IDENTITIES.map(i=>`<button class="avatarBtn ${i.avatar===selectedAvatar?'selected':''}" onclick="window.pickAvatar('${i.avatar}')"><span class="avatarEmoji">${i.avatar}</span><span class="avatarName">${esc(i.name)}</span></button>`).join('')}</div></div>${chosen?`<div class="selectedIdentity"><div class="bigChoice">${chosen.avatar}</div><div><b>${esc(chosen.name)}</b><small>This name and avatar will appear on the live ranking.</small></div></div>`:`<div class="notice blue">Choose one avatar to activate the Join button.</div>`}<button class="btn primary block" onclick="window.confirmJoin()" ${chosen?'':'disabled'}>Join as ${chosen?esc(chosen.name):'—'}</button></section><aside class="heroArt"><div class="heroIcon">${esc(selectedAvatar||'✦')}</div><div></div><div class="heroCaption"><strong>${chosen?esc(chosen.name):'Choose an identity'}</strong><span>One tap assigns both your avatar and English name.</span></div></aside></div>`)
}
window.pickAvatar=a=>{const i=identityForAvatar(a);if(!i)return;ensureAudio();playSound('click');selectedAvatar=i.avatar;selectedIdentityName=i.name;renderJoinForm()};
window.confirmJoin=async()=>{ensureAudio();const chosen=identityForAvatar(selectedAvatar);if(!chosen)return renderJoinForm('Please choose one avatar.');displayName=chosen.name;avatar=chosen.avatar;selectedIdentityName=chosen.name;sessionStorage.setItem('vq_name',displayName);sessionStorage.setItem('vq_avatar',avatar);sessionStorage.setItem('vq_identity_version',IDENTITY_VERSION);lastSubmitted=JSON.parse(sessionStorage.getItem('vq_lastSubmitted')||'{}');app.innerHTML=shell(`<section class="panel center"><div class="bigIcon">${esc(avatar)}</div><h2>Joining as ${esc(displayName)}…</h2><p class="lead" style="margin:auto">Keep this page open during the quiz.</p></section>`);try{await connectMQTT();publishEvent({type:'join',pid,name:displayName,avatar});setInterval(()=>publishEvent({type:'ping',pid}),12000)}catch(e){renderJoinForm(e.message)}};
function renderPlayer(){
 if(!displayName)return renderJoinForm();
 if(!state)return app.innerHTML=shell(`<section class="panel center"><h2>Waiting for the host</h2><p class="lead" style="margin:auto">Connected to room <b>${esc(room)}</b>. The lobby will appear when the host is online.</p><div class="avatar big" style="margin:22px auto">${esc(avatar)}</div></section>`);
 if(state.phase==='lobby')return app.innerHTML=shell(`<section class="panel center"><div class="avatar big" style="margin:0 auto 14px">${esc(avatar)}</div><div class="eyebrow">Room ${esc(room)}</div><h2>You are in!</h2><p class="lead" style="margin:0 auto 18px">Welcome, <b>${esc(displayName)}</b>. The host will start the first round soon.</p><div class="notice blue">First, the host has 7 seconds to read each question. Then you have 15 seconds to answer. After every question, the correct answer and the complete live ranking appear immediately. Extended checkpoints follow Questions 10 and 20. This room supports up to 30 participants.</div></section>`);
 if(state.phase==='section')return renderSection(false);
 if(state.phase==='preview'||state.phase==='question'||state.phase==='reveal')return renderQuestion(false);
 if(state.phase==='leaderboard')return renderLeaderboard(false,false);
 if(state.phase==='final')return renderFinal(false)
}
function confetti(){const box=document.createElement('div');box.className='confetti';const colors=['#f2ae1b','#1769aa','#2c8a5a','#c84c4c','#6f4ab1'];for(let i=0;i<90;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'vw';s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*1.4+'s';s.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),5500)}
function updateCountdowns(){
 const el=document.querySelector('[data-countdown]');if(el&&state&&state.phaseEndsAt)el.textContent=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 const t=document.querySelector('.timer');if(t&&state&&(state.phase==='preview'||state.phase==='question')){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));const total=state.phase==='preview'?READ_SECONDS:ANSWER_SECONDS;t.textContent=r;t.classList.toggle('urgent',state.phase==='question'&&r<=5);const p=document.querySelector('.progress>div');if(p)p.style.width=Math.max(0,r/total*100)+'%';if(state.phase==='question'&&r>0&&r<=5){const mark=state.questionIndex+':'+r;if(mark!==lastTickMark){lastTickMark=mark;playSound(r===1?'lastTick':'tick')}}}
 if(state&&state.phase==='leaderboard'){const lead=document.querySelector('.leaderHead .lead');if(lead){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));lead.innerHTML=`Scores combine accuracy and response speed. The quiz continues automatically in ${r} seconds.`}}
}
async function boot(){
 preloadImages();
 if(role==='home')return renderHome();
 if(!room){role='home';return renderHome()}
 if(role==='host'){
   const forceNew=params.get('new')==='1';if(forceNew){localStorage.removeItem('vq_host_'+room);localStorage.removeItem('vq_answers_'+room);history.replaceState({},'',baseUrl()+'?host='+room)}const saved=JSON.parse(localStorage.getItem('vq_host_'+room)||'null');state=!forceNew&&saved&&saved.room===room&&saved.version===16?saved:newHostState();hostAnswers=forceNew?{}:JSON.parse(localStorage.getItem('vq_answers_'+room)||'{}');render();try{await connectMQTT()}catch(e){brokerLabel=e.message;render()}hostTimer=setInterval(hostTick,180);uiTimer=setInterval(updateCountdowns,180)
 }else{
   if(displayName){lastSubmitted=JSON.parse(sessionStorage.getItem('vq_lastSubmitted')||'{}');render();try{await connectMQTT();setInterval(()=>publishEvent({type:'ping',pid}),12000)}catch(e){renderJoinForm(e.message)}}else renderJoinForm();uiTimer=setInterval(updateCountdowns,180)
 }
}
boot();
})();
</script></body></html>
