.timelineGraphic{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center}.timeNode{padding:18px 10px;border-radius:18px;text-align:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}.timeNode b{display:block;font-size:16px}.timeNode.active{background:rgba(242,174,27,.9);color:#17263a}.timeArrow{text-align:center;font-size:25px;font-weight:950}
.revealLayout{display:grid;grid-template-columns:minmax(0,.88fr) minmax(510px,1.12fr);gap:18px;align-items:start}.revealAnswer{padding:0;overflow:hidden}.revealAnswer .questionPhoto,.revealAnswer .academicVisual{min-height:230px;aspect-ratio:16/8.2}.revealBody{padding:21px}.correctPill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#e6f7ed;color:var(--green);font-weight:950}.correctAnswer{font-size:clamp(27px,3.5vw,43px);line-height:1.08;margin:14px 0 12px}.revealQuestionText{font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:12px}.revealExplanation{line-height:1.55;margin-bottom:0}.personalResult{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;padding:12px 14px;border-radius:15px;background:#e8f7ef;border:1px solid #b9e0c8}.personalResult.bad{background:#fff0f0;border-color:#efc3c3}.personalResult strong{font-size:18px}.personalResult b{font-size:23px;color:var(--blue)}
.revealBoard{padding:20px}.revealBoardHead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.revealBoardHead h2{font-size:clamp(26px,3vw,40px);margin-bottom:0}.revealBoardHead .countdownPill{margin:0;white-space:nowrap}.revealRankGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:calc(100vh - 235px);overflow:auto;padding-right:3px}.revealRankRow{display:grid;grid-template-columns:38px 42px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:#fff;min-width:0}.revealRankRow.me{border:2px solid var(--gold);background:#fff9e7}.revealRankRow.top1{background:#fff7d7}.revealRankRow .avatar{width:38px;height:38px;font-size:20px}.revealRankRow .rank{font-size:16px}.rankPerson{min-width:0}.rankPerson b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.rankPerson small{display:flex;gap:7px;color:var(--muted);font-size:10px}.gain{font-weight:950;color:var(--green);font-size:12px}.gain.zero{color:var(--muted)}.movement{font-weight:900}.movement.up{color:var(--green)}.movement.down{color:var(--red)}.rankScore{text-align:right}.rankScore b{display:block;font-size:15px;color:var(--blue)}.rankScore small{font-size:9px;color:var(--muted)}
.soundBtn{min-width:44px}.celebrationTitle{font-size:clamp(48px,8vw,92px)!important;background:linear-gradient(90deg,#0a376f,#6f4ab1,#d18a00);-webkit-background-clip:text;background-clip:text;color:transparent;animation:celebrateGlow 1.8s ease-in-out infinite alternate}.celebrationRibbon{display:inline-flex;align-items:center;gap:10px;padding:10px 17px;border-radius:999px;background:#fff4cf;border:1px solid #efd079;color:#875b00;font-weight:950;margin-bottom:11px}.celebrationStars{font-size:34px;letter-spacing:8px;animation:floatStars 1.6s ease-in-out infinite alternate}.winnerCallout{margin:24px auto 0;max-width:680px;padding:17px;border-radius:19px;background:linear-gradient(135deg,#edf6ff,#fff8df);border:1px solid var(--line);font-weight:850}.finalStandings{max-width:820px;margin:24px auto 0;text-align:left}.finalStandings h3{text-align:center}.finalStandings .rankRow{grid-template-columns:48px 48px 1fr auto}.finalStandings .avatar{width:42px;height:42px}
@keyframes celebrateGlow{to{filter:drop-shadow(0 8px 18px rgba(111,74,177,.25));transform:translateY(-2px)}}@keyframes floatStars{to{transform:translateY(-7px) scale(1.04)}}
@media(max-width:1050px){.revealLayout{grid-template-columns:1fr}.revealRankGrid{max-height:none}.questionPhoto,.academicVisual{min-height:220px}}
@media(max-width:680px){.questionPhoto,.academicVisual{aspect-ratio:16/9;min-height:180px}.photoSplit{grid-template-columns:1fr}.photoPane:first-child{border-right:0;border-bottom:3px solid #fff}.revealRankGrid{grid-template-columns:1fr}.revealBoardHead{align-items:start;flex-direction:column}.quartileGraphic,.pubGraphic{grid-template-columns:1fr 1fr}.timelineGraphic{grid-template-columns:1fr}.timeArrow{transform:rotate(90deg)}.creditGraphic{gap:8px}.creditGraphic .creditBox{min-width:0;padding:15px}.creditGraphic strong{font-size:36px}.creditGraphic .math{font-size:30px}}


.phaseBadge{display:inline-flex;justify-content:center;align-items:center;padding:8px 13px;border-radius:999px;background:#e8f2fc;color:var(--navy);font-size:11px;font-weight:950;letter-spacing:.1em;margin:8px auto 5px}.phaseBadge.answer{background:#fff2c7;color:#8b5e00}.previewTimer .timer{border-color:var(--blue);color:var(--blue)}.previewProgress>div{background:linear-gradient(90deg,var(--blue),#74b9eb)}.answerGate{grid-column:1/-1;min-height:150px;border:2px dashed #abc8e4;border-radius:20px;background:linear-gradient(135deg,#f3f8fd,#eaf4ff);display:flex;align-items:center;justify-content:center;gap:15px;padding:22px;color:var(--navy);text-align:left}.answerGate .gateIcon{font-size:42px}.answerGate b{display:block;font-size:18px;margin-bottom:5px}.answerGate small{display:block;color:var(--muted);line-height:1.45}.previewLocked{grid-template-columns:1fr}.previewLocked:after{content:"7-second host reading phase";display:block;grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;font-weight:850;margin-top:-2px}

.questionCard.academicNoVisual{min-height:610px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#fff,#f7f4ff)}
.questionCard.academicNoVisual .questionBody{padding:38px 34px}
.revealAnswer .academicVisual{animation:revealAcademic .48s cubic-bezier(.2,.8,.2,1) both}
@keyframes revealAcademic{from{opacity:0;transform:translateY(-12px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:620px){.questionCard.academicNoVisual{min-height:0}.questionCard.academicNoVisual .questionBody{padding:26px 20px}}

<script>
window.QUIZ_QUESTIONS=[{"id":1,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is the central circular opening at the top of the Pantheon’s dome called?","answers":["The oculus","The clerestory","The transept"],"correctIndex":0,"explanation":"The oculus is the open “eye” at the centre of the Pantheon’s dome. It provides natural light and creates a changing connection between the interior and the sky.","source":"Italian Ministry of Culture - Pantheon","visual":{"icon":"◉","label":"Pantheon Oculus","motif":"dome"},"imageFile":"Oculus of the Pantheon, Rome.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Pantheon · Rome"},{"id":2,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"What was the main structural purpose of flying buttresses in Gothic cathedrals?","answers":["To form private chapels outside the nave","To transfer lateral thrust from high vaults to exterior supports","To support bells above the main entrance"],"correctIndex":1,"explanation":"Flying buttresses redirect the lateral thrust of stone vaults toward exterior piers, allowing taller interiors, thinner walls and larger stained-glass windows.","source":"Notre-Dame de Paris - architectural history","visual":{"icon":"⛪","label":"Gothic Structure","motif":"arches"},"imageFile":"Cathedral Flying Buttresses.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Flying buttress · Gothic structure"},{"id":3,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Filippo Brunelleschi is most closely associated with the great dome of which building?","answers":["The Pantheon in Rome","St Paul’s Cathedral in London","Florence Cathedral (Santa Maria del Fiore)"],"correctIndex":2,"explanation":"Brunelleschi designed the innovative masonry dome of Florence Cathedral, one of the defining engineering achievements of the early Renaissance.","source":"Opera di Santa Maria del Fiore - official Duomo website","visual":{"icon":"🏛","label":"Florence Dome","motif":"dome"},"imageFile":"Brunelleschi's Dome, Florence Cathedral.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Santa Maria del Fiore · Florence"},{"id":4,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Crystal Palace of 1851 important in architectural history?","answers":["It demonstrated large-scale prefabricated iron-and-glass construction","It was the first reinforced-concrete skyscraper","It revived the construction system of a medieval stone cathedral"],"correctIndex":0,"explanation":"Joseph Paxton’s Crystal Palace used standardized iron and glass components assembled rapidly, becoming a landmark of industrialized and prefabricated construction.","source":"Victoria and Albert Museum - Crystal Palace","visual":{"icon":"◇","label":"Crystal Palace","motif":"grid"},"imageFile":"Crystal Palace - interior.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Crystal Palace · Great Exhibition, 1851"},{"id":5,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which statement best describes a central ambition of the Bauhaus?","answers":["To reproduce only medieval European styles","To unite art, craft, architecture, design and modern production","To separate technology from design education"],"correctIndex":1,"explanation":"The Bauhaus brought creative disciplines together and connected design education with modern materials, production and social reform.","source":"Bauhaus-Archiv - History of the Bauhaus","visual":{"icon":"▦","label":"Bauhaus","motif":"grid"},"imageFile":"Bauhaus-Dessau main building.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Bauhaus Building · Dessau"},{"id":6,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is most distinctive about Frank Lloyd Wright’s placement of Fallingwater?","answers":["It is buried completely underground","It stands at the centre of a formal French garden","It is built over and integrated with a natural waterfall"],"correctIndex":2,"explanation":"Wright designed the house so its occupants would live with the waterfall rather than merely look at it, making the site part of the architecture.","source":"Fallingwater - official introduction","visual":{"icon":"🌊","label":"Fallingwater","motif":"water"},"imageFile":"TAG Fallingwater Waterfall.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Fallingwater · House over the waterfall"},{"id":7,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"What geometric idea helped make the roof shells of the Sydney Opera House buildable as a repeated system?","answers":["The shell segments were derived from the geometry of a common sphere","Every shell was designed as a separate pyramid","All roofs were suspended from one central mast"],"correctIndex":0,"explanation":"Jørn Utzon’s “spherical solution” generated the shells from a common sphere, enabling repeated ribs and more rational construction.","source":"Sydney Opera House - The Spherical Solution","visual":{"icon":"◒","label":"Sydney Opera House","motif":"shells"},"imageFile":"Model of Shells (Sydney Opera House) (5373921362).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Sydney Opera House · repeated shell geometry"},{"id":8,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which spatial feature most strongly organizes Frank Lloyd Wright’s Guggenheim Museum in New York?","answers":["A sequence of isolated underground galleries","A continuous spiral ramp around a central atrium","A grid of identical courtyards"],"correctIndex":1,"explanation":"The museum is organized by a spiral ramp around a central rotunda, creating a continuous movement through the exhibitions.","source":"Solomon R. Guggenheim Museum - Architecture","visual":{"icon":"◎","label":"Guggenheim Spiral","motif":"spiral"},"imageFile":"Guggenheim-Interior.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Solomon R. Guggenheim Museum · spiral ramp"},{"id":9,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Centre Pompidou in Paris often described as an “inside-out” building?","answers":["Its galleries are entirely underground","Its main facade copies a classical palace","Many services, structural elements and circulation systems are visibly expressed on the exterior"],"correctIndex":2,"explanation":"The building places major technical systems and circulation on the outside, freeing flexible interior exhibition space and making infrastructure part of the architectural image.","source":"Centre Pompidou - Architecture of the building","visual":{"icon":"⚙","label":"Centre Pompidou","motif":"services"},"imageFile":"Pompidou Centre.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Centre Pompidou · exposed services"},{"id":10,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"Which proposal best represents responsible adaptive reuse of a historic building?","answers":["Introduce a compatible new use after studying heritage significance, fabric, setting and capacity for change","Remove every later layer so the building appears completely new","Keep only a copied facade and replace the entire building behind it without assessment"],"correctIndex":0,"explanation":"Responsible adaptive reuse begins by understanding the existing building and its significance, then finding a viable use while minimizing unnecessary loss of important fabric and character.","source":"Historic England - Constructive Conservation","visual":{"icon":"↻","label":"Adaptive Reuse","motif":"reuse"},"imageFile":"Tate Modern (7327476710).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Tate Modern · adapted power station"},{"id":11,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"In a traditional Lanna house, what is the Kalae?","answers":["A brick foundation below the kitchen","A carved wooden element extending from the top of the gable","A water jar placed below the stairs"],"correctIndex":1,"explanation":"Kalae refers to carved wooden pieces extending from the upper ends of the gables and is one of the most recognizable features of traditional Lanna domestic architecture.","source":"CMU Lanna Traditional House Museum","visual":{"icon":"⌃","label":"Kalae Gable","motif":"gable"},"imageFile":"Ka lae 2.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Kalae · carved gable finials"},{"id":12,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which combination best explains the environmental logic of many traditional Lanna wooden houses?","answers":["Flat roofs, sealed rooms and underground sleeping spaces","Solid stone walls with very small roof overhangs","Raised floors, shaded transitional spaces and openings that support ventilation"],"correctIndex":2,"explanation":"Raised floors, verandas, terraces, roof overhangs and openings help respond to rain, heat, air movement and changing domestic activities.","source":"CMU Lanna Traditional House Museum house descriptions","visual":{"icon":"☀","label":"Climate Response","motif":"climate"},"imageFile":"Traditional wooden house in Chiang Mai city.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Raised timber house · shade, airflow and rain protection"},{"id":13,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"What is the main spatial role of verandas and terraces in many Lanna houses?","answers":["They connect rooms and support semi-outdoor social and domestic activities","They are used only to store roof tiles","They isolate every room from the rest of the household"],"correctIndex":0,"explanation":"Verandas and terraces work as connectors and adaptable living areas between enclosed rooms and the outdoor environment.","source":"CMU Lanna Traditional House Museum - house descriptions","visual":{"icon":"▱","label":"Veranda & Terrace","motif":"terrace"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum6.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/6/","imageOverlay":"Veranda + terrace · transition between inside and outside"},{"id":14,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"What is a Long-Khao in Lanna vernacular architecture?","answers":["A monk’s sleeping cell","A rice granary","A city gate tower"],"correctIndex":1,"explanation":"A Long-Khao is a raised rice-storage building designed to protect an important household resource.","source":"CMU Lanna Traditional House Museum - Long-Khao collection","visual":{"icon":"▣","label":"Lanna Rice Granary","motif":"granary"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum9.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/9/","imageOverlay":"Long-Khao · Lanna rice granary"},{"id":15,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which evidence combination is strongest for studying how a Lanna house has adapted to present-day use?","answers":["One attractive exterior photograph only","A list of construction dates without visiting the site","Measured drawings, repeated observation and interviews with users or caretakers"],"correctIndex":2,"explanation":"Measured drawings document spatial change, observation reveals actual use, and interviews explain decisions and meanings that are not visible in plans alone.","source":"Architectural case-study and post-occupancy research logic","visual":{"icon":"⌖","label":"Field Research","motif":"mapping"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum2.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum/detail/2/","imageOverlay":"Measure · observe · interview · compare documents"},{"id":16,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Challenge","question":"Why should a researcher avoid treating every visible part of a historic Lanna temple as belonging to one original period?","answers":["Many temples are living heritage sites with repairs, additions and transformations from different periods","Temples are completely rebuilt every year","Historic temples contain no physical evidence that can be studied"],"correctIndex":0,"explanation":"Many Lanna temples remain active and have been repaired or altered repeatedly. Research should identify historical layers rather than assume a single unchanged original state.","source":"UNESCO Chiang Mai Tentative List - living heritage and restoration layers","visual":{"icon":"⧉","label":"Layered Heritage","motif":"layers"},"imageFile":"Wat Phra Singh, Chiang Mai.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Living heritage contains additions, repairs and reconstructions"},{"id":17,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Who founded Chiang Mai in 1296 as the capital of the Lanna Kingdom?","answers":["King Narai","King Mangrai","King Rama V"],"correctIndex":1,"explanation":"King Mangrai founded Chiang Mai in 1296 as the political, cultural and spiritual centre of the Lanna Kingdom.","source":"UNESCO Chiang Mai Tentative List","visual":{"icon":"♛","label":"King Mangrai","motif":"city"},"imageFile":"Three Kings Monument, Chiang Mai (I).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"King Mangrai at the centre of the Three Kings Monument"},{"id":18,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which Chiang Mai temple is best known for its massive, partly ruined central chedi?","answers":["Wat Arun","Wat Benchamabophit","Wat Chedi Luang"],"correctIndex":2,"explanation":"Wat Chedi Luang is recognized for its monumental chedi, which remains a major landmark in Chiang Mai’s old city despite historical damage and restoration.","source":"UNESCO Chiang Mai Tentative List and Chiang Mai heritage records","visual":{"icon":"▲","label":"Wat Chedi Luang","motif":"chedi"},"imageFile":"Wat Chedi Luang, Chiang Mai (48108378837).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Wat Chedi Luang · monumental ruined chedi"},{"id":19,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Tha Phae Gate is located on which side of Chiang Mai’s old city?","answers":["The eastern side","The western side","The southern side"],"correctIndex":0,"explanation":"Tha Phae Gate is the best-known eastern gateway of the old city and historically connected the walled city with commercial areas toward the Ping River.","source":"Chiang Mai municipal and heritage information","visual":{"icon":"▥","label":"Tha Phae Gate","motif":"gate"},"imageFile":"Tha Phae Gate on the old city walls (14737657804).jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Tha Phae Gate · eastern side of the old city"},{"id":20,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which CMU museum preserves and presents relocated traditional Lanna houses and rice granaries?","answers":["Bangkok National Museum","The Lanna Traditional House Museum at CMU","The Museum of Contemporary Art Bangkok"],"correctIndex":1,"explanation":"The Lanna Traditional House Museum at Chiang Mai University preserves several relocated house types, rice granaries and related construction knowledge.","source":"CMU Center for the Promotion of Arts and Culture","visual":{"icon":"⌂","label":"Lanna House Museum","motif":"houses"},"imageUrl":"https://art-culture.cmu.ac.th/en/public/img/parallax-museum6.jpg","imageCredit":"CMU Lanna Traditional House Museum","imageCreditUrl":"https://art-culture.cmu.ac.th/en/Museum","imageOverlay":"The Lanna Traditional House Museum, CMU"},{"id":21,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"In which year did architectural education at what became ARCH CMU begin?","answers":["1985","2005","1995"],"correctIndex":2,"explanation":"Architectural education at CMU began in June 1995, initially as a department within the Faculty of Fine Arts.","source":"Chiang Mai University - Faculty of Architecture history","visual":{"icon":"1995","label":"ARCH CMU Begins","motif":"timeline"},"imageFile":"Architecture Faculty building Chiang Mai University.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Faculty of Architecture · Chiang Mai University"},{"id":22,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"How does the ARCH CMU PhD program describe its two broad research directions?","answers":["Tradition and Innovation","Drawing and Model Making","Housing and Highway Engineering only"],"correctIndex":0,"explanation":"The program describes two overlapping research directions: Tradition, using documentary and field-based inquiry, and Innovation, exploring technological advancement in planning and design.","source":"ARCH CMU PhD Program official page","visual":{"icon":"T+I","label":"Tradition + Innovation","motif":"research"},"imageFile":"Architecture Faculty building Chiang Mai University.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"ARCH CMU PhD · architecture research and design knowledge"},{"id":23,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"Beyond playful water splashing, what does water traditionally symbolize during Songkran?","answers":["The end of the rainy season","Cleansing, reverence and good fortune for the new year","A competition to identify the strongest village"],"correctIndex":1,"explanation":"Songkran water practices express cleansing, respect, blessing and good fortune, together with family reunion and honouring elders and sacred images.","source":"UNESCO Intangible Cultural Heritage - Songkran in Thailand","visual":{"icon":"💧","label":"Songkran Meaning","motif":"water"},"imageFile":"Pre-Songkran Festival 1, Tak, Thailand.JPG","imageCredit":"Wikimedia Commons","imageOverlay":"Songkran · cleansing, renewal and respect"},{"id":24,"section":"Thai Culture: Fun & Useful","difficulty":"Medium","question":"Which statement best distinguishes Chiang Mai’s Yi Peng tradition from the nationwide Loi Krathong celebration?","answers":["Yi Peng is mainly a daytime water-fighting festival","Yi Peng is a masked court dance performed only inside palaces","Yi Peng emphasizes Lanna lanterns, while Loi Krathong centres on floating decorated vessels on water"],"correctIndex":2,"explanation":"Yi Peng is a northern Lanna lantern tradition celebrated alongside Loi Krathong. Loi Krathong is best known for floating decorated krathongs on water.","source":"Tourism Authority of Thailand - Yi Peng and Loi Krathong guidance","visual":{"icon":"🏮","label":"Yi Peng & Loi Krathong","motif":"lantern"},"imageFile":"Yi peng sky lantern festival San Sai Thailand.jpg","imageFile2":"Loi Krathong 2010 John Shedrick.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Yi Peng · lanterns in the sky","imageOverlay2":"Loi Krathong · offerings floated on water"},{"id":25,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"What should visitors normally do before entering an ubosot or viharn at a Thai temple?","answers":["Remove their shoes","Put on a hat","Point toward the Buddha image with one foot"],"correctIndex":0,"explanation":"Shoes are normally removed before entering principal temple buildings, and visitors should behave quietly and respectfully.","source":"Thailand.go.th - Thai Temple Travel Guide","visual":{"icon":"👣","label":"Temple Etiquette","motif":"temple"},"imageFile":"No shoes sign - Wat Hiranyawat - Chiang Rai - 2017-01-02 - 002.jpg","imageCredit":"Wikimedia Commons","imageOverlay":"Remove shoes before entering sacred interior spaces"},{"id":26,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficu async function pnPublishNow(kind,data){

 for(let attempt=0;attempt<PUBNUB_ORIGINS.length;attempt++){
   const origin=PUBNUB_ORIGINS[(pnOriginIndex+attempt)%PUBNUB_ORIGINS.length];
   const url=`${origin}/publish/${encodeURIComponent(publishKey)}/${encodeURIComponent(subscribeKey)}/0/${encodeURIComponent(pnChannel)}/0/${payload}?store=0&uuid=${encodeURIComponent(pnUUID)}&pnsdk=${encodeURIComponent(PN_SDK)}`;

}

}

};
function renderPlayer(){
 if(assignmentReveal&&Date.now()<assignmentRevealUntil){return app.innerHTML=shell(`<section class="panel assignmentReveal"><div class="eyebrow">Random draw complete</div><h2>Your random character is…</h2><div class="assignmentAvatar">${esc(assignmentReveal.avatar)}</div><div class="assignmentName">${esc(assignmentReveal.name)}</div><p class="lead" style="margin:14px auto 0">This unique identity is now locked to your phone. No other participant can receive it.</p><div class="notice blue" style="margin-top:18px">Joining the host lobby automatically…</div></section>`)}
 if(!displayName)return renderJoinForm();
 if(!state)return app.innerHTML=shell(`<section class="panel center"><h2>Waiting for the host</h2><p class="lead" style="margin:auto">Connected to room <b>${esc(room)}</b>. The lobby will appear when the host is online.</p><div class="avatar big" style="margin:22px auto">${esc(avatar)}</div></section>`);
 if(state.phase==='lobby')return app.innerHTML=shell(`<section class="panel center"><div class="avatar big" style="margin:0 auto 14px">${esc(avatar)}</div><div class="eyebrow">Room ${esc(room)}</div><h2>You are in!</h2><p class="lead" style="margin:0 auto 18px">Welcome, <b>${esc(displayName)}</b>. Your unique character is locked in. The host will start the first round soon.</p><div class="notice blue">First, the host has 7 seconds to read each question. Then you have 15 seconds to answer. After every question, the correct answer and the complete live ranking appear immediately. Extended checkpoints follow Questions 10 and 20. This room supports up to 30 participants.</div></section>`);
 if(state.phase==='section')return renderSection(false);
 if(state.phase==='preview'||state.phase==='question'||state.phase==='reveal')return renderQuestion(false);
 if(state.phase==='leaderboard')return renderLeaderboard(false,false);
 if(state.phase==='final')return renderFinal(false)
}
function confetti(){const box=document.createElement('div');box.className='confetti';const colors=['#f2ae1b','#1769aa','#2c8a5a','#c84c4c','#6f4ab1'];for(let i=0;i<90;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'vw';s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*1.4+'s';s.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),5500)}
function updateCountdowns(){
 const el=document.querySelector('[data-countdown]');if(el&&state&&state.phaseEndsAt)el.textContent=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 const t=document.querySelector('.timer');if(t&&state&&(state.phase==='preview'||state.phase==='question')){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));const total=state.phase==='preview'?READ_SECONDS:ANSWER_SECONDS;t.textContent=r;t.classList.toggle('urgent',state.phase==='question'&&r<=5);const p=document.querySelector('.progress>div');if(p)p.style.width=Math.max(0,r/total*100)+'%';if(state.phase==='question'&&r>0&&r<=5){const mark=state.questionIndex+':'+r;if(mark!==lastTickMark){lastTickMark=mark;playSound(r===1?'lastTick':'tick')}}}
 if(state&&state.phase==='leaderboard'){const lead=document.querySelector('.leaderHead .lead');if(lead){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));lead.innerHTML=`Scores combine accuracy and response speed. The quiz continues automatically in ${r} seconds.`}}
}
async function boot(){
 if(!TEST_MODE)preloadImages();
 if(role==='home')return renderHome();
 if(!room){role='home';return renderHome()}
 if(role==='player'&&!sessionKey){joinError='This join link is outdated. Please scan the QR code currently shown on the host screen.';return renderJoinForm(joinError)}
 if(role==='player'&&!TEST_MODE&&!validRealtimeKeys()){joinError='This QR code is missing its verified realtime configuration. Please ask the host to complete the live setup and scan the new QR code.';return renderJoinForm(joinError)}
 if(role==='host'){
   const forceNew=params.get('new')==='1';
   if(forceNew){localStorage.removeItem('vq_host_'+room);localStorage.removeItem('vq_answers_'+room)}
   const saved=JSON.parse(localStorage.getItem('vq_host_'+room)||'null');
   if(!forceNew&&saved&&saved.room===room&&saved.version===23){state=saved;sessionKey=saved.sessionKey||sessionKey||randomId(8)}
   else{sessionKey=forceNew?randomId(8):(sessionKey||randomId(8));state=newHostState()}
   state.sessionKey=sessionKey;normalizeUniquePlayers();hostAnswers=forceNew?{}:JSON.parse(localStorage.getItem('vq_answers_'+room)||'{}');
   if(!TEST_MODE)history.replaceState({},'',baseUrl()+'?host='+room+'&s='+sessionKey+'&v=23');
   if(!TEST_MODE&&!validRealtimeKeys()){renderRealtimeSetup('Realtime synchronization has not been configured yet. Add your own PubNub key pair before participants scan.');return}
   render();try{await connectLiveService()}catch(e){brokerLabel=e.message;renderHostLobby()}hostTimer=setInterval(hostTick,180);uiTimer=setInterval(updateCountdowns,180)
 }else{
   if(displayName)lastSubmitted=JSON.parse(sessionStorage.getItem('vq_lastSubmitted')||'{}');renderJoinForm('Connecting to the live room…');
   try{await connectLiveService();if(displayName)publishEvent({type:'join',pid,name:displayName,avatar});else publishEvent({type:'state_request',pid})}catch(e){joinFormMessage=e.message;renderJoinForm(joinFormMessage)}
   setInterval(()=>{if(!connected||!connectionVerified)return;if(displayName){if(!state||!state.players||!state.players[pid])publishEvent({type:'join',pid,name:displayName,avatar});else publishEvent({type:'ping',pid})}else if(randomDrawPending)publishEvent({type:'random_join',pid});else if(!hostSeen||!state)publishEvent({type:'state_request',pid})},2500);uiTimer=setInterval(updateCountdowns,180)
 }
}
boot();
})();
</script></body></html>
