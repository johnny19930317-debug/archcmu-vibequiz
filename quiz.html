-child(3){background:#d09318}.option:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}.letter{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:0 0 auto}.option.selected{outline:6px solid rgba(242,174,27,.62)}.option.correct{outline:7px solid #5ee6a1;filter:brightness(1.04)}.option.wrong{opacity:.34;filter:grayscale(.7)}.option.chosenWrong{outline:6px solid #ff8e8e}
.timerCard{text-align:center}.timer{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;margin:7px auto 13px;background:#fff;border:13px solid var(--gold);font-size:38px;font-weight:950;color:var(--navy)}.timer.urgent{color:var(--red);border-color:var(--red);animation:pulse .7s infinite}.progress{height:12px;border-radius:999px;overflow:hidden;background:#dfe9f3}.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),#ffd978);transition:width .15s linear}.answerCount{font-size:54px;font-weight:950;color:var(--navy)}.miniMe{display:flex;align-items:center;gap:10px;padding:11px;border-radius:15px;background:#f3f8fd;border:1px solid var(--line);margin-top:12px;text-align:left}.miniMe .avatar{width:48px;height:48px}.ownScore{margin-left:auto;font-weight:950;color:var(--blue)}
.resultPanel{padding:17px;border-radius:18px;background:#e7f7ee;border:1px solid #bce4cc;margin-top:14px}.resultPanel.bad{background:#fff0f0;border-color:#f1c2c2}.resultPanel h3{margin-bottom:7px}.source{font-size:11px;color:var(--muted);margin-top:10px}.waitingAnswer{padding:16px;border-radius:17px;background:#f3f8fd;border:1px solid var(--line);text-align:center;color:var(--muted);font-weight:800}
.leaderWrap{min-height:680px}.leaderHead{text-align:center;margin-bottom:22px}.leaderboard{display:flex;flex-direction:column;gap:9px;max-width:860px;margin:0 auto}.rankRow{display:grid;grid-template-columns:52px 52px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:17px;background:#fff}.rankRow:nth-child(1){background:#fff7d7;border-color:#efd06d}.rankRow:nth-child(2){background:#f2f5f8}.rankRow:nth-child(3){background:#fff0e7}.rank{font-size:19px;font-weight:950;color:var(--navy)}.score{font-size:20px;font-weight:950;color:var(--blue)}.bar{height:7px;border-radius:999px;background:#e1ebf4;overflow:hidden;margin-top:6px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}.podium{display:grid;grid-template-columns:1fr 1.16fr 1fr;gap:12px;align-items:end;max-width:900px;margin:25px auto 0}.podiumBox{border-radius:24px 24px 0 0;text-align:center;color:#fff;padding:19px 10px}.podiumBox.first{min-height:295px;background:linear-gradient(#f3be38,#d99300)}.podiumBox.second{min-height:230px;background:linear-gradient(#a8b5c4,#6e8197)}.podiumBox.third{min-height:195px;background:linear-gradient(#d59a70,#a56a43)}.podiumBox .avatar{margin:5px auto;background:rgba(255,255,255,.92)}.podiumBox b{display:block;font-size:23px;margin:9px 0 4px}.podiumBox .medal{font-size:42px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999}.confetti span{position:absolute;top:-30px;width:12px;height:22px;animation:fall 4s linear forwards}.offlineBanner{padding:10px 13px;border-radius:14px;background:#fff0f0;border:1px solid #efc0c0;color:#8a3131;margin-bottom:12px}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}
@media(max-width:940px){.hero,.hostGrid,.sectionIntro,.questionLayout{grid-template-columns:1fr}.heroCopy{min-height:auto}.heroArt{min-height:380px}.sectionIntro{min-height:auto}.sectionVisual{order:-1}.sectionIcon{font-size:120px}.questionLayout>.sidebar{display:grid;grid-template-columns:1fr 1fr}.main{padding:16px}}

.qrBox{position:relative}.qrImage{display:block;width:min(100%,300px);height:auto;aspect-ratio:1/1;background:#fff;border-radius:16px}.rankMini{display:flex;flex-direction:column;gap:7px;margin-top:12px}.rankMiniRow{display:grid;grid-template-columns:32px 38px 1fr auto;align-items:center;gap:8px;padding:8px 9px;border-radius:12px;background:#f5f8fc;border:1px solid var(--line)}.rankMiniRow:nth-child(1){background:#fff7d7;border-color:#efd06d}.rankMiniRow .avatar{width:38px;height:38px;font-size:23px}.rankMiniRow b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rankMiniRow .score{font-size:14px}.myRankCard{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:12px;margin-top:12px;border-radius:15px;background:#edf5ff;border:1px solid #cfe1f5}.myRankCard .avatar{width:48px;height:48px;font-size:28px}.myRankCard strong{font-size:22px;color:var(--navy)}

<script>
window.QUIZ_QUESTIONS=[{"id":1,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is the central circular opening at the top of the Pantheon’s dome called?","answers":["The oculus","The clerestory","The transept"],"correctIndex":0,"explanation":"The oculus is the open “eye” at the centre of the Pantheon’s dome. It provides natural light and creates a changing connection between the interior and the sky.","source":"Italian Ministry of Culture - Pantheon","visual":{"icon":"◉","label":"Pantheon Oculus","motif":"dome"}},{"id":2,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"What was the main structural purpose of flying buttresses in Gothic cathedrals?","answers":["To form private chapels outside the nave","To transfer lateral thrust from high vaults to exterior supports","To support bells above the main entrance"],"correctIndex":1,"explanation":"Flying buttresses redirect the lateral thrust of stone vaults toward exterior piers, allowing taller interiors, thinner walls and larger stained-glass windows.","source":"Notre-Dame de Paris - architectural history","visual":{"icon":"⛪","label":"Gothic Structure","motif":"arches"}},{"id":3,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Filippo Brunelleschi is most closely associated with the great dome of which building?","answers":["The Pantheon in Rome","St Paul’s Cathedral in London","Florence Cathedral (Santa Maria del Fiore)"],"correctIndex":2,"explanation":"Brunelleschi designed the innovative masonry dome of Florence Cathedral, one of the defining engineering achievements of the early Renaissance.","source":"Opera di Santa Maria del Fiore - official Duomo website","visual":{"icon":"🏛","label":"Florence Dome","motif":"dome"}},{"id":4,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Crystal Palace of 1851 important in architectural history?","answers":["It demonstrated large-scale prefabricated iron-and-glass construction","It was the first reinforced-concrete skyscraper","It revived the construction system of a medieval stone cathedral"],"correctIndex":0,"explanation":"Joseph Paxton’s Crystal Palace used standardized iron and glass components assembled rapidly, becoming a landmark of industrialized and prefabricated construction.","source":"Victoria and Albert Museum - Crystal Palace","visual":{"icon":"◇","label":"Crystal Palace","motif":"grid"}},{"id":5,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which statement best describes a central ambition of the Bauhaus?","answers":["To reproduce only medieval European styles","To unite art, craft, architecture, design and modern production","To separate technology from design education"],"correctIndex":1,"explanation":"The Bauhaus brought creative disciplines together and connected design education with modern materials, production and social reform.","source":"Bauhaus-Archiv - History of the Bauhaus","visual":{"icon":"▦","label":"Bauhaus","motif":"grid"}},{"id":6,"section":"Global Architectural History & Modern Design","difficulty":"Easy","question":"What is most distinctive about Frank Lloyd Wright’s placement of Fallingwater?","answers":["It is buried completely underground","It stands at the centre of a formal French garden","It is built over and integrated with a natural waterfall"],"correctIndex":2,"explanation":"Wright designed the house so its occupants would live with the waterfall rather than merely look at it, making the site part of the architecture.","source":"Fallingwater - official introduction","visual":{"icon":"🌊","label":"Fallingwater","motif":"water"}},{"id":7,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"What geometric idea helped make the roof shells of the Sydney Opera House buildable as a repeated system?","answers":["The shell segments were derived from the geometry of a common sphere","Every shell was designed as a separate pyramid","All roofs were suspended from one central mast"],"correctIndex":0,"explanation":"Jørn Utzon’s “spherical solution” generated the shells from a common sphere, enabling repeated ribs and more rational construction.","source":"Sydney Opera House - The Spherical Solution","visual":{"icon":"◒","label":"Sydney Opera House","motif":"shells"}},{"id":8,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Which spatial feature most strongly organizes Frank Lloyd Wright’s Guggenheim Museum in New York?","answers":["A sequence of isolated underground galleries","A continuous spiral ramp around a central atrium","A grid of identical courtyards"],"correctIndex":1,"explanation":"The museum is organized by a spiral ramp around a central rotunda, creating a continuous movement through the exhibitions.","source":"Solomon R. Guggenheim Museum - Architecture","visual":{"icon":"◎","label":"Guggenheim Spiral","motif":"spiral"}},{"id":9,"section":"Global Architectural History & Modern Design","difficulty":"Medium","question":"Why is the Centre Pompidou in Paris often described as an “inside-out” building?","answers":["Its galleries are entirely underground","Its main facade copies a classical palace","Many services, structural elements and circulation systems are visibly expressed on the exterior"],"correctIndex":2,"explanation":"The building places major technical systems and circulation on the outside, freeing flexible interior exhibition space and making infrastructure part of the architectural image.","source":"Centre Pompidou - Architecture of the building","visual":{"icon":"⚙","label":"Centre Pompidou","motif":"services"}},{"id":10,"section":"Global Architectural History & Modern Design","difficulty":"Challenge","question":"Which proposal best represents responsible adaptive reuse of a historic building?","answers":["Introduce a compatible new use after studying heritage significance, fabric, setting and capacity for change","Remove every later layer so the building appears completely new","Keep only a copied facade and replace the entire building behind it without assessment"],"correctIndex":0,"explanation":"Responsible adaptive reuse begins by understanding the existing building and its significance, then finding a viable use while minimizing unnecessary loss of important fabric and character.","source":"Historic England - Constructive Conservation","visual":{"icon":"↻","label":"Adaptive Reuse","motif":"reuse"}},{"id":11,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"In a traditional Lanna house, what is the Kalae?","answers":["A brick foundation below the kitchen","A carved wooden element extending from the top of the gable","A water jar placed below the stairs"],"correctIndex":1,"explanation":"Kalae refers to carved wooden pieces extending from the upper ends of the gables and is one of the most recognizable features of traditional Lanna domestic architecture.","source":"CMU Lanna Traditional House Museum","visual":{"icon":"⌃","label":"Kalae Gable","motif":"gable"}},{"id":12,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which combination best explains the environmental logic of many traditional Lanna wooden houses?","answers":["Flat roofs, sealed rooms and underground sleeping spaces","Solid stone walls with very small roof overhangs","Raised floors, shaded transitional spaces and openings that support ventilation"],"correctIndex":2,"explanation":"Raised floors, verandas, terraces, roof overhangs and openings help respond to rain, heat, air movement and changing domestic activities.","source":"CMU Lanna Traditional House Museum house descriptions","visual":{"icon":"☀","label":"Climate Response","motif":"climate"}},{"id":13,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"What is the main spatial role of verandas and terraces in many Lanna houses?","answers":["They connect rooms and support semi-outdoor social and domestic activities","They are used only to store roof tiles","They isolate every room from the rest of the household"],"correctIndex":0,"explanation":"Verandas and terraces work as connectors and adaptable living areas between enclosed rooms and the outdoor environment.","source":"CMU Lanna Traditional House Museum - house descriptions","visual":{"icon":"▱","label":"Veranda & Terrace","motif":"terrace"}},{"id":14,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Easy","question":"What is a Long-Khao in Lanna vernacular architecture?","answers":["A monk’s sleeping cell","A rice granary","A city gate tower"],"correctIndex":1,"explanation":"A Long-Khao is a raised rice-storage building designed to protect an important household resource.","source":"CMU Lanna Traditional House Museum - Long-Khao collection","visual":{"icon":"▣","label":"Lanna Rice Granary","motif":"granary"}},{"id":15,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Medium","question":"Which evidence combination is strongest for studying how a Lanna house has adapted to present-day use?","answers":["One attractive exterior photograph only","A list of construction dates without visiting the site","Measured drawings, repeated observation and interviews with users or caretakers"],"correctIndex":2,"explanation":"Measured drawings document spatial change, observation reveals actual use, and interviews explain decisions and meanings that are not visible in plans alone.","source":"Architectural case-study and post-occupancy research logic","visual":{"icon":"⌖","label":"Field Research","motif":"mapping"}},{"id":16,"section":"Lanna Architecture: Form, Climate & Research","difficulty":"Challenge","question":"Why should a researcher avoid treating every visible part of a historic Lanna temple as belonging to one original period?","answers":["Many temples are living heritage sites with repairs, additions and transformations from different periods","Temples are completely rebuilt every year","Historic temples contain no physical evidence that can be studied"],"correctIndex":0,"explanation":"Many Lanna temples remain active and have been repaired or altered repeatedly. Research should identify historical layers rather than assume a single unchanged original state.","source":"UNESCO Chiang Mai Tentative List - living heritage and restoration layers","visual":{"icon":"⧉","label":"Layered Heritage","motif":"layers"}},{"id":17,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Who founded Chiang Mai in 1296 as the capital of the Lanna Kingdom?","answers":["King Narai","King Mangrai","King Rama V"],"correctIndex":1,"explanation":"King Mangrai founded Chiang Mai in 1296 as the political, cultural and spiritual centre of the Lanna Kingdom.","source":"UNESCO Chiang Mai Tentative List","visual":{"icon":"♛","label":"King Mangrai","motif":"city"}},{"id":18,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which Chiang Mai temple is best known for its massive, partly ruined central chedi?","answers":["Wat Arun","Wat Benchamabophit","Wat Chedi Luang"],"correctIndex":2,"explanation":"Wat Chedi Luang is recognized for its monumental chedi, which remains a major landmark in Chiang Mai’s old city despite historical damage and restoration.","source":"UNESCO Chiang Mai Tentative List and Chiang Mai heritage records","visual":{"icon":"▲","label":"Wat Chedi Luang","motif":"chedi"}},{"id":19,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"Tha Phae Gate is located on which side of Chiang Mai’s old city?","answers":["The eastern side","The western side","The southern side"],"correctIndex":0,"explanation":"Tha Phae Gate is the best-known eastern gateway of the old city and historically connected the walled city with commercial areas toward the Ping River.","source":"Chiang Mai municipal and heritage information","visual":{"icon":"▥","label":"Tha Phae Gate","motif":"gate"}},{"id":20,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"Which CMU museum preserves and presents relocated traditional Lanna houses and rice granaries?","answers":["Bangkok National Museum","The Lanna Traditional House Museum at CMU","The Museum of Contemporary Art Bangkok"],"correctIndex":1,"explanation":"The Lanna Traditional House Museum at Chiang Mai University preserves several relocated house types, rice granaries and related construction knowledge.","source":"CMU Center for the Promotion of Arts and Culture","visual":{"icon":"⌂","label":"Lanna House Museum","motif":"houses"}},{"id":21,"section":"Chiang Mai & ARCH CMU","difficulty":"Easy","question":"In which year did architectural education at what became ARCH CMU begin?","answers":["1985","2005","1995"],"correctIndex":2,"explanation":"Architectural education at CMU began in June 1995, initially as a department within the Faculty of Fine Arts.","source":"Chiang Mai University - Faculty of Architecture history","visual":{"icon":"1995","label":"ARCH CMU Begins","motif":"timeline"}},{"id":22,"section":"Chiang Mai & ARCH CMU","difficulty":"Medium","question":"How does the ARCH CMU PhD program describe its two broad research directions?","answers":["Tradition and Innovation","Drawing and Model Making","Housing and Highway Engineering only"],"correctIndex":0,"explanation":"The program describes two overlapping research directions: Tradition, using documentary and field-based inquiry, and Innovation, exploring technological advancement in planning and design.","source":"ARCH CMU PhD Program official page","visual":{"icon":"T+I","label":"Tradition + Innovation","motif":"research"}},{"id":23,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"Beyond playful water splashing, what does water traditionally symbolize during Songkran?","answers":["The end of the rainy season","Cleansing, reverence and good fortune for the new year","A competition to identify the strongest village"],"correctIndex":1,"explanation":"Songkran water practices express cleansing, respect, blessing and good fortune, together with family reunion and honouring elders and sacred images.","source":"UNESCO Intangible Cultural Heritage - Songkran in Thailand","visual":{"icon":"💧","label":"Songkran Meaning","motif":"water"}},{"id":24,"section":"Thai Culture: Fun & Useful","difficulty":"Medium","question":"Which statement best distinguishes Chiang Mai’s Yi Peng tradition from the nationwide Loi Krathong celebration?","answers":["Yi Peng is mainly a daytime water-fighting festival","Yi Peng is a masked court dance performed only inside palaces","Yi Peng emphasizes Lanna lanterns, while Loi Krathong centres on floating decorated vessels on water"],"correctIndex":2,"explanation":"Yi Peng is a northern Lanna lantern tradition celebrated alongside Loi Krathong. Loi Krathong is best known for floating decorated krathongs on water.","source":"Tourism Authority of Thailand - Yi Peng and Loi Krathong guidance","visual":{"icon":"🏮","label":"Yi Peng & Loi Krathong","motif":"lantern"}},{"id":25,"section":"Thai Culture: Fun & Useful","difficulty":"Easy","question":"What should visitors normally do before entering an ubosot or viharn at a Thai temple?","answers":["Remove their shoes","Put on a hat","Point toward the Buddha image with one foot"],"correctIndex":0,"explanation":"Shoes are normally removed before entering principal temple buildings, and visitors should behave quietly and respectfully.","source":"Thailand.go.th - Thai Temple Travel Guide","visual":{"icon":"👣","label":"Temple Etiquette","motif":"temple"}},{"id":26,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"What is Scopus?","answers":["A single international architecture journal","An abstract and citation database covering scholarly literature","A ranking issued only for Thai universities"],"correctIndex":1,"explanation":"Scopus is a multidisciplinary abstract and citation database. A journal may be indexed in Scopus, but Scopus itself is not a journal.","source":"Elsevier - Scopus official product page","visual":{"icon":"S","label":"Scopus","motif":"database"}},{"id":27,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"Which statement about Q1, Q2, Q3 and Q4 journal quartiles is the most accurate?","answers":["Q4 is always the highest quartile","A journal keeps the same quartile forever in every category","Q1 is the highest quartile, but the result can vary by year, subject category and metric system"],"correctIndex":2,"explanation":"Quartiles are relative rankings within subject categories. The database or metric, category and year should be stated when describing a journal as Q1-Q4.","source":"Elsevier - CiteScore journal metric guidance","visual":{"icon":"Q1","label":"Journal Quartiles","motif":"quartile"}},{"id":28,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"According to the ARCH CMU PhD curriculum document, what is the credit structure for Type 2.1 students who enter with a master’s degree?","answers":["12 coursework credits plus a 36-credit dissertation, for 48 credits in total","No coursework and a 72-credit dissertation","24 coursework credits plus a 48-credit dissertation, for 72 credits in total"],"correctIndex":0,"explanation":"The curriculum document currently linked by ARCH CMU lists Type 2.1 as 12 coursework credits and a 36-credit dissertation, totaling 48 credits.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - Type 2.1","visual":{"icon":"48","label":"Type 2.1 Credits","motif":"credits"}},{"id":29,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Medium","question":"For ARCH CMU PhD Type 2.1, which publication combination is stated in the curriculum document?","answers":["One local magazine article with no relation to the dissertation","At least one dissertation-based international journal article accepted or published in a listed database, with the student as first author, plus at least one accepted international conference presentation","Three newspaper interviews and one design competition entry"],"correctIndex":1,"explanation":"The Type 2.1 curriculum states at least one dissertation-based international journal article accepted or published in a listed database, with the student as first author, and at least one dissertation-based international conference presentation accepted by the field.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - Type 2.1 academic activities","visual":{"icon":"✎","label":"Publication Path","motif":"publish"}},{"id":30,"section":"Scopus, Publishing & ARCH CMU PhD Completion","difficulty":"Challenge","question":"According to the ARCH CMU PhD curriculum, when must a doctoral student complete the qualifying examination?","answers":["Only after the final dissertation defence","Only after every journal article has been published","Before presenting the dissertation proposal; one re-examination is allowed within the following regular semester if the first attempt is unsuccessful"],"correctIndex":2,"explanation":"The curriculum requires the qualifying examination before the dissertation proposal. It also states that an unsuccessful student may take one re-examination within the following regular semester.","source":"ARCH CMU Doctor of Philosophy in Architecture curriculum - qualifying examination","visual":{"icon":"QE","label":"Qualifying Exam","motif":"milestone"}}];

function loadExternalScript(src,timeout=9000){return new Promise((resolve,reject)=>{const existing=[...document.scripts].find(s=>s.src===src);if(existing){if(window.mqtt)return resolve();existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}const s=document.createElement('script');s.src=src;s.async=true;const t=setTimeout(()=>{s.remove();reject(new Error('Script timeout'))},timeout);s.onload=()=>{clearTimeout(t);resolve()};s.onerror=()=>{clearTimeout(t);s.remove();reject(new Error('Script failed'))};document.head.appendChild(s)})}
async function ensureMQTT(){if(window.mqtt)return;for(const src of MQTT_SOURCES){try{brokerLabel='Loading live-room connection…';render();await loadExternalScript(src);if(window.mqtt)return}catch(e){}}throw new Error('The live-room connection could not load. Check the internet connection and refresh.')}
async function connectMQTT(){
 await ensureMQTT();
 for(const url of BROKERS){
   try{
     await new Promise((resolve,reject)=>{

     });
     break;
   }catch(e){}

function subscribeAndAnnounce(){

   client.subscribe(topic('events'),{qos:0});

 }else{

 }

 if(!state||state.phase!=='question'||m.questionIndex!==state.questionIndex||!state.players[m.pid])return;
 const qi=state.questionIndex;hostAnswers[qi]=hostAnswers[qi]||{};if(hostAnswers[qi][m.pid])return;
 const q=Q[qi],choice=Number(m.choice);const elapsed=Math.max(0,Date.now()-state.questionStartedAt);const remaining=Math.max(0,1-elapsed/(ANSWER_SECONDS*1000));const correct=choice===q.correctIndex;const points=correct?700+Math.round(300*remaining):0;
 hostAnswers[qi][m.pid]={choice,correct,points,elapsed};
 const pl=state.players[m.pid];pl.score+=points;pl.correct+=correct?1:0;pl.answered+=1;pl.lastSeen=Date.now();state.answerCount=Object.keys(hostAnswers[qi]).length;
 publishState();render();
}

function newHostState(){return {version:8,room,createdAt:Date.now(),phase:'lobby',phaseEndsAt:0,questionIndex:-1,questionStartedAt:0,sectionIndex:0,answerCount:0,players:{}}}
function startQuiz(){if(!state||Object.keys(state.players).length===0)return;hostAnswers={};for(const p of Object.values(state.players)){p.score=0;p.correct=0;p.answered=0}state.questionIndex=-1;enterSection(0)}
function enterSection(si){state.sectionIndex=si;state.phase='section';state.phaseEndsAt=Date.now()+INTRO_SECONDS*1000;state.answerCount=0;publishState();render()}
function startQuestion(qi){state.questionIndex=qi;state.sectionIndex=sectionIndexForQuestion(qi);state.phase='question';state.questionStartedAt=Date.now();state.phaseEndsAt=Date.now()+ANSWER_SECONDS*1000;state.answerCount=0;hostAnswers[qi]=hostAnswers[qi]||{};publishState();render()}
function revealQuestion(){state.phase='reveal';state.phaseEndsAt=Date.now()+REVEAL_SECONDS*1000;state.answerBreakdown=[0,0,0];for(const a of Object.values(hostAnswers[state.questionIndex]||{}))state.answerBreakdown[a.choice]=(state.answerBreakdown[a.choice]||0)+1;publishState();render()}
function enterLeaderboard(){state.phase='leaderboard';state.phaseEndsAt=Date.now()+BOARD_SECONDS*1000;publishState();render()}
function enterFinal(){state.phase='final';state.phaseEndsAt=0;publishState();render();confetti()}
function nextAfterReveal(){
 const done=state.questionIndex+1;
 if(done>=Q.length){enterFinal();return}
 if(done%10===0){enterLeaderboard();return}
 const next=state.questionIndex+1;
 const nextSection=sectionIndexForQuestion(next);
 if(nextSection!==state.sectionIndex)enterSection(nextSection);else startQuestion(next)
}
function nextAfterLeaderboard(){
 const next=state.questionIndex+1;if(next>=Q.length){enterFinal();return}
 const nextSection=sectionIndexForQuestion(next);if(nextSection!==state.sectionIndex)enterSection(nextSection);else startQuestion(next)
}
function hostTick(){if(role!=='host'||!state)return;const now=Date.now();if(!state.phaseEndsAt||now<state.phaseEndsAt)return;if(state.phase==='section')startQuestion(state.questionIndex+1);else if(state.phase==='question')revealQuestion();else if(state.phase==='reveal')nextAfterReveal();else if(state.phase==='leaderboard')nextAfterLeaderboard()}
function resetQuiz(){if(!confirm('Reset the room and return to the lobby?'))return;state=newHostState();hostAnswers={};publishState();render()}
function skipNow(){if(!state)return;if(state.phase==='section')startQuestion(state.questionIndex+1);else if(state.phase==='question')revealQuestion();else if(state.phase==='reveal')nextAfterReveal();else if(state.phase==='leaderboard')nextAfterLeaderboard()}
window.vqStart=startQuiz;window.vqReset=resetQuiz;window.vqSkip=skipNow;

function render(){
 if(role==='home')return renderHome();
 if(role==='host')return renderHost();
 return renderPlayer();
}
function renderHost(){
 if(!state)return;
 if(state.phase==='lobby')return renderHostLobby();
 if(state.phase==='section')return renderSection(true);
 if(state.phase==='question'||state.phase==='reveal')return renderQuestion(true);
 if(state.phase==='leaderboard')return renderLeaderboard(false,true);
 if(state.phase==='final')return renderFinal(true)
}
function renderHostLobby(){
 const players=sortedPlayers();
 app.innerHTML=shell(`<div class="hostGrid"><section class="panel"><div class="eyebrow">Host lobby</div><h2>Welcome to the Vibe Quiz</h2><p class="lead">Ask everyone to scan the QR code, choose an avatar and enter an English nickname. Start when the participant list is ready.</p>${!connected?`<div class="offlineBanner">${brokerLabel?esc(brokerLabel):'Connecting to the live room…'}</div>`:''}<div class="metrics"><div class="metric"><b>${players.length}</b><span>Players joined</span></div><div class="metric"><b>30</b><span>Questions</span></div><div class="metric"><b>15+3</b><span>Seconds per question</span></div><div class="metric"><b>10</b><span>Questions per checkpoint</span></div></div><h3 style="margin-top:22px">Participants</h3><div class="playerGrid">${players.length?players.map(p=>`<div class="playerCard"><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><small>Ready</small></div></div>`).join(''):`<div class="notice blue">No one has joined yet.</div>`}</div><div class="actions"><button class="btn primary" onclick="vqStart()" ${players.length?'':'disabled'}>Start Round 1</button><button class="btn soft" onclick="location.reload()">Refresh connection</button></div></section><aside class="sidebar"><section class="panel center"><div class="eyebrow">Room code</div><div class="roomCode">${esc(room)}</div><div id="qr" class="qrBox"></div><div class="joinUrl">${esc(joinUrl())}</div></section><section class="panel"><h3>Automatic flow</h3><div class="notice">Section intro → 15 seconds to answer → 3-second answer reveal → automatic next screen. A live ranking appears after every answer reveal. Full checkpoint boards appear after Questions 10, 20 and 30.</div></section></aside></div>`);
 drawQR();
}
function drawQR(){
 const el=document.getElementById('qr');if(!el)return;
 const url=joinUrl();
 const img=document.createElement('img');img.className='qrImage';img.alt='Scan to join room '+room;img.decoding='async';
 if(room===DEFAULT_ROOM){img.src=DEFAULT_JOIN_QR;el.replaceChildren(img);return}
 const primary='https://quickchart.io/qr?size=300&margin=1&ecLevel=M&dark=0a376f&light=ffffff&text='+encodeURIComponent(url);
 const backup='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&color=0-55-111&bgcolor=255-255-255&data='+encodeURIComponent(url);
 let triedBackup=false;img.onerror=()=>{if(!triedBackup){triedBackup=true;img.src=backup}else{el.innerHTML='<div class="notice blue"><b>Open the join link on a phone:</b><br>'+esc(url)+'</div>'}};
 img.src=primary;el.replaceChildren(img);
}
function renderSection(isHost){
 const s=SECTIONS[state.sectionIndex]||SECTIONS[0];const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 app.innerHTML=shell(`<section class="panel sectionIntro" style="--section-accent:${s.accent}"><div class="sectionCopy"><div class="sectionNumber">Round ${state.sectionIndex+1} of ${SECTIONS.length} · ${esc(s.range)}</div><h1 style="font-size:clamp(42px,6vw,72px)">${esc(s.name)}</h1><p class="lead">${esc(s.intro)}</p><div class="countdownPill"><span class="pulseDot"></span>Starting in <b data-countdown>${remain}</b> seconds</div>${isHost?`<div class="actions"><button class="btn soft" onclick="vqSkip()">Start now</button><button class="btn danger" onclick="vqReset()">Reset room</button></div>`:''}</div><div class="sectionVisual"><div class="sectionIcon">${esc(s.icon)}</div></div></section>`)
}
function questionAccent(si){return (SECTIONS[si]||SECTIONS[0]).accent}
function currentRank(pidValue){const ps=sortedPlayers();const i=ps.findIndex(p=>p.id===pidValue);return i<0?null:i+1}
function miniRanking(limit=6){const ps=sortedPlayers().slice(0,limit);return `<div class="rankMini">${ps.map((p,i)=>`<div class="rankMiniRow"><div class="rank">#${i+1}</div><div class="avatar">${esc(p.avatar)}</div><b>${esc(p.name)}</b><div class="score">${p.score}</div></div>`).join('')||'<div class="notice blue">No scores yet.</div>'}</div>`}
function renderQuestion(isHost){
 const q=Q[state.questionIndex];if(!q)return;const reveal=state.phase==='reveal';const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));const selected=lastSubmitted[state.questionIndex];const my=state.players&&state.players[pid];const myAnswer=hostAnswers[state.questionIndex]&&hostAnswers[state.questionIndex][pid];
 const options=q.answers.map((a,i)=>{let cls='option';if(selected===i)cls+=' selected';if(reveal){if(i===q.correctIndex)cls+=' correct';else cls+=' wrong';if(selected===i&&i!==q.correctIndex)cls+=' chosenWrong'}return `<button class="${cls}" ${isHost||reveal||selected!==undefined?'disabled':''} onclick="window.vqAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`}).join('');
 let side='';
 if(isHost){side=`<section class="panel timerCard"><div class="eyebrow">Question ${q.id} of ${Q.length}</div><div class="timer ${!reveal&&remain<=5?'urgent':''}">${reveal?'✓':remain}</div><div class="progress"><div style="width:${reveal?100:Math.max(0,remain/ANSWER_SECONDS*100)}%"></div></div><p style="margin:12px 0 3px;color:var(--muted)">${reveal?'Correct answer + live ranking':'Answers received'}</p><div class="answerCount">${state.answerCount||0}</div><small>of ${Object.keys(state.players||{}).length} players</small><div class="actions" style="justify-content:center"><button class="btn soft" onclick="vqSkip()">Next now</button><button class="btn danger" onclick="vqReset()">Reset</button></div></section><section class="panel"><h3>${reveal?'Ranking after Question '+q.id:'Live room'}</h3>${reveal?miniRanking(8):`<div class="playerGrid">${sortedPlayers().slice(0,6).map(p=>`<div class="playerCard"><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><small>${p.score} pts</small></div></div>`).join('')}</div>`}</section>`}
 else side=`<section class="panel timerCard"><div class="eyebrow">Question ${q.id} of ${Q.length}</div><div class="timer ${!reveal&&remain<=5?'urgent':''}">${reveal?'✓':remain}</div><div class="progress"><div style="width:${reveal?100:Math.max(0,remain/ANSWER_SECONDS*100)}%"></div></div>${my?`<div class="miniMe"><div class="avatar">${esc(my.avatar)}</div><div><b>${esc(my.name)}</b><small>${selected===undefined&&!reveal?'Choose one answer':'Answer locked'}</small></div><div class="ownScore">${my.score} pts</div></div>`:''}${reveal?`${resultForPlayer(q,myAnswer,selected)}${my?`<div class="myRankCard"><div class="avatar">${esc(my.avatar)}</div><div><small>Current position</small><strong>#${currentRank(pid)||'—'}</strong></div><b>${my.score} pts</b></div>`:''}`:selected===undefined?`<div class="waitingAnswer">Select your answer before the timer reaches zero.</div>`:`<div class="notice blue">Answer submitted. Watch the shared screen for the reveal.</div>`}</section>`;
 app.innerHTML=shell(`<div class="questionLayout"><section class="panel questionCard"><div class="visualStage" style="--accent:${questionAccent(state.sectionIndex)}"><div class="visualLines"></div><div class="visualIcon">${esc(q.visual.icon)}</div><div class="visualLabel">${esc(q.visual.label)}</div></div><div class="questionBody"><div class="questionMeta"><span class="category">${esc(q.section)}</span><span class="difficulty">${esc(q.difficulty)}</span></div><div class="questionTitle">${esc(q.question)}</div><div class="options">${options}</div>${reveal?`<div class="resultPanel"><h3>${String.fromCharCode(65+q.correctIndex)} · ${esc(q.answers[q.correctIndex])}</h3><p>${esc(q.explanation)}</p>${q.source?`<div class="source">Verification basis: ${esc(q.source)}</div>`:''}</div>`:''}</div></section><aside class="sidebar">${side}</aside></div>`)
}
function resultForPlayer(q,a,selected){if(selected===undefined)return `<div class="resultPanel bad"><h3>No answer submitted</h3><p>The correct answer was ${String.fromCharCode(65+q.correctIndex)}.</p></div>`;const ok=selected===q.correctIndex;return `<div class="resultPanel ${ok?'':'bad'}"><h3>${ok?'Correct!':'Not this time'}</h3><p>${ok?'Your live score has been updated.':`Correct answer: ${String.fromCharCode(65+q.correctIndex)}`}</p></div>`}
window.vqAnswer=i=>{if(role!=='player'||!state||state.phase!=='question'||lastSubmitted[state.questionIndex]!==undefined)return;lastSubmitted[state.questionIndex]=i;selectedChoice=i;sessionStorage.setItem('vq_lastSubmitted',JSON.stringify(lastSubmitted));publishEvent({type:'answer',pid,questionIndex:state.questionIndex,choice:i});render()};
function renderLeaderboard(finalBoard=false,isHost=false){
 const ps=sortedPlayers(),max=Math.max(1,...ps.map(p=>p.score));const checkpoint=state.questionIndex+1;const title=checkpoint===10?'Checkpoint 1 · Global Design':checkpoint===20?'Checkpoint 2 · Lanna & Chiang Mai':'Final Ranking';const remain=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
 app.innerHTML=shell(`<section class="panel leaderWrap"><div class="leaderHead"><div class="eyebrow">${checkpoint<30?'Stage leaderboard':'Final leaderboard'}</div><h2>${title}</h2><p class="lead" style="margin:0 auto">Scores combine accuracy and response speed. ${checkpoint<30?`The quiz continues automatically in ${remain} seconds.`:'Congratulations to everyone who joined.'}</p></div><div class="leaderboard">${ps.map((p,i)=>`<div class="rankRow"><div class="rank">#${i+1}</div><div class="avatar">${esc(p.avatar)}</div><div><b>${esc(p.name)}</b><div class="bar"><span style="width:${Math.round(p.score/max*100)}%"></span></div><small>${p.correct} correct</small></div><div class="score">${p.score}</div></div>`).join('')||'<div class="notice blue">No scores yet.</div>'}</div>${isHost&&checkpoint<30?`<div class="actions" style="justify-content:center"><button class="btn soft" onclick="vqSkip()">Continue now</button><button class="btn danger" onclick="vqReset()">Reset</button></div>`:''}</section>`)
}
function renderFinal(isHost){
 const ps=sortedPlayers(),top=ps.slice(0,3),slots=[top[1],top[0],top[2]];const cls=['second','first','third'],med=['🥈','🥇','🥉'];
 app.innerHTML=shell(`<section class="panel leaderWrap"><div class="leaderHead"><div class="eyebrow">Quiz complete</div><h1 style="font-size:clamp(44px,7vw,78px)">Final Results</h1><p class="lead" style="margin:0 auto">Thirty questions, five rounds and one shared ARCH CMU learning experience.</p></div><div class="podium">${slots.map((p,i)=>`<div class="podiumBox ${cls[i]}"><div class="medal">${med[i]}</div>${p?`<div class="avatar big">${esc(p.avatar)}</div><b>${esc(p.name)}</b><span>${p.score} points · ${p.correct} correct</span>`:'<b>—</b>'}</div>`).join('')}</div><div class="actions" style="justify-content:center;margin-top:24px">${isHost?`<button class="btn primary" onclick="vqReset()">Return to Lobby</button>`:''}<button class="btn soft" onclick="location.href='${baseUrl()}'">Home</button></div></section>`)
}
function renderJoinForm(message=''){
 app.innerHTML=shell(`<div class="hero"><section class="panel heroCopy"><div class="eyebrow">Join room ${esc(room)}</div><h2>Choose your quiz identity</h2><p class="lead">Enter the name your classmates will recognize, then choose one avatar for the live leaderboard.</p>${message?`<div class="offlineBanner">${esc(message)}</div>`:''}<label class="field"><span>Display name</span><input id="joinName" maxlength="28" value="${esc(displayName)}" placeholder="Your English name"></label><div class="field"><span>Your avatar</span><div class="avatarGrid">${AVATARS.map(a=>`<button class="avatarBtn ${a===selectedAvatar?'selected':''}" onclick="window.pickAvatar('${a}')">${a}</button>`).join('')}</div></div><button class="btn primary block" onclick="window.confirmJoin()">Join Live Quiz</button></section><aside class="heroArt"><div class="heroIcon">${esc(selectedAvatar)}</div><div></div><div class="heroCaption"><strong>Room ${esc(room)}</strong><span>Your avatar and score will appear on the shared leaderboard.</span></div></aside></div>`)
}
window.pickAvatar=a=>{selectedAvatar=a;renderJoinForm()};
window.confirmJoin=async()=>{const n=(document.getElementById('joinName').value||'').trim();if(!n)return renderJoinForm('Please enter a display name.');displayName=n;avatar=selectedAvatar;sessionStorage.setItem('vq_name',displayName);sessionStorage.setItem('vq_avatar',avatar);lastSubmitted=JSON.parse(sessionStorage.getItem('vq_lastSubmitted')||'{}');app.innerHTML=shell('<section class="panel center"><h2>Connecting to the room…</h2><p class="lead" style="margin:auto">Keep this page open during the quiz.</p></section>');try{await connectMQTT();publishEvent({type:'join',pid,name:displayName,avatar});setInterval(()=>publishEvent({type:'ping',pid}),12000)}catch(e){renderJoinForm(e.message)}};
function renderPlayer(){
 if(!displayName)return renderJoinForm();
 if(!state)return app.innerHTML=shell(`<section class="panel center"><h2>Waiting for the host</h2><p class="lead" style="margin:auto">Connected to room <b>${esc(room)}</b>. The lobby will appear when the host is online.</p><div class="avatar big" style="margin:22px auto">${esc(avatar)}</div></section>`);
 if(state.phase==='lobby')return app.innerHTML=shell(`<section class="panel center"><div class="avatar big" style="margin:0 auto 14px">${esc(avatar)}</div><div class="eyebrow">Room ${esc(room)}</div><h2>You are in!</h2><p class="lead" style="margin:0 auto 18px">Welcome, <b>${esc(displayName)}</b>. The host will start the first round soon.</p><div class="notice blue">15 seconds to answer + 3 seconds to reveal. A live ranking appears after every answer reveal. Full checkpoint boards appear after Questions 10, 20 and 30.</div></section>`);
 if(state.phase==='section')return renderSection(false);
 if(state.phase==='question'||state.phase==='reveal')return renderQuestion(false);
 if(state.phase==='leaderboard')return renderLeaderboard(false,false);
 if(state.phase==='final')return renderFinal(false)
}
function confetti(){const box=document.createElement('div');box.className='confetti';const colors=['#f2ae1b','#1769aa','#2c8a5a','#c84c4c','#6f4ab1'];for(let i=0;i<90;i++){const s=document.createElement('span');s.style.left=Math.random()*100+'vw';s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*1.4+'s';s.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),5500)}
function updateCountdowns(){const el=document.querySelector('[data-countdown]');if(el&&state&&state.phaseEndsAt)el.textContent=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));const t=document.querySelector('.timer');if(t&&state&&state.phase==='question'){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));t.textContent=r;t.classList.toggle('urgent',r<=5);const p=document.querySelector('.progress>div');if(p)p.style.width=Math.max(0,r/ANSWER_SECONDS*100)+'%'}if(state&&state.phase==='leaderboard'){const lead=document.querySelector('.leaderHead .lead');if(lead){const r=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));lead.innerHTML=`Scores combine accuracy and response speed. The quiz continues automatically in ${r} seconds.`}}}
async function boot(){
 if(role==='home')return renderHome();
 if(!room){role='home';return renderHome()}
 if(role==='host'){
   const forceNew=params.get('new')==='1';if(forceNew){localStorage.removeItem('vq_host_'+room);localStorage.removeItem('vq_answers_'+room);history.replaceState({},'',baseUrl()+'?host='+room)}const saved=JSON.parse(localStorage.getItem('vq_host_'+room)||'null');state=!forceNew&&saved&&saved.room===room?saved:newHostState();hostAnswers=forceNew?{}:JSON.parse(localStorage.getItem('vq_answers_'+room)||'{}');render();try{await connectMQTT()}catch(e){brokerLabel=e.message;render()}hostTimer=setInterval(hostTick,180);uiTimer=setInterval(updateCountdowns,180)
 }else{
   if(displayName){lastSubmitted=JSON.parse(sessionStorage.getItem('vq_lastSubmitted')||'{}');render();try{await connectMQTT();setInterval(()=>publishEvent({type:'ping',pid}),12000)}catch(e){renderJoinForm(e.message)}}else renderJoinForm();uiTimer=setInterval(updateCountdowns,180)
 }
}
boot();
})();
</script></body></html>
